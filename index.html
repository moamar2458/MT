function normWord(w) {
  return String(w || '').toLowerCase().replace(/[֑-ׇ"'׳״]/g, '')
    .replace(/ך/g, 'כ').replace(/ם/g, 'מ').replace(/ן/g, 'נ').replace(/ף/g, 'פ').replace(/ץ/g, 'צ');
}
function normKey(text) { return String(text || '').split(/\s+/).map(normWord).join(''); }
// The category of an item: looked up in its section first, then in the other one.
function itemCategory(name, scope) {
  if (!name) return '';
  const n = normKey(name);
  const first = scope === 'personal' ? 'personal' : 'business';
  for (const sc of [first, first === 'personal' ? 'business' : 'personal']) {
    const it = getItems(sc).find(x => normKey(x.name) === n);
    if (it) return it.cat || '';
  }
  return '';
}
function editDistance(a, b) {
  const row = [];
  for (let j = 0; j <= b.length; j++) row[j] = j;
  for (let i = 1; i <= a.length; i++) {
    let prev = row[0];
    row[0] = i;
    for (let j = 1; j <= b.length; j++) {
      const keep = row[j];
      row[j] = Math.min(row[j] + 1, row[j - 1] + 1, prev + (a[i - 1] === b[j - 1] ? 0 : 1));
      prev = keep;
    }
  }
  return row[b.length];
}
// Words that are not the item: "שקל", "ש״ח", "על"...
const FILLER_WORDS = ['שקל', 'שקלים', 'שח', 'ש"ח', 'ש״ח', '₪', 'nis', 'ils', 'shekel', 'shekels', 'sheqel', 'על', 'של', 'for', 'of', 'on', 'את'];
function sentenceWords(sentence) {
  // A number stuck to a word ("קיבלתי200", "200שקל") is split off first.
  return String(sentence || '').toLowerCase().replace(/([^\d\s.,])(\d)/g, '$1 $2').replace(/(\d)([^\d\s.,%])/g, '$1 $2').replace(/[.,!?;:()\-،؟]/g, ' ').split(/\s+/).filter(Boolean);
}
// Finds the item from the list that sounds closest to words in what was said.
// Returns { name, used: [the word positions it took] }, or null when nothing is close enough.
function findItem(sentence, scope) {
  const words = sentenceWords(sentence);
  let best = null;
  getItems(scope === 'personal' ? 'personal' : 'business').forEach(it => {
    const parts = it.name.split(/\s+/).filter(Boolean).map(normWord);
    const k = parts.length;
    const target = parts.join('');
    if (!k || !target) return;
    for (let i = 0; i + k <= words.length; i++) {
      const win = words.slice(i, i + k).map(normWord);
      if (win.some(w => /\d/.test(w))) continue;
      const tries = [win.join('')];
      // Small Hebrew words stuck to the front: ו ל ב ה ש ("לצבע", "והסיליקון")
      const m = win[0].match(/^[ולבהש]{1,2}/);
      if (m && win[0].length - m[0].length >= 2) {
        tries.push(win[0].slice(1) + win.slice(1).join(''));
        if (m[0].length === 2) tries.push(win[0].slice(2) + win.slice(1).join(''));
      }
      let score = 0;
      tries.forEach(tr => {
        let s = 0;
        if (tr === target) s = 1;
        else if (Math.max(tr.length, target.length) >= 4) s = 1 - editDistance(tr, target) / Math.max(tr.length, target.length);
        const sk = soundKey(target);
        if (s < 0.85 && target.length >= 3 && sk.length >= 2 && soundKey(tr) === sk) s = 0.85;
        if (s > score) score = s;
      });
      if (score < 0.75) continue;
      const used = [];
      for (let u = i; u < i + k; u++) used.push(u);
      const better = !best || score > best.score || (score === best.score && (k > best.k || (k === best.k && it.name.length > best.name.length)));
      if (better) best = { name: it.name, score: score, k: k, used: used };
    }
  });
  return best;
}
// Finds a category of a section said in the sentence ("100 שקל חשמל"). Returns { name, used } or null.
function findCategoryWord(sentence, scope) {
  const words = sentenceWords(sentence);
  let best = null;
  getCats(scope).forEach(c => {
    const parts = c.split(/\s+/).filter(Boolean).map(normWord);
    const k = parts.length;
    const target = parts.join('');
    if (!k || target.length < 2) return;
    for (let i = 0; i + k <= words.length; i++) {
      const win = words.slice(i, i + k);
      if (win.some(w => /\d/.test(w))) continue;
      const tail = win.slice(1).map(normWord).join('');
      let score = 0;
      wordForms(win[0]).forEach(f => {
        const said = f + tail;
        if (said === target) score = Math.max(score, 1);
        else if (Math.max(said.length, target.length) >= 4) {
          const r = 1 - editDistance(said, target) / Math.max(said.length, target.length);
          if (r >= 0.8) score = Math.max(score, r);
        }
      });
      if (score && (!best || score > best.score)) best = { name: c, score: score, used: parts.map((x, j) => i + j) };
    }
  });
  return best;
}
// What was said, without the item's words (so the card name can be found in the rest).
function withoutItem(sentence, match) {
  if (!match) return sentence;
  return sentenceWords(sentence).filter((w, i) => match.used.indexOf(i) < 0).join(' ');
}

// Turns an entry's day into a real date. New entries have a sortable day; old ones had local date text.
function entryDate(e) {
  if (e.day && /^\d{4}-\d{2}-\d{2}$/.test(e.day)) {
    const p = e.day.split('-');
    return new Date(parseInt(p[0], 10), parseInt(p[1], 10) - 1, parseInt(p[2], 10));
  }
  if (e.date) {
    // Old entries saved the date as local text. Try to read it as a day, month and year; skip if unclear.
    const parts = String(e.date).split(/[\/.\-]/).map(x => parseInt(x, 10));
    if (parts.length === 3 && parts.every(x => !isNaN(x))) {
      let d, m, y;
      if (parts[0] > 31) { y = parts[0]; m = parts[1]; d = parts[2]; }
      else {
        y = parts[2]; if (y < 100) y += 2000;
        // A first number above 12 must be the day (day/month/year). Otherwise use the browser's own order.
        const dayFirst = parts[0] > 12 || !/^1[0-2]?\/\d/.test(String(e.date)) || navigator.language.indexOf('en-US') !== 0;
        if (dayFirst) { d = parts[0]; m = parts[1]; } else { m = parts[0]; d = parts[1]; }
      }
      const date = new Date(y, m - 1, d);
      if (!isNaN(date) && date.getMonth() === m - 1) return date;
    }
  }
  return null;
}
function weekStart(d) { const s = new Date(d.getFullYear(), d.getMonth(), d.getDate()); s.setDate(s.getDate() - s.getDay()); return s; }
function periodKey(d, view) {
  if (view === 'day') return dayKey(d);
  if (view === 'month') return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
  const s = weekStart(d);
  return dayKey(s);
}
function periodLabel(key, view) {
  const p = key.split('-');
  if (view === 'day') return new Date(parseInt(p[0], 10), parseInt(p[1], 10) - 1, parseInt(p[2], 10)).toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
  if (view === 'month') return new Date(parseInt(p[0], 10), parseInt(p[1], 10) - 1, 1).toLocaleDateString(undefined, { year: 'numeric', month: 'long' });
  const start = new Date(parseInt(p[0], 10), parseInt(p[1], 10) - 1, parseInt(p[2], 10));
  const end = new Date(start); end.setDate(end.getDate() + 6);
  return start.toLocaleDateString(undefined, { day: 'numeric', month: 'short' }) + ' - ' + end.toLocaleDateString(undefined, { day: 'numeric', month: 'short' });
}
function cell(text, cls) { const c = document.createElement('div'); if (cls) c.className = cls; c.textContent = text; return c; }

  const leftOf = b => { const tt = boxTotals(b); return tt.income - tt.job; };

function renderSummaries() {
  const t = T();
  renderBusiness();
  document.getElementById('jobDayBtn').classList.toggle('active', jobView === 'day');
  document.getElementById('jobWeekBtn').classList.toggle('active', jobView === 'week');
  document.getElementById('jobMonthBtn').classList.toggle('active', jobView === 'month');
  document.getElementById('jobNameBtn').classList.toggle('active', jobView === 'name');
  // (the personal spending summary was removed)

  // By name: each card on its own line with its totals.
  if (jobView === 'name') {
    const list = document.getElementById('jobSummaryList');
    list.innerHTML = '';
    if (!boxes.length) { list.appendChild(cell(t.noPeriods, 'savedTitle')); return; }
    const head = document.createElement('div');
    head.className = 'periodRow head byName';
    head.append(cell(''), cell(t.colIn), cell(t.colJob), cell(t.colLeft));
    list.appendChild(head);
    let ti = 0, tj = 0;
    boxes.forEach((b, i) => {
      const tt = boxTotals(b);
      ti += tt.income;
      tj += tt.job;
      const row = document.createElement('div');
      row.className = 'periodRow byName clickRow';
      row.title = b.finished ? T().finishedOn + b.finished : '';
      row.append(cell(boxLabel(b, i) + (b.finished ? ' ✓' : ''), 'period'), cell(tt.income.toFixed(2)), cell(tt.job.toFixed(2)), cell((tt.income - tt.job).toFixed(2)));
      row.onclick = () => openApp(b.id);
      list.appendChild(row);
    });
    const total = document.createElement('div');
    total.className = 'periodRow byName totalRow';
    total.append(cell(t.totalLabel, 'period'), cell(ti.toFixed(2)), cell(tj.toFixed(2)), cell((ti - tj).toFixed(2)));
    list.appendChild(total);
    return;
  }

  // Job: every box on its own line, then the total of all the boxes
  const jobPeriods = {};
  boxes.forEach((b, bi) => (b.entries || []).forEach(e => {
    if (e.kind !== 'income' && e.kind !== 'job') return;
    const d = entryDate(e);
    if (!d) return;
    const k = periodKey(d, jobView);
    const period = jobPeriods[k] = jobPeriods[k] || {};
    const row = period[b.id] = period[b.id] || { name: boxLabel(b, bi), income: 0, job: 0, items: [] };
    row[e.kind] += e.amount;
    if (e.kind === 'job') row.items.push(e);
  }));
  const jobBox = document.getElementById('jobSummaryList');
  jobBox.innerHTML = '';
  const jobKeys = Object.keys(jobPeriods).sort().reverse();
  if (jobKeys.length === 0) { jobBox.appendChild(cell(t.noPeriods, 'savedTitle')); }
  else {
    const head = document.createElement('div');
    head.className = 'periodRow head';
    head.append(cell(''), cell(t.colIn), cell(t.colJob), cell(t.colLeft));
    jobBox.appendChild(head);
    jobKeys.forEach((k, idx) => {
      // Each black date bar folds; only the newest is open until you click.
      const foldKey = jobView + '|' + k;
      const open = periodFolds.has(foldKey) ? periodFolds.get(foldKey) : idx === 0;
      const title = document.createElement('div');
      title.className = 'periodTitle foldTitle';
      const periodJob = Object.keys(jobPeriods[k]).reduce((s, id) => s + jobPeriods[k][id].job, 0);
      title.append(cell((open ? '▾ ' : '▸ ') + periodLabel(k, jobView)), cell(periodJob.toFixed(2), 'foldSum'));
      title.onclick = () => { periodFolds.set(foldKey, !open); renderSummaries(); };
      jobBox.appendChild(title);
      if (!open) return;
      let totalIncome = 0, totalJob = 0;
      Object.keys(jobPeriods[k]).forEach(id => {
        const r = jobPeriods[k][id];
        totalIncome += r.income;
        totalJob += r.job;
        const row = document.createElement('div');
        row.className = 'periodRow';
        // Click the name to see only this card's job spending in this period.
        const openKey = jobView + '|' + k + '|' + id;
        const isOpen = openSummaryRows.has(openKey);
        row.classList.add('clickRow');
        row.append(cell((isOpen ? '▾ ' : '▸ ') + r.name, 'period'), cell(r.income.toFixed(2)), cell(r.job.toFixed(2)), cell((r.income - r.job).toFixed(2)));
        row.onclick = () => {
          if (openSummaryRows.has(openKey)) openSummaryRows.delete(openKey); else openSummaryRows.add(openKey);
          renderSummaries();
        };
        jobBox.appendChild(row);
        if (isOpen) {
          const detail = document.createElement('div');
          detail.className = 'periodDetail';
          if (r.items.length === 0) detail.appendChild(cell(t.noSpending, 'savedTitle'));
          r.items.slice().sort((a, b) => (b.day || '').localeCompare(a.day || '')).forEach(e => {
            const line = document.createElement('div');
            line.className = 'detailLine';
            line.append(cell(e.date || ''), cell(shownNote(e) + (itemTag(e) ? ' · ' + itemTag(e) : '')), cell('-' + e.amount.toFixed(2), 'detailAmount'));
            editOnTap(line, e, () => { saveBoxes(); renderHome(); renderSummaries(); });
            detail.appendChild(line);
          });
          // Last line: the total of this card's job spending in this period.
          if (r.items.length) {
            const sumLine = document.createElement('div');
            sumLine.className = 'detailLine detailTotal';
            sumLine.append(cell(''), cell(t.totalLabel + ' - ' + r.name), cell('-' + r.job.toFixed(2), 'detailAmount'));
            detail.appendChild(sumLine);
          }
          jobBox.appendChild(detail);
        }
      });
      const total = document.createElement('div');
      total.className = 'periodRow totalRow';
      total.append(cell(t.totalLabel, 'period'), cell(totalIncome.toFixed(2)), cell(totalJob.toFixed(2)), cell((totalIncome - totalJob).toFixed(2)));
      jobBox.appendChild(total);
    });
  }

  // Personal money (removed)
  return;
  const perPeriods = {};
  personal.forEach(p => {
    const d = entryDate(p);
    if (!d) return;
    const k = periodKey(d, personalView);
    const period = perPeriods[k] = perPeriods[k] || {};
    const dk = dayKey(d);
    period[dk] = (period[dk] || 0) + p.amount;
  });
  const perBox = document.getElementById('personalSummaryList');
  perBox.innerHTML = '';
  const perKeys = Object.keys(perPeriods).sort().reverse();
  if (perKeys.length === 0) { perBox.appendChild(cell(t.noPeriods, 'savedTitle')); }
  else {
    const head = document.createElement('div');
    head.className = 'periodRow head personalRow';
    head.append(cell(''), cell(t.colSpent));
    perBox.appendChild(head);
    perKeys.forEach(k => {
      const title = document.createElement('div');
      title.className = 'periodTitle';
      title.textContent = periodLabel(k, personalView);
      perBox.appendChild(title);
      let total = 0;
      Object.keys(perPeriods[k]).sort().reverse().forEach(dk => {
        const amount = perPeriods[k][dk];
        total += amount;
        const parts = dk.split('-');
        const dayDate = new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
        const row = document.createElement('div');
        row.className = 'periodRow personalRow';
        row.append(cell(dayDate.toLocaleDateString(), 'period'), cell(amount.toFixed(2)));
        perBox.appendChild(row);
      });
      const totalRow = document.createElement('div');
      totalRow.className = 'periodRow personalRow totalRow';
      totalRow.append(cell(t.totalLabel, 'period'), cell(total.toFixed(2)));
      perBox.appendChild(totalRow);
    });
  }
}

// ---- My personal money: what I take out for myself, saved by day ----
function loadPersonal() {
  try { const list = JSON.parse(LS.getItem('money_personal') || '[]'); return Array.isArray(list) ? list : []; } catch (e) { return []; }
}
let personal = []; // loaded in boot(); amounts said with "אישי" on the red/green mics
function savePersonal() { LS.setItem('money_personal', JSON.stringify(personal)); }
function dayKey(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function addPersonal() {
  const input = document.getElementById('pInput');
  const amount = findAmount(input.value);
  if (amount === null) { document.getElementById('fileMsg').textContent = T().typeFirstPlus; return; }
  const now = new Date();
  personal.unshift({ amount: amount, day: dayKey(now), time: now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) });

  input.value = '';
  input.focus();
  renderPersonal();
}
if (document.getElementById('pInput')) document.getElementById('pInput').addEventListener('keydown', e => { if (e.key === 'Enter') addPersonal(); });
function renderPersonal() {
  if (booted) renderPersonalPage();

  const days = {};
  personal.forEach((p, i) => { (days[p.day] = days[p.day] || []).push({ p: p, i: i }); });

  keys.forEach(k => {

    const total = days[k].reduce((s, x) => s + x.p.amount, 0);
    const head = document.createElement('div');
    head.className = 'dayHead';
    const dateText = document.createElement('span');
    const parts = k.split('-');
    dateText.textContent = new Date(parts[0], parts[1] - 1, parts[2]).toLocaleDateString();
    const totalText = document.createElement('span');
    totalText.className = 'dayTotal';
    totalText.textContent = '-' + total.toFixed(2);
    head.append(dateText, totalText);
    block.appendChild(head);
    const ul = document.createElement('ul');
    days[k].forEach(x => {
      const li = document.createElement('li');
      const note = document.createElement('span');
      note.className = 'note';
      note.textContent = (x.p.time || '') + ' ' + T().personalNote;
      const amt = document.createElement('strong');
      amt.textContent = '-' + x.p.amount.toFixed(2);
      li.append(note, amt);
      ul.appendChild(li);
    });
    block.appendChild(ul);
    box.appendChild(block);
  });
}

// ---- Finish a job: it leaves the small boxes and goes into the history box ----
async function finishJob() {
  const box = cur();
  if (!box) return;
  if (!(await askConfirm(T().finishSure))) return;
  box.finished = new Date().toLocaleDateString();
  box.finishedDay = dayKey(new Date());
  saveBoxes();
  closeApp();
}
async function reopenJob(event, id) {
  event.stopPropagation();
  if (!(await askConfirm(T().reopenSure))) return;
  const b = boxes.find(x => x.id === id);
  if (!b) return;
  delete b.finished;
  delete b.finishedDay;
  delete b.checked;
  saveBoxes();
  renderHome();
  renderSummaries();
}
// "נקה היסטוריה": asks first, and only when confirmed deletes every finished job.
async function clearHistory() {
  if (!boxes.some(b => b.finished)) return;
  if (!(await askConfirm(T().clearHistorySure))) return;
  boxes = boxes.filter(b => !b.finished);
  saveBoxes();
  renderHome();
  renderSummaries();
}
function renderHistory() {
  const list = document.getElementById('historyList');
  list.innerHTML = '';
  const done = boxes.map((b, i) => ({ b: b, i: i })).filter(x => x.b.finished);
  document.getElementById('clearHistoryBtn').style.display = done.length ? '' : 'none'; // nothing to clear
  if (done.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'savedTitle';
    empty.textContent = T().noHistory;
    list.appendChild(empty);
    return;
  }
  const head = document.createElement('div');
  head.className = 'histRow head';
  head.append(cell(''), cell(''), cell(T().colIn), cell(T().colJob), cell(T().colLeft), cell(''));

  done.slice().reverse().forEach(x => {
    const tt = boxTotals(x.b);
    const row = document.createElement('div');
    row.className = 'histRow' + (x.b.checked ? ' checked' : '');
    row.onclick = () => openApp(x.b.id);

    check.type = 'checkbox';
    check.checked = !!x.b.checked;
    check.onclick = (ev) => ev.stopPropagation();
    check.onchange = () => {
      x.b.checked = check.checked;
      saveBoxes();
      row.classList.toggle('checked', check.checked);
    };
    const reopen = document.createElement('button');
    reopen.textContent = T().reopen;
    reopen.onclick = (ev) => reopenJob(ev, x.b.id);
    row.append(check, cell(boxLabel(x.b, x.i), 'histName'), cell(tt.income.toFixed(2)), cell(tt.job.toFixed(2)), cell((tt.income - tt.job).toFixed(2)), reopen);
    const dates = document.createElement('div');
    dates.className = 'histDates';
    dates.textContent = T().opened + (x.b.created || '') + '  |  ' + T().finishedOn + x.b.finished;

    list.appendChild(row);
  });
}
// ---- Remember every name that was typed, and let you pick one again ----
function getNames() {
  try { return JSON.parse(LS.getItem('money_names') || '[]'); } catch (e) { return []; }
}
function rememberName(name) {
  const list = getNames().filter(n => n.toLowerCase() !== name.toLowerCase());
  list.unshift(name);
  LS.setItem('money_names', JSON.stringify(list.slice(0, 50)));
}
// The name box: type a name, or click a saved name. It opens on top of the page.
let nameCallback = null;
function openNameDialog(current, onDone) {
  nameCallback = onDone;
  const t = T();
  document.getElementById('nameDialogTitle').textContent = t.renamePrompt;
  document.getElementById('savedTitle').textContent = t.savedNames;
  document.getElementById('nameOk').textContent = t.okBtn;
  document.getElementById('nameCancel').textContent = t.cancelBtn;
  const input = document.getElementById('nameInput');
  input.placeholder = t.nameTyping;
  input.value = current || '';
  document.getElementById('nameMicMsg').textContent = '';
  document.getElementById('nameMic').title = t.nameTyping;
  drawSavedNames();
  document.getElementById('nameOverlay').classList.add('show');
  input.focus();
  input.select();
}
function drawSavedNames() {
  const list = document.getElementById('savedList');
  list.innerHTML = '';
  const typed = document.getElementById('nameInput').value.trim().toLowerCase();
  let saved = getNames();
  // While you type, only the matching names show: names that start with your letters first, then names that contain them.
  if (typed) {
    const starts = saved.filter(n => n.toLowerCase().startsWith(typed));
    const contains = saved.filter(n => !n.toLowerCase().startsWith(typed) && n.toLowerCase().includes(typed));
    saved = starts.concat(contains);
  }
  if (saved.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'savedTitle';
    empty.textContent = typed ? T().noMatch : T().noSaved;
    list.appendChild(empty);
    return;
  }
  saved.forEach(name => {
    const row = document.createElement('div');
    row.className = 'savedItem';
    const pick = document.createElement('button');
    pick.className = 'pick';
    const isMatch = typed && name.toLowerCase().includes(typed);
    if (isMatch) pick.style.fontWeight = 'bold';
    pick.textContent = name;
    pick.onclick = () => closeNameDialog(name);
    const forget = document.createElement('button');
    forget.className = 'forget';
    forget.title = T().forgetName;
    forget.textContent = '\u2715';
    forget.onclick = () => {
      LS.setItem('money_names', JSON.stringify(getNames().filter(n => n !== name)));
      drawSavedNames();
    };
    row.append(pick, forget);
    list.appendChild(row);
  });
}
// The mic in the name window: say the name and it is written into the box (check it, then press OK).
function sayName() {
  const msg = document.getElementById('nameMicMsg');
  startVoice(document.getElementById('nameMic'), msg, text => {
    // "קיבלתי 500 שקל" is money in, never a card name: close the window and save it as income.
    if (nameIsIncome(text)) return;
    const input = document.getElementById('nameInput');
    input.value = String(text || '').trim().replace(/[.!?,]+$/, '').slice(0, 40);
    msg.textContent = '';
    drawSavedNames();
    input.focus();
  });
}
// Said or typed "קיבלתי 500 שקל" in the name window: that is money in, never a card name.
// The window closes and the amount is saved as income (to the open card, or to the card named in the sentence).
function nameIsIncome(text) {
  if (sentenceAction(text) !== 'income') return false;
  nameCallback = null;
  closeNameDialog(null);
  if (currentId) handleText(text);
  else handleHomeText(text, 'income', document.getElementById('startPage').style.display === 'flex' ? document.getElementById('startMsg') : document.getElementById('homeMicMsg'));
  return true;
}
function submitNameDialog() {
  const clean = document.getElementById('nameInput').value.trim();
  if (nameIsIncome(clean)) return;
  closeNameDialog(clean === '' ? null : clean);
}
function closeNameDialog(name) {
  document.getElementById('nameOverlay').classList.remove('show');
  if (dictation && dictation.active()) dictation.stop().catch(() => {});
  const done = nameCallback;
  nameCallback = null;
  if (name !== null && name !== undefined) rememberName(name);
  if (done && name !== null && name !== undefined) done(name);
}
// Every time you type a letter, the matching saved names move to the top.
document.getElementById('nameInput').addEventListener('input', drawSavedNames);
document.getElementById('nameInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') submitNameDialog();
  if (e.key === 'Escape') closeNameDialog(null);
});

  'واحد':1, 'اثنين':2, 'ثلاثة':3, 'ثلاث':3, 'اربعة':4, 'أربعة':4, 'اربع':4, 'خمسة':5, 'خمس':5, 'ستة':6, 'سبعة':7, 'ثمانية':8, 'تسعة':9, 'عشرة':10,
  'عشرين':20, 'ثلاثين':30, 'اربعين':40, 'أربعين':40, 'خمسين':50, 'ستين':60, 'سبعين':70, 'ثمانين':80, 'تسعين':90, 'مئتين':200, 'ميتين':200
};
const HUNDRED_WORDS = ['hundred', 'מאה', 'מאות', 'مئة', 'مائة', 'مية', 'ميه', 'مئات'];
const THOUSAND_WORDS = ['thousand', 'אלף', 'אלפים', 'الف', 'ألف', 'آلاف', 'الاف'];

// Finds the number in what you said or typed: digits first, then number words.
function findAmount(sentence) {
  // Digits written the Arabic way (١٢٣ or ۱۲۳) are turned into 123 first.
  sentence = String(sentence || '').replace(/[٠-٩]/g, d => String(d.charCodeAt(0) - 0x0660)).replace(/[۰-۹]/g, d => String(d.charCodeAt(0) - 0x06F0));
  const match = sentence.match(/(\d+(?:[.,]\d+)?)/);
  if (match) return parseFloat(match[1].replace(',', '.'));
  const words = sentence.toLowerCase().replace(/[-,.]/g, ' ').split(/\s+/);
  let total = 0, found = false, current = 0;
  for (const w of words) {
    const word = w.replace(/^ו/, '');
    const plain = w.replace(/^و/, '');
    if (HUNDRED_WORDS.indexOf(w) >= 0 || HUNDRED_WORDS.indexOf(plain) >= 0) { current = (current || 1) * 100; found = true; continue; }
    if (THOUSAND_WORDS.indexOf(w) >= 0 || THOUSAND_WORDS.indexOf(plain) >= 0) { total += (current || 1) * 1000; current = 0; found = true; continue; }
    if (plain !== w && plain in NUMBER_WORDS) { current += NUMBER_WORDS[plain]; found = true; continue; }
    if (w in NUMBER_WORDS) { current += NUMBER_WORDS[w]; found = true; }
    else if (word in NUMBER_WORDS && word !== w) { current += NUMBER_WORDS[word]; found = true; }
  }
  total += current;
  return found ? total : null;
}

function makeRow(e, i) {
  const box = cur();
  const li = document.createElement('li');
  // One line: what it was (with the date small underneath), the amount, then correct and delete.
  const text = document.createElement('div');
  text.className = 'entryText';
  const note = document.createElement('span');
  note.className = 'note';
  note.textContent = shownNote(e);
  const date = document.createElement('span');
  date.className = 'entryDate';
  date.textContent = e.date || '';
  text.append(note, date); // no category tag in the card
  const amt = document.createElement('strong');
  amt.className = e.kind === 'job' ? 'personal' : e.kind;
  amt.textContent = (e.kind === 'income' ? '+' : '-') + e.amount.toFixed(2);
  const del = document.createElement('button');
  del.className = 'del';
  del.textContent = '\u2715';
  del.onclick = () => { box.entries.splice(i, 1); saveBoxes(); render(); };
  const edit = document.createElement('button');
  edit.className = 'edit';
  edit.title = T().editTitle;
  edit.textContent = '\u270E';
  const saveCard = () => {
    saveBoxes();
    render();
    renderHome();
    renderSummaries();
    heard.textContent = T().corrected + e.amount.toFixed(2);
  };
  edit.onclick = () => openEntryEditor(e, 'business', false, saveCard, li);
  editOnTap(li, e, saveCard);
  li.append(text, amt, edit, del);
  return li;
}

// Draw the open box.
function render() {
  const box = cur();
  if (!box) return;
  listIncome.innerHTML = '';
  listJob.innerHTML = '';
  const totals = { income: 0, job: 0 };
  box.entries.forEach((e, i) => {
    if (e.kind !== 'income' && e.kind !== 'job') return; // older personal entries stay hidden
    totals[e.kind] += e.amount;
    (e.kind === 'job' ? listJob : listIncome).appendChild(makeRow(e, i));
  });
  document.getElementById('tIncome').textContent = totals.income.toFixed(2);
  document.getElementById('tTen').textContent = ((totals.income - totals.job) * box.pct / 100).toFixed(2);
  document.getElementById('tAfterJob').textContent = (totals.income - totals.job).toFixed(2);
  document.getElementById('tJob').textContent = totals.job.toFixed(2);
}

// The percent you can change in the yellow bar. Saved for each box.
function changePct() {
  const box = cur();
  const value = parseFloat(document.getElementById('pctBox').value);
  if (!box || isNaN(value) || value < 0) return;
  box.pct = value;
  saveBoxes();
  render();
}

function addEntry(kind, amount, note, item) {
  const entry = { kind: kind, amount: amount, note: note, date: new Date().toLocaleDateString(), day: dayKey(new Date()) };
  if (item && kind === 'job') entry.item = item;
  cur().entries.unshift(entry);
  saveBoxes();
  render();
}

// ---- Reading a spoken sentence in any order: the amount, the action and the name can be anywhere ----
// "קיבלתי 200 שקל מיפית", "200 שקל קיבלתי מיפית" and "יפית 200 שקל קיבלתי" all mean the same thing.
// Small Hebrew letters stuck to the front of a word (ו ש ה ל מ ב כ) are allowed: "וקיבלתי", "מיפית", "ליפית".
const INCOME_ACTIONS = [
  /^[ושה]?ק(י|יי)?בלתי$/, /^[ושה]?ק(י|יי)?בלנו$/, /^[ושה]?התקבל(ו|ה)?$/, /^[ושה]?נכנס(ו|ה)?$/,
  /^(received|recieved|receive|got)$/,
  /^(و)?[كق]ي?بل(ت|ط)[يى]$/   // "קיבלתי" written in Arabic letters by the speech service
];
const SPEND_ACTIONS = [
  /^[ושה]?ש(י)?למתי$/, /^[ושה]?ש(י)?למנו$/, /^[ושה]?קניתי$/, /^[ושה]?קנינו$/, /^[ושה]?הוצאתי$/,
  /^(paid|bought|spent|pay|buy|spend)$/
];
const SHEKEL_WORDS = /^[ובלמה]?(שקל|שקלים|שח|ש"ח|ש״ח|₪|nis|ils|shekel|shekels|sheqel)$/;
// Little words that are never the name: "from", "to", "for"...
const LINK_WORDS = ['מ', 'מן', 'מאת', 'ל', 'אל', 'את', 'אצל', 'עבור', 'בשביל', 'של', 'על', 'עם', 'היום', 'אתמול', 'כסף', 'from', 'to', 'for', 'by', 'with', 'i', 'today', 'money'];
function cleanWord(w) { return String(w || '').toLowerCase().trim(); }
function isAction(w, list) { const c = cleanWord(w); return list.some(re => re.test(c)); }
function saysShekel(sentence) { return sentenceWords(sentence).some(w => SHEKEL_WORDS.test(cleanWord(w)) || /₪/.test(w)); }
// "קיבלתי" as the speech service may write it: with a letter more or less ("קיבלתיי", "כיבלתי"),
// split in two ("קי בלתי") or in English letters ("kibalti").
const RECEIVED_BASES = ['קיבלתי', 'קבלתי', 'קיבלנו', 'קבלנו'];
function isReceivedWord(w) {
  if (isAction(w, INCOME_ACTIONS)) return true;
  const n = normWord(w).replace(/^[ושה]/, '');
  // At least 5 letters, so short words like "קבלן" (contractor) or "קבלה" (receipt) never count.
  if (n.length >= 5 && RECEIVED_BASES.some(base => editDistance(n, base) <= 1)) return true;
  return /^(k|q|c)h?[ie]?b+[ae]?l+[ae]?t+(i|y|ee|ie)$/.test(cleanWord(w));
}
// Positions of the words that make up "קיבלתי" (one word, or two words that belong together).
function receivedPositions(words) {
  const at = [];
  words.forEach((w, i) => {
    if (isReceivedWord(w)) at.push(i);
    else if (i + 1 < words.length && !isReceivedWord(words[i + 1]) && isReceivedWord(w + words[i + 1])) at.push(i, i + 1);
  });
  return at;
}
// What the sentence asks for: 'income', 'job', or '' when it does not say.
// "קיבלתי" with an amount or the word "שקל" ALWAYS means money in, whichever mic was used.
function sentenceAction(sentence) {
  const words = sentenceWords(sentence);
  const received = receivedPositions(words).length > 0;
  if (received && (findAmount(sentence) !== null || saysShekel(sentence))) return 'income';
  if (!received && words.some(w => isAction(w, SPEND_ACTIONS))) return 'job';
  return '';
}
// The sentence without the action words, so they are not mistaken for an item or a name.
function withoutActions(sentence) {
  const words = sentenceWords(sentence);
  const received = receivedPositions(words);
  return words.filter((w, i) => received.indexOf(i) < 0 && !isAction(w, SPEND_ACTIONS)).join(' ');
}
// ---- Business spending: said with "לעסק" ("50 שקל צבע לעסק") on a red mic ----
const BUSINESS_WORDS = /^(ו?[לב]?ה?עסק|business)$/;
const CUSTOMER_WORDS = /^(ו?[לב]?ה?לקוח(ות|ה|ים)?|customers?|clients?)$/;
function saysCustomers(sentence) { return sentenceWords(sentence).some(w => CUSTOMER_WORDS.test(cleanWord(w))); }
function saysBusiness(sentence) { return sentenceWords(sentence).some(w => BUSINESS_WORDS.test(cleanWord(w))); }
function isNumberWord(w) {
  const c = w.replace(/^[ו]/, '').replace(/^و/, '');
  return (w in NUMBER_WORDS) || (c in NUMBER_WORDS) || HUNDRED_WORDS.indexOf(w) >= 0 || HUNDRED_WORDS.indexOf(c) >= 0 || THOUSAND_WORDS.indexOf(w) >= 0 || THOUSAND_WORDS.indexOf(c) >= 0;
}
// The words that are left for the name, in the order they were said.
function nameWords(sentence, itemMatch) {
  return sentenceWords(sentence)
    .filter((w, i) => !itemMatch || itemMatch.used.indexOf(i) < 0)
    .map(w => w.replace(/["'״׳`]/g, ''))
    .filter(w => w && !/\d/.test(w) && !/₪/.test(w) && !isNumberWord(w) && !SHEKEL_WORDS.test(w) && FILLER_WORDS.indexOf(w) < 0 && LINK_WORDS.indexOf(w) < 0 && !saysPersonal(w));
}
// A word, plus the same word without the small letters stuck to its front ("מיפית" -> "יפית").
function wordForms(w) {
  const n = normWord(w);
  const out = [n];
  const m = n.match(/^[ומלבהשכ]{1,2}/);
  if (m) {
    if (n.length - 1 >= 2) out.push(n.slice(1));
    if (m[0].length === 2 && n.length - 2 >= 2) out.push(n.slice(2));
  }
  return out;
}
// Finds the open card whose name was said, wherever it was in the sentence. Returns { b, i } or null.
function findCard(sentence, itemMatch) {
  const words = nameWords(sentence, itemMatch);
  if (!words.length) return null;
  const active = boxes.map((b, i) => ({ b: b, i: i })).filter(x => !x.b.finished);
  // 1) The card's name (one word or more) appears as words in the sentence, with or without a stuck-on letter.
  const scored = active.map(x => {
    const parts = boxLabel(x.b, x.i).split(/\s+/).filter(Boolean).map(normWord);
    const target = parts.join('');
    const sk = soundKey(target);
    let score = 0;
    if (!target) return { x: x, score: 0 };
    for (let s = 0; s + parts.length <= words.length; s++) {
      const win = words.slice(s, s + parts.length);
      const tail = win.slice(1).map(normWord).join('');
      wordForms(win[0]).forEach((first, fi) => {
        const said = first + tail;
        if (said === target) score = Math.max(score, fi === 0 ? 4 : 3);
        else if (sk.length >= 2 && soundKey(said) === sk) score = Math.max(score, 2);
      });
    }
    return { x: x, score: score };
  });
  const best = Math.max(0, ...scored.map(s => s.score));
  if (best > 0) {
    const top = scored.filter(s => s.score === best);
    if (top.length === 1) return top[0].x;
    return null; // more than one card fits equally: ask
  }
  // 2) Fall back to the older, looser matching on the words that are left.
  const rest = words.join(' ').toLowerCase();
  const exact = active.filter(x => boxLabel(x.b, x.i).toLowerCase() === rest);
  // Very short names or sounds only count when they match exactly, so they don't match every sentence.
  const part = active.filter(x => { const n = boxLabel(x.b, x.i).toLowerCase(); return (rest.length >= 2 && n.includes(rest)) || (n.length >= 2 && rest.includes(n)); });
  const rk = soundKey(rest);
  const alike = rk ? active.filter(x => { const nk = soundKey(boxLabel(x.b, x.i)); return nk && (nk === rk || (rk.length >= 2 && nk.includes(rk)) || (nk.length >= 2 && rk.includes(nk))); }) : [];
  if (exact.length === 1) return exact[0];
  if (part.length === 1) return part[0];
  if (part.length === 0 && alike.length === 1) return alike[0];
  return null;
}

// ---- What is written on an entry ----
// Spending: only what was bought. With an item from the list just the item ("מברשת צבע 13 שקל" -> "מברשת צבע");
// otherwise the words left after taking away the amount, "שקל", the action, "אישי" and the card's name.
// The amount is never written in the text: it is the minus amount.
function spendNote(sentence, item, card) {
  if (item) return item;
  const cardParts = card ? boxLabel(card.b, card.i).split(/\s+/).filter(Boolean).map(normWord) : [];
  return sentenceWords(withoutActions(sentence)).map(w => w.replace(/["'״׳`]/g, ''))
    .filter(w => w && !/\d/.test(w) && !/₪/.test(w) && !isNumberWord(w) && !SHEKEL_WORDS.test(w) && !saysPersonal(w) && !BUSINESS_WORDS.test(w)
      && FILLER_WORDS.indexOf(w) < 0 && LINK_WORDS.indexOf(w) < 0
      && !(cardParts.length && wordForms(w).some(f => cardParts.indexOf(f) >= 0)))
    .join(' ');
}
// Money in, in a customer's card: no text at all (the card already says who it is from, the amount is the plus amount).
function cardNote(kind, sentence, item, card) { return kind === 'income' ? '' : spendNote(sentence, item, card); }
// What an entry shows (the same in the cards, in עסק and in אישי). Older entries were saved with the whole sentence, so the same rules are used when drawing.
function shownNote(e) {
  if (e.custom) return e.note || (e.kind !== 'income' && e.item ? e.item : ''); // text typed in the edit window
  if (e.kind === 'income') return ''; // money in (business or personal): only the date and the plus amount
  if (e.item) return e.item;
  return e.note || '';
}
// The small tag under a spending entry: its category (the text already is the item).
function itemTag(e, scope) { return e.item ? itemCategory(e.item, scope) : (e.cat || ''); }

// The microphone inside a card: a number goes to job spending, unless the sentence says "קיבלתי" (money in).
function handleText(sentence) {
  sentence = (sentence || '').trim();
  if (!sentence) return;
  const t = T();
  const amount = findAmount(sentence);
  if (amount === null) { heard.textContent = t.heardWord + ' "' + sentence + '" ' + t.noAmount; return; }
  const kind = sentenceAction(sentence) || 'job';
  const item = kind === 'job' ? findItem(withoutActions(sentence), 'business') : null;
  if (kind === 'job' && saysBusiness(sentence)) { // "... לעסק": business spending, not this card
    addBusinessSpend(amount, spendNote(sentence, item ? item.name : '', null), item ? item.name : '');
    heard.textContent = t.addedTo + amount.toFixed(2) + ' - ' + t.kinds.business + (item ? ' · ' + item.name : '');
    return;
  }
  addEntry(kind, amount, cardNote(kind, sentence, item ? item.name : '', null), item ? item.name : '');
  heard.textContent = t.addedTo + amount.toFixed(2) + ' - ' + t.kinds[kind] + (item ? ' · ' + item.name : '') + ' (' + t.heardWord + ': "' + sentence + '")';
}

// Adding money in from the Money coming in square.
// The green + in the Money coming in card asks for the amount in a small window.
async function addIncome() {
  const answer = await askText(T().addPlaceholder, '');
  if (answer === null || answer.trim() === '') return;
  const amount = findAmount(answer);
  if (amount === null) { heard.textContent = T().notNumber; return; }
  addEntry('income', amount, ''); // money in: only the date and the plus amount
  heard.textContent = T().addedTo + amount.toFixed(2) + ' - ' + T().kinds.income;
}

// Typing a number and pressing the red arrow adds it to job spending.
function addArrow(kind) {
  const box = document.getElementById('typed');
  kind = sentenceAction(box.value) || kind; // typed "קיבלתי 500 שקל" is money in
  const amount = findAmount(box.value);
  if (amount === null) { heard.textContent = T().typeFirst; return; }
  const typedItem = kind === 'job' ? findItem(box.value, 'business') : null;
  addEntry(kind, amount, cardNote(kind, box.value, typedItem ? typedItem.name : '', null), typedItem ? typedItem.name : '');
  heard.textContent = T().addedTo + amount.toFixed(2) + ' - ' + T().kinds[kind];
  box.value = '';
  box.focus();
}

// ---- Backup by email, and restore (for the open box) ----
function getEmails() {
  try { return JSON.parse(LS.getItem('money_emails') || '[]'); } catch (e) { return []; }
}
function rememberEmail(address) {
  const list = getEmails().filter(a => a.toLowerCase() !== address.toLowerCase());
  list.unshift(address);
  LS.setItem('money_emails', JSON.stringify(list.slice(0, 20)));
}
// The email buttons are on the home screen, so they first ask which box to use.
async function chooseBox(onChosen) {
  if (currentId) { onChosen(cur()); return; }
  const active = boxes.filter(b => !b.finished);
  if (active.length === 1) { onChosen(active[0]); return; }
  const list = boxes.map((b, i) => (i + 1) + ') ' + boxLabel(b, i) + (b.finished ? ' (' + T().finishedOn + b.finished + ')' : '')).join('\n');
  const answer = await askText(T().chooseBox + '\n\n' + list, '1');
  if (answer === null) return;
  const index = parseInt(answer, 10) - 1;
  if (isNaN(index) || index < 0 || index >= boxes.length) return;
  onChosen(boxes[index]);
}
function backupByEmail() { chooseBox(doBackupByEmail); }
function restoreBackup() { chooseBox(doRestoreBackup); }
async function doBackupByEmail(box) {
  const previous = getEmails();
  const hint = previous.length ? previous.join(', ') + ')' : ')';
  const answer = await askText(T().emailPrompt + hint, previous[0] || '');
  if (answer === null) return;
  const address = answer.trim();
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(address)) { document.getElementById('fileMsg').textContent = T().emailBad; return; }
  rememberEmail(address);
  const backup = JSON.stringify({
    app: 'money-tracker',
    saved: new Date().toISOString(),
    entries: box.entries,
    pct: box.pct,
    name: box.name || '',
    lang: lang
  });
  const subject = encodeURIComponent(T().backupSubject + ' ' + new Date().toLocaleDateString());
  const body = encodeURIComponent(backup);
  window.location.href = 'mailto:' + address + '?subject=' + subject + '&body=' + body;
}
async function doRestoreBackup(box) {
  const text = await askText(T().restorePrompt, '');
  if (text === null || text.trim() === '') return;
  const msg = document.getElementById('fileMsg');
  let data;
  try { data = JSON.parse(text.trim()); } catch (e) { msg.textContent = T().restoreBad; return; }
  if (!data || data.app !== 'money-tracker' || !Array.isArray(data.entries)) { msg.textContent = T().restoreBad; return; }
  if (!(await askConfirm(T().restoreSure))) return;
  box.entries = data.entries;
  if (typeof data.pct === 'number') box.pct = data.pct;
  if (data.name) box.name = data.name;
  saveBoxes();
  renderHome();
  msg.textContent = T().restoreOk;
}

// ---- Backup to a file, and load it back without doubles ----
async function saveBackupFile() {
  const data = JSON.stringify({ app: 'money-tracker-all', saved: new Date().toISOString(), boxes: boxes, names: getNames(), items: getItems('business'), cats: getCats('business'), itemsPersonal: getItems('personal'), catsPersonal: getCats('personal'), business: businessSpend }, null, 1);
  const blob = new Blob([data], { type: 'application/json' });
  const stamp = new Date().toISOString().slice(0, 10);
  const fileName = 'money-tracker-backup-' + stamp + '.json';
  // Inside claude.ai, files are saved through the page's own download box.
  const downloads = await claudeUse('downloads');
  if (downloads) {
    try {
      await downloads.save({ filename: fileName, data: data });
      document.getElementById('fileMsg').textContent = T().fileSaved;
    } catch (e) {
      document.getElementById('fileMsg').textContent = T().saveCancelled;
    }
    return;
  }
  // Where supported (Chrome, Edge), open a Save as window so you choose the folder and name.
  if (window.showSaveFilePicker) {
    try {
      const handle = await window.showSaveFilePicker({
        suggestedName: fileName,
        types: [{ description: 'Money tracker backup', accept: { 'application/json': ['.json'] } }]
      });
      const writable = await handle.createWritable();
      await writable.write(blob);
      await writable.close();
      document.getElementById('fileMsg').textContent = T().fileSavedAs + handle.name;
      return;
    } catch (e) {
      if (e && e.name === 'AbortError') { document.getElementById('fileMsg').textContent = T().saveCancelled; return; }
      // If the Save as window is not allowed, fall back to the normal download below.
    }
  }
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = fileName;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  URL.revokeObjectURL(link.href);
  document.getElementById('fileMsg').textContent = T().fileSaved;
}
// Two boxes are the same when they have the same name and exactly the same entries.
function boxFingerprint(b) {
  return JSON.stringify([b.name || '', (b.entries || []).map(e => [e.kind, e.amount, e.note, e.date])]);
}
function loadBackupFile(event) {
  const file = event.target.files && event.target.files[0];
  event.target.value = '';
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    let data;
    try { data = JSON.parse(reader.result); } catch (e) { document.getElementById('fileMsg').textContent = T().fileBad; return; }
    if (!data || data.app !== 'money-tracker-all' || !Array.isArray(data.boxes)) { document.getElementById('fileMsg').textContent = T().fileBad; return; }
    // Personal spending in the file is added too, skipping entries that are already here.
    if (false && Array.isArray(data.personal)) {
      const seen = new Set(personal.map(p => p.day + '|' + p.amount + '|' + p.time));
      data.personal.forEach(p => {
        if (!p || typeof p.amount !== 'number' || !p.day) return;
        const key = p.day + '|' + p.amount + '|' + p.time;
        if (!seen.has(key)) { personal.push(p); seen.add(key); }
      });
      personal.sort((a, b) => (b.day + (b.time || '')).localeCompare(a.day + (a.time || '')));
      savePersonal();
      renderPersonal();
    }
    const have = new Set(boxes.map(boxFingerprint));
    let added = 0, skipped = 0;
    data.boxes.forEach(b => {
      if (!b || !Array.isArray(b.entries)) return;
      if (have.has(boxFingerprint(b))) { skipped++; return; }
      // Same name but different entries: keep both, and tell them apart with a number.
      let name = b.name || '';
      if (name && boxes.some(x => (x.name || '') === name)) {
        let n = 2;
        while (boxes.some(x => (x.name || '') === name + ' (' + n + ')')) n++;
        name = name + ' (' + n + ')';
      }
      const copy = { id: 'b' + Date.now() + '_' + added, name: name, entries: b.entries, pct: typeof b.pct === 'number' ? b.pct : 10, created: b.created || new Date().toLocaleDateString() };
      boxes.push(copy);
      have.add(boxFingerprint(copy));
      added++;
    });
    if (Array.isArray(data.names)) data.names.forEach(n => { if (typeof n === 'string' && n) rememberName(n); });
    // Items and categories in the file are added to the list, skipping ones that are already there.
    const mergeItems = (items, scope) => {
      if (!Array.isArray(items)) return;
      const list = getItems(scope);
      items.forEach(it => { if (it && typeof it.name === 'string' && it.name && !list.some(x => normKey(x.name) === normKey(it.name))) list.push({ name: it.name, cat: typeof it.cat === 'string' ? it.cat : '' }); });
      saveItems(list, scope);
    };
    const mergeCats = (cats, scope) => {
      if (!Array.isArray(cats)) return;
      const have = getCats(scope);
      cats.forEach(c => { if (typeof c === 'string' && c && have.indexOf(c) < 0) have.push(c); });
      saveCats(have, scope);
    };
    mergeItems(data.items, 'business');
    mergeItems(data.itemsPersonal, 'personal');
    mergeCats(data.catsPersonal, 'personal');
    if (Array.isArray(data.business)) {
      const have = new Set(businessSpend.map(x => x.id));
      data.business.forEach(x => { if (x && typeof x.amount === 'number' && !have.has(x.id)) { businessSpend.push(x); have.add(x.id); } });
      saveBusiness();
      renderBusiness();
    }
    mergeCats(data.cats, 'business');
    saveBoxes();
    renderHome();
    document.getElementById('fileMsg').textContent = T().fileResult.replace('{added}', added).replace('{skipped}', skipped);
  };
  reader.readAsText(file);
}

// Job summary and history start as closed bars. Clicking one opens it (and closes the other);
// while one is open the small boxes are drawn smaller to make room.
let openPanel = null; // null, 'business', 'summary' or 'history'
function togglePanel(which) {
  openPanel = openPanel === which ? null : which;
  applyPanels();
}
function applyPanels() {
  document.getElementById('businessBox').classList.toggle('closed', openPanel !== 'business');
  document.getElementById('jobSummary').classList.toggle('closed', openPanel !== 'summary');
  document.getElementById('historyBox').classList.toggle('closed', openPanel !== 'history');
  document.body.classList.toggle('compactBoxes', openPanel !== null);
  document.body.classList.toggle('businessOpen', openPanel === 'business'); // "עסק" open: the small customer cards are hidden
}

// Inside a card the income list is closed: tapping the "כסף שנכנס" total opens it, tapping again closes it.
function toggleIncomeList(open) {
  const list = document.getElementById('listIncome');
  const willOpen = open === undefined ? list.classList.contains('collapsed') : open;
  list.classList.toggle('collapsed', !willOpen);
  const card = document.getElementById('incomeToggle');
  card.classList.toggle('open', willOpen);
  card.setAttribute('aria-expanded', willOpen ? 'true' : 'false');
}
function toggleJobSection(open) {
  const sec = document.getElementById('jobSection');
  const willOpen = open === undefined ? sec.classList.contains('closed') : open;
  sec.classList.toggle('closed', !willOpen);
  document.getElementById('jobToggle').setAttribute('aria-expanded', willOpen ? 'true' : 'false');
}
// Leaving a page: close everything that was opened on it (panels, folded lists, menus, windows, the mic),
// so the page starts fresh the next time.
function resetPageState() {
  if (activeRec) activeRec.cancel();
  if (dictation && dictation.active()) dictation.stop().catch(() => {});
  document.querySelectorAll('.listening').forEach(el => el.classList.remove('listening'));
  // Windows on top
  if (document.getElementById('askOverlay').classList.contains('show')) document.getElementById('askCancel').click();
  document.getElementById('pickOverlay').classList.remove('show');
  if (document.getElementById('nameOverlay').classList.contains('show')) closeNameDialog(null);
  document.getElementById('itemsOverlay').classList.remove('show');
  document.getElementById('itemInput').value = '';
  closeTemplate();
  closeEntryEditor();
  closeInlineEdits();
  document.getElementById('perMsg').textContent = '';
  closeSettings();
  // ניהול כספים: the summary and history panels, their folded lists, and the backup menu
  openPanel = null;
  applyPanels();
  periodFolds.clear();
  openSummaryRows.clear();
  jobView = 'week';
  personalView = 'week';
  personalOpen = null; // the personal page opens with only its three cards
  document.getElementById('bm').style.display = 'none';
  document.getElementById('fileMsg').textContent = '';
  document.getElementById('homeMicMsg').textContent = '';
  // Inside a card: the typed number, the last message, and "הוצאות עבודה" closed again
  document.getElementById('typed').value = '';
  toggleJobSection(false);
  toggleIncomeList(false);
  heard.textContent = '';
  if (booted) { renderSummaries(); renderPersonalPage(); }
  window.scrollTo(0, 0);
}

// Open one box from the home screen, and shrink it back with the button.
function openApp(id) {
  resetPageState(); // leaving the page with the small boxes
  currentId = id;
  document.getElementById('homeRow').style.display = 'none';
  document.getElementById('fileBar').style.display = 'none';
  document.getElementById('middleArea').style.display = 'none';
  document.getElementById('home').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  document.getElementById('pctBox').value = cur().pct;
  heard.textContent = ''; // no hint text; only what was added shows here
  showName();
  render();
}
function closeApp() {
  currentId = null;
  document.getElementById('app').style.display = 'none';
  document.getElementById('homeRow').style.display = 'flex';
  document.getElementById('fileBar').style.display = 'grid';
  document.getElementById('middleArea').style.display = 'flex';
  document.getElementById('home').style.display = ''; // the stylesheet lays the cards out (a grid)
  renderPersonal();
  renderSummaries();
  renderHome();
}

// The microphone listens in the language you picked with the language button.
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
function listen() {
  startVoice(document.getElementById('micBtn'), heard, handleText);
}

// Home microphone: say an amount and a name, like "100 David". The amount goes to that box's job spending.
function listenHome() {
  startVoice(document.getElementById('homeMicBtn'), document.getElementById('homeMicMsg'), handleHomeText);
}
// Turns a name written in English or Hebrew letters into one rough sound spelling, so "Hagai", "Haggai" and the Hebrew spelling all look the same.
function soundKey(text) {
  const heb = { 'א':'', 'ב':'b', 'ג':'g', 'ד':'d', 'ה':'h', 'ו':'v', 'ז':'z', 'ח':'h', 'ט':'t', 'י':'y', 'כ':'k', 'ך':'k', 'ל':'l', 'מ':'m', 'ם':'m', 'נ':'n', 'ן':'n', 'ס':'s', 'ע':'', 'פ':'p', 'ף':'p', 'צ':'ts', 'ץ':'ts', 'ק':'k', 'ר':'r', 'ש':'s', 'ת':'t' };
  let s = String(text || '').toLowerCase().replace(/[\u0591-\u05C7]/g, '');
  s = s.split('').map(ch => (ch in heb) ? heb[ch] : ch).join('');
  s = s.replace(/ch/g, 'h').replace(/kh/g, 'h').replace(/ph/g, 'p').replace(/c/g, 'k').replace(/q/g, 'k').replace(/w/g, 'v').replace(/x/g, 'ks').replace(/j/g, 'g').replace(/[aeiouy]/g, '').replace(/[^a-z]/g, '');
  return s.replace(/(.)\1+/g, '$1');
}
// A small window with buttons to tap. Its microphone opens by itself, so the answer can just be said
// ("אישי", "עסק", or a card's name). options: [{ label, cls, match(text) -> true when the answer means it, pick() }]
let pickOpenId = 0;
function showPick(message, options, onCancel) {
  const t = T();
  const ov = document.getElementById('pickOverlay');
  const list = document.getElementById('pickList');
  const micBtn = document.getElementById('pickMic');
  const micMsg = document.getElementById('pickMicMsg');
  const id = ++pickOpenId;
  let done = false;
  const close = () => {
    done = true;
    ov.classList.remove('show');
    if (activeRec && activeRec.btn === micBtn) activeRec.cancel();
    if (dictation && dictation.active()) dictation.stop().catch(() => {});
  };
  document.getElementById('pickText').textContent = message;
  list.innerHTML = '';
  options.forEach(o => {
    const btn = document.createElement('button');
    if (o.cls) btn.className = o.cls;
    btn.textContent = o.label;
    btn.onclick = () => { close(); o.pick(); };
    list.appendChild(btn);
  });
  const cancel = document.getElementById('pickCancel');
  cancel.textContent = t.cancelBtn;
  cancel.onclick = () => { close(); if (onCancel) onCancel(); };
  const canListen = !!(SR || dictation);
  micBtn.style.display = canListen ? '' : 'none';
  micMsg.textContent = canListen ? hint('pickSayHint') : '';
  const listenAnswer = () => startVoice(micBtn, micMsg, text => {
    if (done || id !== pickOpenId) return;
    const hit = options.filter(o => o.match && o.match(text));
    if (hit.length === 1) { close(); hit[0].pick(text); return; }
    micMsg.textContent = t.heardWord + ' "' + text + '" - ' + t.pickNotUnderstood;
  });
  micBtn.onclick = listenAnswer;
  ov.classList.add('show');
  // Open the microphone by itself (a moment later, so the microphone that was just used has fully stopped).
  if (canListen) setTimeout(() => { if (!done && id === pickOpenId && ov.classList.contains('show') && !activeRec) listenAnswer(); }, 400);
}
// Does a spoken answer name this card?
function answerIsCard(text, b) { const m = findCard(text, null); return !!(m && m.b === b); }
// Spending that matches a category or item in both אישי and עסק: ask which one (tap or say it).
function askSection(sentence, amount, msg, p, b) {
  const t = T();
  showPick(t.pickSection(sentence, amount.toFixed(2)), [
    { label: t.personalBtn, cls: 'pickPersonal', match: saysPersonal, pick: () => {
      addPersonalEntry('job', amount, spendNote(sentence, p.item, null), p.item, p.cat);
      msg.textContent = t.addedTo + amount.toFixed(2) + ' - ' + t.personalOutKind + (p.item || p.cat ? ' · ' + (p.item || p.cat) : '');
    } },
    // Customers: then which customer (a customer's name said as the answer goes straight to that card).
    { label: t.customersLabel, cls: 'pickBusiness', match: text => saysCustomers(text) || !!findCard(text, null), pick: text => {
      const named = text ? findCard(text, null) : null;
      if (named) {
        const entry = { kind: 'job', amount: amount, note: cardNote('job', sentence, b.item, named), date: new Date().toLocaleDateString(), day: dayKey(new Date()) };
        if (b.item) entry.item = b.item;
        named.b.entries.unshift(entry);
        saveBoxes();
        renderHome();
        renderSummaries();
        msg.textContent = t.addedTo + amount.toFixed(2) + ' - ' + t.kinds.job + (b.item ? ' · ' + b.item : '') + ' (' + boxLabel(named.b, named.i) + ')';
        return;
      }
      chooseTarget(sentence, amount, 'job', msg, b.item);
    } }
  ], () => { msg.textContent = t.heardWord + ' "' + sentence + '"'; });
}
// The "where should this go?" window: personal first, then business (for spending), then every open card.
function chooseTarget(sentence, amount, kind, msg, item) {
  const t = T();
  const kindText = (kind === 'income' ? t.kinds.income : t.kinds.job) + (item ? ' · ' + item : '');
  const options = [{ label: t.personalBtn, cls: 'pickPersonal', match: saysPersonal, pick: () => {
    addPersonalEntry(kind, amount, kind === 'income' ? '' : spendNote(sentence, item, null), item);
    msg.textContent = t.addedTo + amount.toFixed(2) + ' - ' + (kind === 'income' ? t.personalInKind : t.personalOutKind) + (item && kind !== 'income' ? ' · ' + item : '');
  } }];
  if (kind !== 'income') options.push({ label: t.businessTitle, cls: 'pickBusiness', match: saysBusiness, pick: () => {
    addBusinessSpend(amount, spendNote(sentence, item, null), item);
    msg.textContent = t.addedTo + amount.toFixed(2) + ' - ' + t.kinds.business + (item ? ' · ' + item : '');
  } });
  boxes.forEach((b, i) => {
    if (b.finished) return;
    options.push({ label: boxLabel(b, i), match: text => answerIsCard(text, b), pick: () => {
      const entry = { kind: kind, amount: amount, note: cardNote(kind, sentence, item, { b: b, i: i }), date: new Date().toLocaleDateString(), day: dayKey(new Date()) };
      if (item && kind === 'job') entry.item = item;
      b.entries.unshift(entry);
      saveBoxes();
      renderHome();
      renderSummaries();
      msg.textContent = t.addedTo + amount.toFixed(2) + ' - ' + t.kinds[kind] + (entry.item ? ' · ' + entry.item : '') + ' (' + boxLabel(b, i) + ')';
    } });
  });
  showPick(t.pickWhere(sentence, amount.toFixed(2), kindText), options, () => { msg.textContent = t.heardWord + ' "' + sentence + '"'; });
}

// kind: 'job' (home mic and red start mic) or 'income' (green start mic).
function handleHomeText(sentence, kind, msgEl) {
  kind = kind || 'job';
  const msg = msgEl || document.getElementById('homeMicMsg');
  sentence = (sentence || '').trim();
  const amount = findAmount(sentence);
  if (amount === null) { msg.textContent = T().heardWord + ' "' + sentence + '" ' + T().noAmount; return; }
  // The words can come in any order. "קיבלתי" (with an amount or "שקל") always means money in,
  // "שילמתי" / "קניתי" means spending; otherwise the mic that was pressed decides.
  kind = sentenceAction(sentence) || kind;
  const plain = withoutActions(sentence); // the action words are not part of the item or the name
  // Spending can also say what it was for ("דוד 50 שקל צבע"): look for an item or a category of each section.
  const spend = kind !== 'income';
  const itemB = spend ? findItem(plain, 'business') : null;
  const itemP = spend ? findItem(plain, 'personal') : null;
  const catB = spend ? findCategoryWord(plain, 'business') : null;
  const catP = spend ? findCategoryWord(plain, 'personal') : null;
  const itemMatch = itemB || itemP;
  let item = itemMatch ? itemMatch.name : '';
  // Spending with "לעסק" goes to the business spending (shown in "עסק"), not to a card.
  if (kind === 'job' && saysBusiness(sentence)) {
    item = itemB ? itemB.name : item;
    addBusinessSpend(amount, spendNote(sentence, item, null), item, item ? '' : (catB || catP || {}).name);
    msg.textContent = T().addedTo + amount.toFixed(2) + ' - ' + T().kinds.business + (item ? ' · ' + item : '');
    return;
  }
  // An amount followed by "אישי" goes to the personal record instead of a card.
  if (saysPersonal(sentence)) {
    item = itemP ? itemP.name : item;
    addPersonalEntry(kind, amount, kind === 'income' ? '' : spendNote(sentence, item, null), item, item ? '' : (catP || catB || {}).name);
    msg.textContent = T().addedTo + amount.toFixed(2) + ' - ' + (kind === 'income' ? T().personalInKind : T().personalOutKind) + (item ? ' · ' + item : '');
    return;
  }
  // Take the number, the item, the action and words like "שקל" away; the card's name is found in what is left.
  // The words of the items and categories found are not the card's name.
  const used = [itemB, itemP, catB, catP].reduce((all, m) => m ? all.concat(m.used) : all, []);
  const match = findCard(plain, { used: used });
  if (!match && spend) {
    // No card named: the section whose items or categories were said gets it ("100 שקל חשמל" -> אישי).
    const inP = !!(itemP || catP), inB = !!(itemB || catB);
    const p = { item: itemP ? itemP.name : '', cat: itemP ? '' : (catP ? catP.name : '') };
    const b = { item: itemB ? itemB.name : '', cat: itemB ? '' : (catB ? catB.name : '') };
    if (inP && !inB) {
      addPersonalEntry('job', amount, spendNote(sentence, p.item, null), p.item, p.cat);
      msg.textContent = T().addedTo + amount.toFixed(2) + ' - ' + T().personalOutKind + ' · ' + (p.item || p.cat);
      return;
    }
    if (inB && !inP) { chooseTarget(sentence, amount, 'job', msg, b.item); return; } // a customers' item: which customer?
    if (inP && inB) { askSection(sentence, amount, msg, p, b); return; }
  }
  // Amount heard but not where it goes (or more than one card fits): ask with buttons.
  if (!match) { chooseTarget(sentence, amount, kind, msg, item); return; }
  if (spend && !itemB && itemP) item = ''; // a card's spending only takes items of the business list
  const entry = { kind: kind, amount: amount, note: cardNote(kind, sentence, item, match), date: new Date().toLocaleDateString(), day: dayKey(new Date()) };
  if (item && kind === 'job') entry.item = item;
  match.b.entries.unshift(entry);
  saveBoxes();
  renderHome();
  renderSummaries();
  msg.textContent = T().addedTo + amount.toFixed(2) + ' - ' + T().kinds[kind] + (entry.item ? ' · ' + entry.item : '') + ' (' + boxLabel(match.b, match.i) + ')';
}

// Nothing shows until the data has loaded.
['homeRow', 'middleArea', 'fileBar'].forEach(id => { document.getElementById(id).style.display = 'none'; });
async function boot() {
  const loading = document.getElementById('loadingPage');
  loading.textContent = 'Loading... / טוען...';
  const voice = claudeUse('dictation');
  try {
    await cloudLoad();
  } catch (e) {
    loading.textContent = '';
    const msg = document.createElement('div');
    msg.textContent = TEXT.he.loadError + ' / ' + TEXT.en.loadError;
    const again = document.createElement('button');
    again.textContent = TEXT.he.tryAgain + ' / ' + TEXT.en.tryAgain;
    again.onclick = boot;
    loading.append(msg, again);
    return;
  }
  dictation = await voice;
  booted = true;
  lang = LS.getItem('money_lang') || 'he';
  boxes = loadBoxes();
  personal = loadPersonal();
  businessSpend = loadBusiness();
  seedItems();
  splitItemSections();
  loading.style.display = 'none';
  applyLang();
  closeApp(); // always start on the home screen with the small boxes
  // Start page: two microphone buttons first. A press on either opens the page with the boxes.
  ['homeRow', 'middleArea', 'fileBar'].forEach(id => { document.getElementById(id).style.display = 'none'; });
  showStartPage(true);
  document.getElementById('startMsg').textContent = hint('startHint');
}
boot();
// Red mic = job spending, green mic = money in. Both: say an amount and the name of a box. They stay on this page.
const startMsg = document.getElementById('startMsg');
document.getElementById('startBlue').onclick = () => startVoice(document.getElementById('startBlue'), startMsg, s => handleHomeText(s, 'job', startMsg));
document.getElementById('startGreen').onclick = () => startVoice(document.getElementById('startGreen'), startMsg, s => handleHomeText(s, 'income', startMsg));
// Purple mic: say a name and a new card (box) with that name is opened. Without voice, type the name instead.
function addBoxByName(name) {
  name = String(name || '').trim().replace(/[.!?,]+$/, '');
  if (!name) { startMsg.textContent = T().cantHear; return; }
  // "קיבלתי 500 שקל" said on the purple mic is money in, not the name of a new card.
  if (sentenceAction(name) === 'income') { handleHomeText(name, 'income', startMsg); return; }
  boxes.push({ id: 'b' + Date.now(), name: name, entries: [], pct: 10, created: new Date().toLocaleDateString() });
  rememberName(name);
  saveBoxes();
  renderHome();
  renderSummaries();
  startMsg.textContent = T().newCardAdded + name;
}
document.getElementById('startPurple').onclick = () => {
  if (!dictation && !SR) { openNameDialog('', addBoxByName); return; }
  startVoice(document.getElementById('startPurple'), startMsg, addBoxByName);
};
// The "אישי" bar opens the personal page.
document.getElementById('personalBtn').onclick = openPersonalPage;
// The button under the mics opens the page with the small boxes.
document.getElementById('enterBtn').onclick = () => { resetPageState(); showStartPage(false); closeApp(); document.getElementById('toFront').style.display = 'block'; };
// The corner button goes back one page: from inside a box to the small boxes, from there to the first page.
// Whatever was opened on the page being left is closed first.
document.getElementById('toFront').onclick = () => {
  resetPageState();
  if (currentId) { closeApp(); return; }
  ['homeRow', 'middleArea', 'fileBar', 'app', 'personalPage'].forEach(id => { document.getElementById(id).style.display = 'none'; });
  document.getElementById('toFront').style.display = 'none';
  showStartPage(true);
  document.getElementById('startMsg').textContent = hint('startHint');
};
