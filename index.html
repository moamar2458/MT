<head>

<title>Money Tracker</title>
<style>

  /* Home screen with small square boxes. */

  .homeMicLine { display: flex; align-items: center; justify-content: center; gap: 10px; direction: ltr; }
  .homeAdd { width: 44px; height: 44px; border-radius: 22px; border: 3px dashed #4a6cf7; background: #f4f6ff; color: #4a6cf7; font-size: 26px; line-height: 1; cursor: pointer; flex-shrink: 0; padding: 0; }
  .homeMicMsg { font-size: 15px; color: #333; min-height: 20px; text-align: center; }
  #homeRow #home { justify-content: center; padding-top: 8px; padding-bottom: 8px; max-width: 100%; height: 172px; overflow-x: hidden; overflow-y: auto; direction: ltr; }
  #homeRow > * { direction: inherit; min-width: 0; }
  #personalArea { flex: 0 0 337px; background: #e7f0ff; border: 2px solid #2a6df4; border-radius: 14px; padding: 12px; margin-top: 20px; max-height: 70vh; display: flex; flex-direction: column; }
  /* (personal spending styles removed) */
  #middleArea { flex: 0 0 auto; display: flex; flex-direction: column; overflow: visible; }
  #summaryRow { display: flex; gap: 16px; direction: ltr; margin: 4px 0 8px 0; align-items: flex-start; flex: 0 1 auto; min-height: 0; }
  .summaryBox { flex: 1; min-width: 0; background: white; border-radius: 12px; padding: 10px; display: flex; flex-direction: column; direction: inherit; min-height: 0; max-height: 100%; overflow: hidden; }
  #jobSummary { border: 2px solid #d97706; }
  #personalSummary { border: 2px solid #2a6df4; }

  .jobColor { color: #d97706; }

  .summaryList { min-height: 0; max-height: 30vh; overflow-y: auto; flex: 0 1 auto; }

  .periodRow .period { text-align: start; font-weight: bold; }

  .periodRow.totalRow { background: #fff3cf; font-weight: bold; border-bottom: 2px solid #d9a400; }

  .histRow.head:hover { background: white; }
  .histRow .histName { text-align: start; font-weight: bold; }

  #fileBar { display: grid; grid-template-columns: repeat(2, max-content); gap: 8px; justify-content: start; direction: ltr; padding: 4px 0 8px 0; flex-shrink: 0; }
  .fileBtn { padding: 8px 14px; font-size: 15px; border: none; border-radius: 8px; background: #4a6cf7; color: white; cursor: pointer; }

  .openedLine { text-align: center; font-size: 14px; color: #888; margin: -4px 0 6px 0; }
  /* The name box that opens on top of the page */
  #nameOverlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 50; align-items: center; justify-content: center; }

  .nameDialog { background: white; border-radius: 16px; padding: 18px; width: 340px; max-width: 92vw; max-height: 85vh; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 8px 30px rgba(0,0,0,0.3); }
  .nameDialog h3 { margin: 0; font-size: 18px; text-align: center; }
  .nameDialog input { width: 100%; padding: 10px; font-size: 16px; border: 1px solid #bbb; border-radius: 8px; }
  .nameDialog .savedTitle { font-size: 15px; color: #666; }
  /* Green box inside a small box: equal cards and one-line rows */
  .cards { display: flex; gap: 8px; margin-bottom: 8px; }
  .card { flex: 1 1 0; min-width: 0; background: white; border-radius: 8px; padding: 8px; text-align: center; display: flex; flex-direction: column; justify-content: center; gap: 2px; }
  .card h3 { margin: 0; font-size: 14px; color: #555; font-weight: normal; }

  .jobCard { background: #fbebeb; border: 2px solid crimson; }
  #pctBox { margin-inline-end: 6px; }
  /* Job summary: name, job spending, left (no income column); click a name to see its spending */

  .foldTitle { display: flex; justify-content: space-between; align-items: center; cursor: pointer; user-select: none; }
  .foldTitle .foldSum { font-weight: normal; opacity: 0.85; direction: ltr; }
  #jobSummaryList .clickRow:hover { background: #fff3e0; }
  #jobSummaryList .clickRow .period { color: #b45f06; }
  .periodDetail { background: #fff8ef; border-bottom: 1px solid #eee; padding: 4px 10px 6px 10px; font-size: 14px; }
  .detailLine { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; padding: 2px 0; align-items: center; }

  .detailTotal { border-top: 1px solid #f0c9a0; margin-top: 3px; padding-top: 4px; font-weight: bold; }
  .card.moneyInCard { position: relative; }

  .col.in .incomeAdd { margin: 0 0 6px 0; }
  .listTitle { font-size: 14px; color: #555; text-align: center; margin: 2px 0 4px 0; }
  .entryList { margin-bottom: 8px; }

  .nameRow { display: flex; gap: 8px; align-items: center; }

.savedTitle { font-size: 15px; color: #666; }
#startPage { display: none; gap: 30px; justify-content: center; align-items: center; flex-direction: column; min-height: 80vh; direction: ltr; }

.startMic .micIcon { font-size: min(52px, 11vw); line-height: 1; }

.startMic.purple .micLabel { font-size: min(19px, 4.5vw); }
/* Job summary and history: a closed bar until clicked; only one is open at a time */

.enterBtn { width: 270px; max-width: 80vw; }

<style id="voiceWalletTheme">
/* ===== New look: dark "voice wallet". Only colours and shapes change; the layout and the buttons stay the same. ===== */
:root {
  --bg: #0F1117; --surface: #1A1D27; --surface2: #232736; --line: #2E3344;
  --text: #F2F3F7; --muted: #9AA0B4; --soft: #C9CDD9;
  --red: #FF6B5B; --redText: #FF8A7D; --redBg: #1F1315; --redLine: #4A2226;
  --green: #34D399; --greenText: #6EE7B7; --greenBg: #11201B; --greenLine: #1F4A3A;
  --violet: #A78BFA; --violetText: #C4B5FD; --violetBg: #1C1730; --violetLine: #3B2F63;
  --blue: #2563EB; --blueText: #93C5FD; --blueBg: #121C2E; --blueLine: #23406E;
  --orange: #FDBA74; --orangeBg: #2A2113; --orangeLine: #4A3518;
  --gold: #FBBF24; --goldBg: #231C0B; --goldLine: #5C4710;
  --num: Rubik, Heebo, Arial, sans-serif;
}
body { background: var(--bg); color: var(--text); font-family: Heebo, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
h1, h2, h3, .enterBtn, .personalBtn, .startMic, .homeMic, .finishBtn, .tile .name, .total, .amount, .num { font-family: var(--num); }
button { font-family: inherit; transition: transform .12s ease, background-color .15s ease, box-shadow .2s ease; }
button:active { transform: scale(0.97); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--violetText); outline-offset: 2px; }
input { background: var(--bg); color: var(--text); border-color: var(--line) !important; }
input::placeholder { color: var(--muted); }
.ico { width: 1em; height: 1em; vertical-align: -0.15em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* Text colours */
.income { color: var(--greenText); }
.personal { color: var(--redText); }
.job, .jobColor { color: var(--orange); }
.blueColor { color: var(--blueText); }
h1 { font-weight: 800; font-size: 24px; letter-spacing: -0.3px; }

/* Corner buttons */
.langBtn, #toFront { height: 44px; min-width: 44px; padding: 0 14px !important; border-radius: 22px !important; border: 1px solid var(--line) !important; background: var(--surface) !important; color: var(--text) !important; font-family: var(--num); font-size: 15px !important; display: flex; align-items: center; justify-content: center; }
#toFront { font-size: 20px !important; }
#toFront[style*="display: block"], #toFront[style*="display:block"] { display: flex !important; }

/* Start page */
#startPage { padding-top: 40px; }
.startMic { border-radius: 30px; gap: 12px; }
.startMic .micIcon { width: 64px; height: 64px; border-radius: 32px; display: flex; align-items: center; justify-content: center; font-size: 30px; }
.startMic .micLabel { font-family: var(--num); }
.startMic.blue { background: var(--redBg); border: 2px solid var(--red); color: var(--redText); }
.startMic.blue .micIcon { background: var(--red); color: #1A0B0A; }
.startMic.green { background: var(--greenBg); border: 2px solid var(--greenLine); color: var(--greenText); }
.startMic.green .micIcon { background: var(--green); color: #062016; }
.startMic.purple { border-radius: 50%; background: var(--violetBg); border: 2px solid var(--violetLine); color: var(--violetText); }
.startMic.purple .micIcon { width: 48px; height: 48px; background: var(--violet); color: #160F2E; font-size: 22px; }
.startMic.blue.listening { box-shadow: 0 0 0 8px rgba(255,107,91,0.18), 0 0 0 20px rgba(255,107,91,0.07); animation: micPulse 1.4s ease-in-out infinite; }
.startMic.green.listening { box-shadow: 0 0 0 8px rgba(52,211,153,0.18), 0 0 0 20px rgba(52,211,153,0.07); animation: micPulse 1.4s ease-in-out infinite; }
.startMic.purple.listening { box-shadow: 0 0 0 8px rgba(167,139,250,0.2), 0 0 0 20px rgba(167,139,250,0.08); animation: micPulse 1.4s ease-in-out infinite; }
@keyframes micPulse { 50% { transform: scale(1.04); } }
@media (prefers-reduced-motion: reduce) { .listening { animation: none !important; } }
#startMsg { color: var(--muted); font-size: 14px; line-height: 1.6; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 12px 16px; }
#startMsg:empty { display: none; }
.enterBtn { height: 56px; padding: 0 24px; border-radius: 18px; background: var(--text); color: var(--bg); font-size: 19px; }
.personalBtn { height: 48px; margin-top: -8px; border-radius: 16px; border: 1px solid var(--blueLine); background: var(--blueBg); color: var(--blueText); font-size: 17px; }

/* Cards page */
.homeMic { width: min(320px, 90vw); height: 52px; border-radius: 18px; border: 1.5px dashed #6D5BB8; background: var(--violetBg); color: var(--violetText); font-size: 18px; font-weight: 700; }
.homeMic.listening { background: #2A2148; }
.homeMicMsg { color: var(--muted); }
.tile { border-radius: 22px; background: var(--surface); border: 1px solid var(--line); padding: 14px; gap: 6px; }
.tile:hover { background: var(--surface2); border-color: #3E4458; }
.tile .name { font-size: 17px; font-weight: 700; color: var(--text); margin-top: 10px; }
.tile .num { font-size: 22px; font-weight: 700; color: var(--orange); direction: ltr; }
.tile .opened { font-size: 11px; color: var(--muted); }
.tile .rename, .tile .removeTile { width: 28px; height: 28px; padding: 0; border-radius: 9px; background: var(--surface2); color: var(--soft); font-size: 13px; display: flex; align-items: center; justify-content: center; }
.tile .removeTile:hover { background: var(--redBg); color: var(--redText); }
.tile .rename:hover { background: #2E3344; color: var(--text); }
body.compactBoxes .tile { border-width: 1px; border-radius: 14px; }
body.compactBoxes .tile .rename, body.compactBoxes .tile .removeTile { width: 20px; height: 20px; font-size: 10px; }

.summaryBox, #historyBox { background: var(--surface); border-radius: 22px; padding: 14px 16px; }
#jobSummary { border: 1px solid var(--orangeLine); }
#historyBox { border: 1px solid var(--violetLine); }
.historyTitle { color: var(--violetText); }
.panelTitle { font-size: 17px; font-weight: 700; }
.viewTabs { background: var(--bg); border-radius: 14px; padding: 4px; gap: 4px; }
.viewTab { flex: 1; height: 36px; border: none; border-radius: 10px; background: transparent; color: var(--muted); font-size: 14px; }
.viewTab.active { background: var(--line); color: var(--text); font-weight: 700; }
#personalPage .viewTab.active { background: var(--blue); color: #fff; }
.periodRow { border-bottom: 1px solid #262A38; font-size: 15px; padding: 8px 6px; }
.periodRow.head { background: var(--surface); color: var(--muted); font-weight: 500; font-size: 12px; }
.periodTitle { background: var(--orangeBg); color: #FDE68A; border-radius: 12px; padding: 8px 12px; margin: 10px 0 4px; }
#personalPage .periodTitle { background: var(--blueBg); color: var(--blueText); }
.periodRow.totalRow { background: var(--orangeBg); border-bottom: none; border-radius: 12px; color: #FDE68A; }
#jobSummaryList .clickRow:hover { background: var(--surface2); }
#jobSummaryList .clickRow .period { color: var(--orange); }
.periodDetail { background: var(--bg); border-bottom: 1px solid #262A38; border-radius: 12px; margin: 2px 0 4px; }
.detailLine > div:first-child { color: var(--muted); }
.detailAmount { color: var(--redText); }
.detailTotal { border-top-color: var(--line); }
.histRow { border-bottom: 1px solid #262A38; }
.histRow:hover { background: var(--surface2); }
.histRow.checked { background: var(--greenBg); }
.histRow.checked:hover { background: #163026; }
.histRow.head, .histRow.head:hover { background: var(--surface); color: var(--muted); }
.histRow .histDates { color: var(--muted); }
.histRow button { background: var(--violet); color: #160F2E; font-weight: 700; border-radius: 9px; padding: 5px 10px; }
.histRow input[type=checkbox] { accent-color: var(--green); }
.savedTitle { color: var(--muted); }

#fileBar { padding: 10px 0 16px; }
.fileBtn { height: 44px; padding: 0 16px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); color: var(--soft); font-size: 15px; }
.fileBtn.load { background: transparent; }
.fileBtn:hover { background: var(--surface2); color: var(--text); }
.fileMsg { color: var(--muted); }

/* Open card */
.openedLine { color: var(--muted); font-size: 12px; }
.titleEdit { width: 32px; height: 32px; padding: 0; border-radius: 10px; background: var(--surface2); color: var(--soft); font-size: 15px; }
.top { flex-direction: row; justify-content: center; gap: 10px; margin-top: 6px; }
.typeArea { width: auto; flex: 0 1 300px; }
button.bigMic { width: 60px; height: 60px; border-radius: 30px; background: var(--red); color: #1A0B0A; font-size: 26px; box-shadow: 0 0 0 6px rgba(255,107,91,0.15); }
button.bigMic.listening { background: var(--red); box-shadow: 0 0 0 8px rgba(255,107,91,0.25), 0 0 0 18px rgba(255,107,91,0.08); animation: micPulse 1.4s ease-in-out infinite; }
.typeRow { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 5px; gap: 6px; }
.typeRow input { flex: 1 1 auto; width: auto; border: none !important; background: transparent; font-family: var(--num); font-size: 18px; padding: 8px 10px; }
.typeRow input:focus { outline: none; }
.typeRow button.arrowJob { width: 46px; height: 42px; padding: 0; border-radius: 12px; background: #3A1A1C; color: var(--redText); font-size: 20px; }
.heard { color: var(--muted); font-size: 14px; margin: 10px 0; }
.col { border-radius: 24px; padding: 16px; margin-bottom: 12px; }
.col.in { background: var(--greenBg); border: 1px solid var(--greenLine); }
.col h2 { font-size: 17px; text-align: start; margin-bottom: 12px; }
.col h2.income { color: var(--greenText); }
.cards { gap: 10px; margin-bottom: 10px; }
.card { background: var(--bg); border-radius: 16px; padding: 12px; text-align: start; gap: 6px; }
.card h3 { color: var(--muted); font-size: 12px; }
.card .total, .card .amount { font-size: 24px; direction: ltr; text-align: end; }
html[dir=ltr] .card .total, html[dir=ltr] .card .amount { text-align: start; }
.card.moneyInCard .addIncome { top: 10px; right: auto; inset-inline-end: 10px; width: 32px; height: 32px; border-radius: 10px; background: var(--green); color: #062016; font-weight: 700; }
.tenBar { background: var(--goldBg); border: 1px solid var(--goldLine); }
.tenBar h3 { color: #FDE68A; }
.tenBar .amount { color: var(--gold); }
.tenBar input { background: var(--bg); color: var(--gold); border: 1px solid #8A6A12 !important; border-radius: 8px; font-family: var(--num); }
.jobCard { background: var(--redBg); border: 1px solid var(--redLine); }
.jobCard h3 { color: var(--redText); }
.listTitle { color: var(--muted); text-align: start; font-size: 12px; margin: 6px 2px; }
li { background: var(--bg); border-radius: 14px; color: var(--text); }
.entryList li { padding: 8px 10px; margin-bottom: 6px; }
.entryList .entryDate { color: var(--muted); font-size: 11px; }
.entryList strong { font-family: var(--num); }
button.edit, button.del { width: 36px; height: 36px; padding: 0; border-radius: 10px; background: var(--surface2); color: var(--soft); font-size: 14px; }
button.del:hover { background: var(--redBg); color: var(--redText); }
button.edit:hover { background: #2E3344; color: var(--text); }
.belowRow { align-items: stretch; gap: 12px; }
.afterJobBox { background: var(--surface); border: 1px solid var(--orangeLine); border-radius: 20px; padding: 12px 14px; }
.afterJobBox h3 { color: var(--muted); font-size: 12px; }
.afterJobBox .total { font-size: 30px; font-weight: 800; direction: ltr; }
.finishWrap { flex: 1; }
.finishBtn { width: 100%; height: 100%; min-height: 56px; border-radius: 18px; background: var(--violet); color: #160F2E; font-size: 17px; }

/* Personal page */
#personalPage { padding-top: 56px; }
#personalPage h1 { color: var(--blueText); }
#personalCards .card { background: var(--blueBg); border: 1px solid var(--blueLine); }
#personalList { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 8px; }
.perLine { border-bottom: 1px solid #262A38; padding: 10px 6px; }
.perLine .perDate { color: var(--muted); font-size: 12px; }
.perLine strong { font-family: var(--num); }
.perTotal { background: var(--blueBg); border-bottom: none; border-radius: 12px; color: var(--blueText); padding: 8px 4px; }
.perTotal span { color: var(--muted); }

/* Windows that open on top */
#nameOverlay, #askOverlay, #pickOverlay { background: rgba(5,6,10,0.72); backdrop-filter: blur(4px); }
.nameDialog { background: var(--surface); border: 1px solid var(--line); border-radius: 24px; padding: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.55); color: var(--text); }
.nameDialog h3 { font-size: 18px; }
.nameDialog input { background: var(--bg); color: var(--text); border-radius: 14px; padding: 12px; }
.nameMic { background: var(--violet); color: #160F2E; }
.nameMic.listening { background: var(--violet); box-shadow: 0 0 0 6px rgba(167,139,250,0.25); }
.nameMicMsg { color: var(--muted); }
.nameDialog .savedTitle { color: var(--muted); font-size: 13px; }
.savedItem button.pick { background: var(--surface2); border: 1px solid var(--line); color: var(--text); border-radius: 14px; }
.savedItem button.pick:hover { background: #2E3344; }
.savedItem button.forget { background: var(--surface2); color: var(--soft); border-radius: 14px; }
.dialogButtons button { height: 46px; padding: 0 22px; border-radius: 14px; font-weight: 700; }
.dialogButtons .okBtn { background: var(--green); color: #062016; }
.dialogButtons .cancelBtn { background: transparent; border: 1px solid var(--line); color: var(--soft); }
#askText, #pickText { color: var(--text); line-height: 1.6; }
#pickList button { min-height: 52px; background: var(--surface2); border: 1px solid var(--line); color: var(--text); border-radius: 16px; font-family: var(--num); font-weight: 500; }
#pickList button:hover { background: #2E3344; border-color: var(--orange); }
#pickList button.pickPersonal { background: var(--blue); border-color: var(--blue); color: #fff; }
#loadingPage { color: var(--muted); }
#loadingPage button { background: var(--violet); color: #160F2E; border-radius: 14px; font-weight: 700; }
#syncMsg { background: var(--redBg); border: 1px solid var(--red); color: var(--redText); border-radius: 14px; padding: 10px; }
</style>
</head>
<body>

<div id="loadingPage">Loading... / טוען...</div>
<div id="syncMsg"></div>
<div id="pickOverlay">
  <div class="nameDialog">
    <p id="pickText"></p>
    <div class="savedList" id="pickList"></div>
    <div class="dialogButtons"><button class="cancelBtn" id="pickCancel"></button></div>
  </div>
</div>
<div id="askOverlay">
  <div class="nameDialog">
    <p id="askText"></p>
    <input type="text" id="askInput">
    <div class="dialogButtons">
      <button class="okBtn" id="askOk"></button>
      <button class="cancelBtn" id="askCancel"></button>
    </div>
  </div>
</div>
<button class="langBtn" id="langBtn" onclick="toggleLang()">English</button>

<div id="startPage">
  <div class="startRow">
    <button class="startMic blue" id="startBlue"><span class="micIcon"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><path d="M12 17v4"/><path d="M8 21h8"/></svg></span><span class="micLabel" data-t="startExpenses"></span></button>
    <button class="startMic green" id="startGreen"><span class="micIcon"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><path d="M12 17v4"/><path d="M8 21h8"/></svg></span><span class="micLabel" data-t="startIncome"></span></button>
  </div>
  <button class="startMic purple" id="startPurple"><span class="micIcon"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><path d="M12 17v4"/><path d="M8 21h8"/></svg></span><span class="micLabel" data-t="startNewCard"></span></button>
  <span class="homeMicMsg" id="startMsg"></span><button class="enterBtn" id="enterBtn" data-t="enterBtn"></button><button class="personalBtn" id="personalBtn"><span data-t="personalBtn"></span> <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><path d="M12 17v4"/><path d="M8 21h8"/></svg></button></div>
<!-- Personal page: what was said with "אישי" on the red and green mics -->
<div id="personalPage" style="display:none">
  <h1 data-t="personalPageTitle"></h1>
  <div class="cards" id="personalCards"></div>
  <div class="viewTabs">
    <button id="perDayBtn" class="viewTab" onclick="setPersonalView('day')" data-t="daily"></button>
    <button id="perWeekBtn" class="viewTab active" onclick="setPersonalView('week')" data-t="weekly"></button>
    <button id="perMonthBtn" class="viewTab" onclick="setPersonalView('month')" data-t="monthly"></button>
  </div>
  <div id="personalList"></div>
</div>
<button id="toFront" aria-label="חזרה" style="display:none;position:fixed;top:8px;right:8px;padding:3px 8px;font-size:22px;border:none;border-radius:8px;background:#333;color:white;cursor:pointer;z-index:10"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><path d="M12 17v4"/><path d="M8 21h8"/></svg></button>
<!-- The small boxes are made by the script below. -->
<div id="homeRow">
  <div id="jobSide">
    <h2 class="sideTitle" style="display:none" data-t="jobTitle"></h2>
    <div class="homeMicRow"><div class="homeMicLine"><button class="homeMic" id="homeMicBtn" onclick="addBox()" data-t="newCardBtn"></button></div><span class="homeMicMsg" id="homeMicMsg"></span></div>
    <div id="home"></div>
  </div>
</div>
<div id="middleArea">
<div id="summaryRow">
  <div class="summaryBox panel closed" id="jobSummary">
    <h2 class="sideTitle jobColor panelTitle" data-t="jobSummaryTitle" onclick="togglePanel('summary')"></h2>
    <div class="viewTabs">
      <button id="jobDayBtn" class="viewTab" onclick="setJobView('day')" data-t="daily"></button>
      <button id="jobWeekBtn" class="viewTab active" onclick="setJobView('week')" data-t="weekly"></button>
      <button id="jobMonthBtn" class="viewTab" onclick="setJobView('month')" data-t="monthly"></button>
    </div>
    <div class="summaryList" id="jobSummaryList"></div>
  </div>
</div>
<div id="historyBox" class="panel closed">
  <h2 class="sideTitle historyTitle panelTitle" data-t="historyTitle" onclick="togglePanel('history')"></h2>
  <div id="historyList"></div>
</div>
</div>
<div id="fileBar"><button class="fileBtn" style="grid-column:1/3" onclick="with(bm.style)display=display?'':'none'" data-t="bk"></button><div id="bm" style="display:none;grid-column:1/3;grid-template-columns:repeat(2,max-content);gap:8px"><button class="fileBtn" onclick="saveBackupFile()" data-t="saveFile"></button>
  <button class="fileBtn load" onclick="document.getElementById('fileInput').click()" data-t="loadFile"></button>
  <button class="fileBtn" onclick="backupByEmail()" data-t="backupBtn"></button>
  <button class="fileBtn load" onclick="restoreBackup()" data-t="restoreBtn"></button>
  <input type="file" id="fileInput" accept=".json,application/json" style="display:none" onchange="loadBackupFile(event)">
  </div><div class="fileMsg" id="fileMsg"></div>
</div>

<!-- The box that opens to choose or type a name -->
<div id="nameOverlay" onclick="closeNameDialog(null)">
  <div class="nameDialog" onclick="event.stopPropagation()">
    <h3 id="nameDialogTitle"></h3>
    <div class="nameRow"><input type="text" id="nameInput" maxlength="40"><button class="nameMic" id="nameMic" aria-label="מיקרופון" onclick="sayName()"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><path d="M12 17v4"/><path d="M8 21h8"/></svg></button></div>
    <div class="nameMicMsg" id="nameMicMsg"></div>
    <div class="savedTitle" id="savedTitle"></div>
    <div class="savedList" id="savedList"></div>
    <div class="dialogButtons">
      <button class="okBtn" id="nameOk" onclick="submitNameDialog()"></button>
      <button class="cancelBtn" id="nameCancel" onclick="closeNameDialog(null)"></button>
    </div>
  </div>
</div>

<div id="app">
<h1><span id="pageTitle"></span> <button class="titleEdit" id="titleEdit" onclick="renameOpenBox()">&#9998;</button></h1>
<div class="openedLine" id="openedLine"></div>

<div class="page">
  <div class="leftSide">
    <div class="top">
      <button class="bigMic" id="micBtn" aria-label="מיקרופון" onclick="listen()"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><path d="M12 17v4"/><path d="M8 21h8"/></svg></button>
      <div class="typeArea">
        <div class="typeRow">
          <input type="text" id="typed" inputmode="decimal" data-p="typePlaceholder">
          <button class="arrowJob" id="arrowJob" onclick="addArrow('job')"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width:2.4"><path d="M12 5v14"/><path d="M6 13l6 6 6-6"/></svg></button>
        </div>
      </div>
    </div>
    <div class="heard" id="heard"></div>

    <div class="col in">
      <h2 class="income" data-t="incomeTitle"></h2>
      <!-- Money in: two equal cards, the add field, then the list -->
      <div class="cards">
        <div class="card moneyInCard">
          <button class="addIncome" onclick="addIncome()" data-t-title="addPlaceholder">+</button>
          <h3 data-t="moneyIn"></h3>
          <div class="total income" id="tIncome">0.00</div>
        </div>
        <div class="card tenBar">
          <h3><input type="number" id="pctBox" min="0" max="100" step="any" value="10" onchange="changePct()" oninput="changePct()">% <span data-t="pctLabel"></span></h3>
          <div class="amount" id="tTen">0.00</div>
        </div>
      </div>
      <ul id="listIncome" class="entryList"></ul>
      <!-- Job spending: its total, then the list -->
      <div class="cards">
        <div class="card jobCard">
          <h3 data-t="jobSpending"></h3>
          <div class="total personal" id="tJob">0.00</div>
        </div>
      </div>
      <div class="listTitle" data-t="jobList"></div>

<script>
// ===== Website version (claude.ai page) =====
// The data lives in the page's own database, readable and changeable only by the owner, so the PC and
// the phone show the same boxes. Layout: app/meta {money_lang, money_names, money_emails, order} and
// app/meta/boxes/<boxId>, one document per box. The rest of the app still talks to "LS", a stand-in for
// localStorage that keeps everything in memory and writes the changes to the database a moment later.
const LS_MEM = {};
const META_KEYS = ['money_lang', 'money_names', 'money_emails'];
let booted = false;
let cloud = null;                        // database references, or null when there is no database
const written = { meta: null, boxes: {}, personal: null }; // what the database holds (as JSON text)
let syncTimer = null, syncing = false, syncAgain = false;
let dictation = null;                    // claude.ai speech-to-text, when this browser has it

const LS = {
  getItem(k) { return Object.prototype.hasOwnProperty.call(LS_MEM, k) ? LS_MEM[k] : null; },
  setItem(k, v) { LS_MEM[k] = String(v); scheduleSync(); },
  removeItem(k) { if (k in LS_MEM) { delete LS_MEM[k]; scheduleSync(); } }
};

function claudeUse(name) {
  const c = window.claude;
  if (!c || typeof c.use !== 'function') return Promise.resolve(null);
  return Promise.resolve(c.use(name)).catch(() => null);
}
function withTimeout(p, ms) { return Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))]); }

function metaFromMem() {
  const m = {};
  META_KEYS.forEach(k => { if (k in LS_MEM) m[k] = LS_MEM[k]; });
  let list = []; try { list = JSON.parse(LS_MEM.money_boxes || '[]'); } catch (e) { list = []; }
  m.order = list.map(b => b.id);
  return m;
}

// Reads everything from the database into memory. Throws if the database can't be reached.
async function cloudLoad() {
  const db = await claudeUse('db');
  if (!db) {
    // Opened outside claude.ai: fall back to this browser's own storage.
    try { Object.keys(localStorage).forEach(k => { if (k.indexOf('money_') === 0) LS_MEM[k] = localStorage.getItem(k); }); } catch (e) { /* none */ }
    return;
  }
  const meta = db.doc('app/meta');
  const boxesCol = meta.collection('boxes');
  const personalDoc = db.doc('app/personal'); // personal money, said with "אישי"
  const snaps = await withTimeout(Promise.all([meta.get(), boxesCol.get(), personalDoc.get()]), 20000);
  const p = snaps[2].exists ? snaps[2].data() : null;
  const personalJson = p && typeof p.list === 'string' ? p.list : null;
  const m = snaps[0].exists ? snaps[0].data() : {};
  const byId = {};
  const fresh = {};
  snaps[1].docs.forEach(d => { if (d.exists) { byId[d.id] = d.data(); fresh[d.id] = JSON.stringify(d.data()); } });
  const order = Array.isArray(m.order) ? m.order : [];
  const list = order.filter(id => byId[id]).map(id => byId[id]);
  Object.keys(byId).forEach(id => { if (order.indexOf(id) < 0) list.push(byId[id]); });
  Object.keys(LS_MEM).forEach(k => delete LS_MEM[k]);
  META_KEYS.forEach(k => { if (typeof m[k] === 'string') LS_MEM[k] = m[k]; });
  if (list.length) LS_MEM.money_boxes = JSON.stringify(list);
  if (personalJson) LS_MEM.money_personal = personalJson;
  written.boxes = fresh;
  written.meta = snaps[0].exists ? JSON.stringify(metaFromMem()) : null;
  written.personal = personalJson;
  cloud = { meta: meta, boxesCol: boxesCol, personal: personalDoc };
}

function scheduleSync() {
  if (!booted) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(() => { syncTimer = null; syncNow(); }, 400);
}
function showSyncError(text) {
  const el = document.getElementById('syncMsg');
  el.textContent = text;
  el.style.display = text ? 'block' : 'none';
}
// Writes only what changed: each box that changed, boxes that were deleted, then the names and settings.
async function syncNow() {
  if (!cloud) {
    try { Object.keys(LS_MEM).forEach(k => localStorage.setItem(k, LS_MEM[k])); } catch (e) { /* none */ }
    return;
  }
  if (syncing) { syncAgain = true; return; }
  syncing = true;
  try {
    let list = []; try { list = JSON.parse(LS_MEM.money_boxes || '[]'); } catch (e) { list = []; }
    const now = {};
    for (const b of list) {
      const json = JSON.stringify(b);
      now[b.id] = true;
      if (written.boxes[b.id] !== json) { await cloud.boxesCol.doc(b.id).set(JSON.parse(json)); written.boxes[b.id] = json; }
    }
    for (const id of Object.keys(written.boxes)) {
      if (!now[id]) { await cloud.boxesCol.doc(id).delete(); delete written.boxes[id]; }
    }
    const m = JSON.stringify(metaFromMem());
    if (written.meta !== m) { await cloud.meta.set(JSON.parse(m)); written.meta = m; }
    const pl = LS_MEM.money_personal || '[]';
    if (written.personal !== pl && !(written.personal === null && pl === '[]')) { await cloud.personal.set({ list: pl }); written.personal = pl; }
    showSyncError('');
  } catch (e) {
    showSyncError(T().syncError);
    setTimeout(scheduleSync, 5000);
  } finally {
    syncing = false;
    if (syncAgain) { syncAgain = false; scheduleSync(); }
  }
}

// When you come back to this tab (for example after adding something on the phone), get the latest data.
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState !== 'visible' || !booted || !cloud || syncing || syncTimer) return;
  if (document.getElementById('nameOverlay').classList.contains('show') || document.getElementById('askOverlay').classList.contains('show')) return;
  try { await cloudLoad(); } catch (e) { return; }
  if (syncing || syncTimer) return;
  lang = LS.getItem('money_lang') || 'he';
  boxes = loadBoxes();
  personal = loadPersonal();
  if (currentId && !cur()) closeApp();
  applyLang();
});

// Question boxes on the page itself (the browser's own pop-ups are blocked inside claude.ai).
function ask(message, withInput, def) {
  return new Promise(resolve => {
    const ov = document.getElementById('askOverlay');
    const inp = document.getElementById('askInput');
    const ok = document.getElementById('askOk');
    const cancel = document.getElementById('askCancel');
    document.getElementById('askText').textContent = message;
    inp.style.display = withInput ? '' : 'none';
    inp.value = withInput && def !== undefined && def !== null ? String(def) : '';
    ok.textContent = T().okBtn;
    cancel.textContent = T().cancelBtn;
    const finish = v => { ov.classList.remove('show'); ok.onclick = cancel.onclick = inp.onkeydown = null; resolve(v); };
    ok.onclick = () => finish(withInput ? inp.value : true);
    cancel.onclick = () => finish(withInput ? null : false);
    inp.onkeydown = e => { if (e.key === 'Enter') ok.onclick(); if (e.key === 'Escape') cancel.onclick(); };
    ov.classList.add('show');
    if (withInput) { inp.focus(); inp.select(); } else ok.focus();
  });
}
function askConfirm(message) { return ask(message, false); }
function askText(message, def) { return ask(message, true, def); }

// The microphone: claude.ai speech-to-text, or the browser's own when that is all there is.
// It stops by itself a moment after you finish talking. Press again to stop sooner.
// Chrome's own recognition (set to he-IL) is best at Hebrew, so it is tried first. If this page is not
// allowed to use it (for example inside claude.ai), that is remembered and claude.ai's speech-to-text is used.
const SR_BLOCKED_KEY = 'mt-browser-speech-blocked';
function browserSpeechBlocked() { try { return localStorage.getItem(SR_BLOCKED_KEY) === '1'; } catch (e) { return false; } }
function markBrowserSpeechBlocked() { try { localStorage.setItem(SR_BLOCKED_KEY, '1'); } catch (e) { /* ignore */ } }
let browserSpeechFailed = false; // also kept for this visit, in case storage is not allowed

function startVoice(btn, msgEl, onText) {
  const t = T();
  if (SR && !browserSpeechFailed && !browserSpeechBlocked()) {
    const rec = new SR();
    rec.lang = t.micLang;
    let got = false;
    rec.onstart = () => { btn.classList.add('listening'); msgEl.textContent = t.listening; };
    rec.onend = () => { btn.classList.remove('listening'); };
    rec.onerror = e => {
      btn.classList.remove('listening');
      const blocked = ['not-allowed', 'service-not-allowed', 'audio-capture', 'network'].indexOf(e.error) >= 0;
      if (blocked && dictation) {
        browserSpeechFailed = true;
        markBrowserSpeechBlocked();
        msgEl.textContent = t.pressAgain;
      } else if (!got) msgEl.textContent = t.cantHear;
    };
    rec.onresult = e => { got = true; onText(e.results[0][0].transcript); };
    try { rec.start(); return; } catch (err) { browserSpeechFailed = true; }
  }
  if (dictation) {
    if (dictation.active()) { dictation.stop().catch(() => {}); return; }
    let text = '';
    let timer = null;
    const offs = [];
    const stopIn = ms => { clearTimeout(timer); timer = setTimeout(() => dictation.stop().catch(() => {}), ms); };
    const done = () => { offs.forEach(off => off()); offs.length = 0; clearTimeout(timer); btn.classList.remove('listening'); };
    const explain = code => {
      if (code === 'not_granted') msgEl.textContent = t.micBlocked;
      else if (code === 'unavailable') msgEl.textContent = t.noVoice;
      else if (code !== 'dismissed' && code !== 'stopped' && code !== 'viewer_stopped' && code !== 'hidden') msgEl.textContent = t.cantHear;
    };
    offs.push(dictation.onPartial(e => { if (e.text) { clearTimeout(timer); msgEl.textContent = t.listening + ' "' + e.text + '"'; } }));
    offs.push(dictation.onFinal(e => { text += e.text; stopIn(1500); }));
    offs.push(dictation.onState(e => {
      if (e.state === 'listening') { btn.classList.add('listening'); msgEl.textContent = t.listening; stopIn(8000); }
      if (e.state !== 'idle') return;
      done();
      if (text.trim()) onText(text.trim());
      else if (e.reason === 'stopped' || e.reason === 'viewer_stopped') msgEl.textContent = t.cantHear;
      else explain(e.reason);
    }));
    // Must start straight from the click.
    dictation.start({ language: lang }).catch(err => { if (!dictation.active() && offs.length) { done(); explain(err && err.code); } });
    return;
  }
  if (!SR) { msgEl.textContent = t.noVoice; return; }
  const rec = new SR();
  rec.lang = t.micLang;
  rec.onstart = () => { btn.classList.add('listening'); msgEl.textContent = t.listening; };
  rec.onend = () => { btn.classList.remove('listening'); };
  rec.onerror = () => { btn.classList.remove('listening'); msgEl.textContent = t.cantHear; };
  rec.onresult = e => onText(e.results[0][0].transcript);
  rec.start();
}

// ---- Personal: amounts said with "אישי" (or "personal") on the red and green mics ----
// The speech service sometimes writes "אישי" in Arabic or English letters, so those spellings count too.
// "פרטי" (private) also works, as a word that is harder to mishear.
const PERSONAL_WORDS = [
  /^ו?[לב]?ה?אישי(ת|ים)?$/, /^ו?[לב]?ה?פרטי(ת)?$/, /^ו?ל?עישי$/,
  /^(personal|private|ishi|ishy|ishe|ishee|eeshi|eshi|ichi|ishi\.)$/,
  // "פרטי" heard as English or Arabic letters
  /^(party|parti|partie|prati|pratti|praty|pratty|pratie|preti|frati|parati|parity)$/,
  /^(و?ل?)?(ب|ف|پ)ا?(ر|ل)(ت|ط)(ي|ى|ی)$/,
  /^(و?ل?)?[اإأآ][يى]?ش[يى]$/, /^(و?ل?)?[اإأآ]يش[يىه]$/, /^(و?ل?)?عيش[يى]$/
];
function saysPersonal(sentence) {
  const words = String(sentence || '').toLowerCase().replace(/[.,!?;:"'()\-،؟]/g, ' ').split(/\s+/).filter(Boolean);
  return words.some(w => PERSONAL_WORDS.some(re => re.test(w)));
}

// Turns an entry's day into a real date. New entries have a sortable day; old ones had local date text.
function entryDate(e) {
  if (e.day && /^\d{4}-\d{2}-\d{2}$/.test(e.day)) {
    const p = e.day.split('-');
    return new Date(parseInt(p[0], 10), parseInt(p[1], 10) - 1, parseInt(p[2], 10));
  }
  if (e.date) {
    // Old entries saved the date as local text. Try to read it as a day, month and year; skip if unclear.
    const parts = String(e.date).split(/[\/.\-]/).map(x => parseInt(x, 10));
    if (parts.length === 3 && parts.every(x => !isNaN(x))) {
      let d, m, y;
      if (parts[0] > 31) { y = parts[0]; m = parts[1]; d = parts[2]; }
      else {
        y = parts[2]; if (y < 100) y += 2000;
        // A first number above 12 must be the day (day/month/year). Otherwise use the browser's own order.
        const dayFirst = parts[0] > 12 || !/^1[0-2]?\/\d/.test(String(e.date)) || navigator.language.indexOf('en-US') !== 0;
        if (dayFirst) { d = parts[0]; m = parts[1]; } else { m = parts[0]; d = parts[1]; }
      }
      const date = new Date(y, m - 1, d);
      if (!isNaN(date) && date.getMonth() === m - 1) return date;
    }
  }
  return null;
}
function weekStart(d) { const s = new Date(d.getFullYear(), d.getMonth(), d.getDate()); s.setDate(s.getDate() - s.getDay()); return s; }
function periodKey(d, view) {
  if (view === 'day') return dayKey(d);
  if (view === 'month') return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
  const s = weekStart(d);
  return dayKey(s);
}
function periodLabel(key, view) {
  const p = key.split('-');
  if (view === 'day') return new Date(parseInt(p[0], 10), parseInt(p[1], 10) - 1, parseInt(p[2], 10)).toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
  if (view === 'month') return new Date(parseInt(p[0], 10), parseInt(p[1], 10) - 1, 1).toLocaleDateString(undefined, { year: 'numeric', month: 'long' });
  const start = new Date(parseInt(p[0], 10), parseInt(p[1], 10) - 1, parseInt(p[2], 10));
  const end = new Date(start); end.setDate(end.getDate() + 6);
  return start.toLocaleDateString(undefined, { day: 'numeric', month: 'short' }) + ' - ' + end.toLocaleDateString(undefined, { day: 'numeric', month: 'short' });
}
function cell(text, cls) { const c = document.createElement('div'); if (cls) c.className = cls; c.textContent = text; return c; }
function renderSummaries() {
  const t = T();
  document.getElementById('jobDayBtn').classList.toggle('active', jobView === 'day');
  document.getElementById('jobWeekBtn').classList.toggle('active', jobView === 'week');
  document.getElementById('jobMonthBtn').classList.toggle('active', jobView === 'month');
  // (the personal spending summary was removed)

  // Job: every box on its own line, then the total of all the boxes
  const jobPeriods = {};
  boxes.forEach((b, bi) => (b.entries || []).forEach(e => {
    if (e.kind !== 'income' && e.kind !== 'job') return;
    const d = entryDate(e);
    if (!d) return;
    const k = periodKey(d, jobView);
    const period = jobPeriods[k] = jobPeriods[k] || {};
    const row = period[b.id] = period[b.id] || { name: boxLabel(b, bi), income: 0, job: 0, items: [] };
    row[e.kind] += e.amount;
    if (e.kind === 'job') row.items.push(e);
  }));
  const jobBox = document.getElementById('jobSummaryList');
  jobBox.innerHTML = '';
  const jobKeys = Object.keys(jobPeriods).sort().reverse();
  if (jobKeys.length === 0) { jobBox.appendChild(cell(t.noPeriods, 'savedTitle')); }
  else {
    const head = document.createElement('div');
    head.className = 'periodRow head';
    head.append(cell(''), cell(t.colJob), cell(t.colLeft));
    jobBox.appendChild(head);
    jobKeys.forEach((k, idx) => {
      // Each black date bar folds; only the newest is open until you click.
      const foldKey = jobView + '|' + k;
      const open = periodFolds.has(foldKey) ? periodFolds.get(foldKey) : idx === 0;
      const title = document.createElement('div');
      title.className = 'periodTitle foldTitle';
      const periodJob = Object.keys(jobPeriods[k]).reduce((s, id) => s + jobPeriods[k][id].job, 0);
      title.append(cell((open ? '▾ ' : '▸ ') + periodLabel(k, jobView)), cell(periodJob.toFixed(2), 'foldSum'));
      title.onclick = () => { periodFolds.set(foldKey, !open); renderSummaries(); };
      jobBox.appendChild(title);
      if (!open) return;
      let totalIncome = 0, totalJob = 0;
      Object.keys(jobPeriods[k]).forEach(id => {
        const r = jobPeriods[k][id];
        totalIncome += r.income;
        totalJob += r.job;
        const row = document.createElement('div');
        row.className = 'periodRow';
        // Click the name to see only this card's job spending in this period.
        const openKey = jobView + '|' + k + '|' + id;
        const isOpen = openSummaryRows.has(openKey);
        row.classList.add('clickRow');
        row.append(cell((isOpen ? '▾ ' : '▸ ') + r.name, 'period'), cell(r.job.toFixed(2)), cell((r.income - r.job).toFixed(2)));
        row.onclick = () => {
          if (openSummaryRows.has(openKey)) openSummaryRows.delete(openKey); else openSummaryRows.add(openKey);
          renderSummaries();
        };
        jobBox.appendChild(row);
        if (isOpen) {
          const detail = document.createElement('div');
          detail.className = 'periodDetail';
          if (r.items.length === 0) detail.appendChild(cell(t.noSpending, 'savedTitle'));
          r.items.slice().sort((a, b) => (b.day || '').localeCompare(a.day || '')).forEach(e => {
            const line = document.createElement('div');
            line.className = 'detailLine';
            line.append(cell(e.date || ''), cell(e.note || ''), cell('-' + e.amount.toFixed(2), 'detailAmount'));
            detail.appendChild(line);
          });
          // Last line: the total of this card's job spending in this period.
          if (r.items.length) {
            const sumLine = document.createElement('div');
            sumLine.className = 'detailLine detailTotal';
            sumLine.append(cell(''), cell(t.totalLabel + ' - ' + r.name), cell('-' + r.job.toFixed(2), 'detailAmount'));
            detail.appendChild(sumLine);
          }
          jobBox.appendChild(detail);
        }
      });
      const total = document.createElement('div');
      total.className = 'periodRow totalRow';
      total.append(cell(t.totalLabel, 'period'), cell(totalJob.toFixed(2)), cell((totalIncome - totalJob).toFixed(2)));
      jobBox.appendChild(total);
    });
  }

  // Personal money (removed)
  return;
  const perPeriods = {};
  personal.forEach(p => {
    const d = entryDate(p);
    if (!d) return;
    const k = periodKey(d, personalView);
    const period = perPeriods[k] = perPeriods[k] || {};
    const dk = dayKey(d);
    period[dk] = (period[dk] || 0) + p.amount;
  });
  const perBox = document.getElementById('personalSummaryList');
  perBox.innerHTML = '';
  const perKeys = Object.keys(perPeriods).sort().reverse();
  if (perKeys.length === 0) { perBox.appendChild(cell(t.noPeriods, 'savedTitle')); }
  else {
    const head = document.createElement('div');
    head.className = 'periodRow head personalRow';
    head.append(cell(''), cell(t.colSpent));
    perBox.appendChild(head);
    perKeys.forEach(k => {
      const title = document.createElement('div');
      title.className = 'periodTitle';
      title.textContent = periodLabel(k, personalView);
      perBox.appendChild(title);
      let total = 0;
      Object.keys(perPeriods[k]).sort().reverse().forEach(dk => {
        const amount = perPeriods[k][dk];
        total += amount;
        const parts = dk.split('-');
        const dayDate = new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
        const row = document.createElement('div');
        row.className = 'periodRow personalRow';
        row.append(cell(dayDate.toLocaleDateString(), 'period'), cell(amount.toFixed(2)));
        perBox.appendChild(row);
      });
      const totalRow = document.createElement('div');
      totalRow.className = 'periodRow personalRow totalRow';
      totalRow.append(cell(t.totalLabel, 'period'), cell(total.toFixed(2)));
      perBox.appendChild(totalRow);
    });
  }
}

function loadPersonal() {
  try { const list = JSON.parse(LS.getItem('money_personal') || '[]'); return Array.isArray(list) ? list : []; } catch (e) { return []; }
}
let personal = []; // loaded in boot(); amounts said with "אישי" on the red/green mics

function dayKey(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function addPersonal() {

// ---- Finish a job: it leaves the small boxes and goes into the history box ----
async function finishJob() {
  const box = cur();
  if (!box) return;
  if (!(await askConfirm(T().finishSure))) return;
  box.finished = new Date().toLocaleDateString();
  box.finishedDay = dayKey(new Date());
  saveBoxes();
  closeApp();
}
async function reopenJob(event, id) {
  event.stopPropagation();
  if (!(await askConfirm(T().reopenSure))) return;
  const b = boxes.find(x => x.id === id);
  if (!b) return;
  delete b.finished;
  delete b.finishedDay;
  delete b.checked;
  saveBoxes();
  renderHome();
  renderSummaries();
}
function renderHistory() {
  const list = document.getElementById('historyList');
  list.innerHTML = '';
  const done = boxes.map((b, i) => ({ b: b, i: i })).filter(x => x.b.finished);
  if (done.length === 0) {

  const head = document.createElement('div');

  head.append(cell(''), cell(''), cell(T().colIn), cell(T().colJob), cell(T().colLeft), cell(''));
  list.appendChild(head);
  done.slice().reverse().forEach(x => {
    const tt = boxTotals(x.b);
    const row = document.createElement('div');

    check.checked = !!x.b.checked;
    check.onclick = (ev) => ev.stopPropagation();

    reopen.onclick = (ev) => reopenJob(ev, x.b.id);
    row.append(check, cell(boxLabel(x.b, x.i), 'histName'), cell(tt.income.toFixed(2)), cell(tt.job.toFixed(2)), cell((tt.income - tt.job).toFixed(2)), reopen);
    const dates = document.createElement('div');
    dates.className = 'histDates';
    dates.textContent = T().opened + (x.b.created || '') + '  |  ' + T().finishedOn + x.b.finished;
    row.appendChild(dates);

  });

function rememberName(name) {

}
// The name box: type a name, or click a saved name. It opens on top of the page.
let nameCallback = null;
function openNameDialog(current, onDone) {
  nameCallback = onDone;
  const t = T();
  document.getElementById('nameDialogTitle').textContent = t.renamePrompt;
  document.getElementById('savedTitle').textContent = t.savedNames;
  document.getElementById('nameOk').textContent = t.okBtn;
  document.getElementById('nameCancel').textContent = t.cancelBtn;
  const input = document.getElementById('nameInput');
  input.placeholder = t.nameTyping;
  input.value = current || '';
  document.getElementById('nameMicMsg').textContent = '';
  document.getElementById('nameMic').title = t.nameTyping;
  drawSavedNames();
  document.getElementById('nameOverlay').classList.add('show');
  input.focus();
  input.select();
}
function drawSavedNames() {
  const list = document.getElementById('savedList');
  list.innerHTML = '';
  const typed = document.getElementById('nameInput').value.trim().toLowerCase();
  let saved = getNames();
  // While you type, only the matching names show: names that start with your letters first, then names that contain them.
  if (typed) {
    const starts = saved.filter(n => n.toLowerCase().startsWith(typed));
    const contains = saved.filter(n => !n.toLowerCase().startsWith(typed) && n.toLowerCase().includes(typed));
    saved = starts.concat(contains);
  }
  if (saved.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'savedTitle';
    empty.textContent = typed ? T().noMatch : T().noSaved;
    list.appendChild(empty);
    return;
  }
  saved.forEach(name => {
    const row = document.createElement('div');
    row.className = 'savedItem';
    const pick = document.createElement('button');
    pick.className = 'pick';
    const isMatch = typed && name.toLowerCase().includes(typed);
    if (isMatch) pick.style.fontWeight = 'bold';
    pick.textContent = name;
    pick.onclick = () => closeNameDialog(name);
    const forget = document.createElement('button');
    forget.className = 'forget';
    forget.title = T().forgetName;
    forget.textContent = '\u2715';
    forget.onclick = () => {
      LS.setItem('money_names', JSON.stringify(getNames().filter(n => n !== name)));
      drawSavedNames();
    };
    row.append(pick, forget);
    list.appendChild(row);
  });
}

// Spoken numbers that can come back as words, in English and Hebrew.
const NUMBER_WORDS = {
  zero:0, one:1, two:2, three:3, four:4, five:5, six:6, seven:7, eight:8, nine:9, ten:10,
  eleven:11, twelve:12, thirteen:13, fourteen:14, fifteen:15, sixteen:16, seventeen:17, eighteen:18, nineteen:19,
  twenty:20, thirty:30, forty:40, fifty:50, sixty:60, seventy:70, eighty:80, ninety:90,
  'אפס':0, 'אחד':1, 'אחת':1, 'שניים':2, 'שתיים':2, 'שתי':2, 'שני':2, 'שלוש':3, 'שלושה':3, 'ארבע':4, 'ארבעה':4,
  'חמש':5, 'חמישה':5, 'שש':6, 'שישה':6, 'שבע':7, 'שבעה':7, 'שמונה':8, 'תשע':9, 'תשעה':9, 'עשר':10, 'עשרה':10,
  'עשרים':20, 'שלושים':30, 'ארבעים':40, 'חמישים':50, 'שישים':60, 'שבעים':70, 'שמונים':80, 'תשעים':90,
  // When the speech service writes Hebrew as Arabic, the numbers can come back as Arabic words.
  'واحد':1, 'اثنين':2, 'ثلاثة':3, 'ثلاث':3, 'اربعة':4, 'أربعة':4, 'اربع':4, 'خمسة':5, 'خمس':5, 'ستة':6, 'سبعة':7, 'ثمانية':8, 'تسعة':9, 'عشرة':10,
  'عشرين':20, 'ثلاثين':30, 'اربعين':40, 'أربعين':40, 'خمسين':50, 'ستين':60, 'سبعين':70, 'ثمانين':80, 'تسعين':90, 'مئتين':200, 'ميتين':200
};
const HUNDRED_WORDS = ['hundred', 'מאה', 'מאות', 'مئة', 'مائة', 'مية', 'ميه', 'مئات'];
const THOUSAND_WORDS = ['thousand', 'אלף', 'אלפים', 'الف', 'ألف', 'آلاف', 'الاف'];

// Finds the number in what you said or typed: digits first, then number words.
function findAmount(sentence) {
  // Digits written the Arabic way (١٢٣ or ۱۲۳) are turned into 123 first.
  sentence = String(sentence || '').replace(/[٠-٩]/g, d => String(d.charCodeAt(0) - 0x0660)).replace(/[۰-۹]/g, d => String(d.charCodeAt(0) - 0x06F0));
  const match = sentence.match(/(\d+(?:[.,]\d+)?)/);
  if (match) return parseFloat(match[1].replace(',', '.'));
  const words = sentence.toLowerCase().replace(/[-,.]/g, ' ').split(/\s+/);
  let total = 0, found = false, current = 0;
  for (const w of words) {
    const word = w.replace(/^ו/, '');
    const plain = w.replace(/^و/, '');
    if (HUNDRED_WORDS.indexOf(w) >= 0 || HUNDRED_WORDS.indexOf(plain) >= 0) { current = (current || 1) * 100; found = true; continue; }
    if (THOUSAND_WORDS.indexOf(w) >= 0 || THOUSAND_WORDS.indexOf(plain) >= 0) { total += (current || 1) * 1000; current = 0; found = true; continue; }
    if (plain !== w && plain in NUMBER_WORDS) { current += NUMBER_WORDS[plain]; found = true; continue; }
    if (w in NUMBER_WORDS) { current += NUMBER_WORDS[w]; found = true; }
    else if (word in NUMBER_WORDS && word !== w) { current += NUMBER_WORDS[word]; found = true; }
  }
  total += current;
  return found ? total : null;
}

function makeRow(e, i) {
  const box = cur();
  const li = document.createElement('li');
  // One line: what it was (with the date small underneath), the amount, then correct and delete.
  const text = document.createElement('div');
  text.className = 'entryText';
  const note = document.createElement('span');
  note.className = 'note';
  note.textContent = e.note;
  const date = document.createElement('span');
  date.className = 'entryDate';
  date.textContent = e.date || '';
  text.append(note, date);
  const amt = document.createElement('strong');
  amt.className = e.kind === 'job' ? 'personal' : e.kind;
  amt.textContent = (e.kind === 'income' ? '+' : '-') + e.amount.toFixed(2);
  const del = document.createElement('button');
  del.className = 'del';
  del.textContent = '\u2715';
  del.onclick = () => { box.entries.splice(i, 1); saveBoxes(); render(); };
  const edit = document.createElement('button');
  edit.className = 'edit';
  edit.title = T().editTitle;
  edit.textContent = '\u270E';
  edit.onclick = async () => {
    const answer = await askText(T().editPrompt + e.amount.toFixed(2) + '):', e.amount);
    if (answer === null) return;
    const fixed = findAmount(answer);
    if (fixed === null) { heard.textContent = T().notNumber; return; }
    box.entries[i].amount = fixed;
    saveBoxes();
    render();
    heard.textContent = T().corrected + fixed.toFixed(2);
  };
  li.append(text, amt, edit, del);
  return li;
}

// Draw the open box.
function render() {
  const box = cur();
  if (!box) return;
  listIncome.innerHTML = '';
  listJob.innerHTML = '';
  const totals = { income: 0, job: 0 };
  box.entries.forEach((e, i) => {
    if (e.kind !== 'income' && e.kind !== 'job') return; // older personal entries stay hidden
    totals[e.kind] += e.amount;
    (e.kind === 'job' ? listJob : listIncome).appendChild(makeRow(e, i));
  });
  document.getElementById('tIncome').textContent = totals.income.toFixed(2);
  document.getElementById('tTen').textContent = ((totals.income - totals.job) * box.pct / 100).toFixed(2);
  document.getElementById('tAfterJob').textContent = (totals.income - totals.job).toFixed(2);
  document.getElementById('tJob').textContent = totals.job.toFixed(2);
}

// The microphone is only for job spending: any number you say goes there.
function handleText(sentence) {
  sentence = (sentence || '').trim();
  if (!sentence) return;
  const t = T();
  const amount = findAmount(sentence);
  if (amount === null) { heard.textContent = t.heardWord + ' "' + sentence + '" ' + t.noAmount; return; }
  addEntry('job', amount, sentence);
  heard.textContent = t.addedTo + amount.toFixed(2) + ' - ' + t.kinds.job + ' (' + t.heardWord + ': "' + sentence + '")';
}

function backupByEmail() { chooseBox(doBackupByEmail); }
function restoreBackup() { chooseBox(doRestoreBackup); }
async function doBackupByEmail(box) {
  const previous = getEmails();
  const hint = previous.length ? previous.join(', ') + ')' : ')';
  const answer = await askText(T().emailPrompt + hint, previous[0] || '');
  if (answer === null) return;
  const address = answer.trim();
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(address)) { document.getElementById('fileMsg').textContent = T().emailBad; return; }
  rememberEmail(address);
  const backup = JSON.stringify({
    app: 'money-tracker',
    saved: new Date().toISOString(),
    entries: box.entries,
    pct: box.pct,
    name: box.name || '',
    lang: lang
  });
  const subject = encodeURIComponent(T().backupSubject + ' ' + new Date().toLocaleDateString());
  const body = encodeURIComponent(backup);
  window.location.href = 'mailto:' + address + '?subject=' + subject + '&body=' + body;
}
async function doRestoreBackup(box) {
  const text = await askText(T().restorePrompt, '');
  if (text === null || text.trim() === '') return;
  const msg = document.getElementById('fileMsg');
  let data;
  try { data = JSON.parse(text.trim()); } catch (e) { msg.textContent = T().restoreBad; return; }
  if (!data || data.app !== 'money-tracker' || !Array.isArray(data.entries)) { msg.textContent = T().restoreBad; return; }
  if (!(await askConfirm(T().restoreSure))) return;
  box.entries = data.entries;
  if (typeof data.pct === 'number') box.pct = data.pct;
  if (data.name) box.name = data.name;
  saveBoxes();
  renderHome();
  msg.textContent = T().restoreOk;
}

// ---- Backup to a file, and load it back without doubles ----
async function saveBackupFile() {
  const data = JSON.stringify({ app: 'money-tracker-all', saved: new Date().toISOString(), boxes: boxes, names: getNames() }, null, 1);
  const blob = new Blob([data], { type: 'application/json' });
  const stamp = new Date().toISOString().slice(0, 10);
  const fileName = 'money-tracker-backup-' + stamp + '.json';
  // Inside claude.ai, files are saved through the page's own download box.
  const downloads = await claudeUse('downloads');
  if (downloads) {
    try {
      await downloads.save({ filename: fileName, data: data });
      document.getElementById('fileMsg').textContent = T().fileSaved;
    } catch (e) {
      document.getElementById('fileMsg').textContent = T().saveCancelled;
    }
    return;
  }
  // Where supported (Chrome, Edge), open a Save as window so you choose the folder and name.
  if (window.showSaveFilePicker) {
    try {
      const handle = await window.showSaveFilePicker({
        suggestedName: fileName,
        types: [{ description: 'Money tracker backup', accept: { 'application/json': ['.json'] } }]
      });
      const writable = await handle.createWritable();
      await writable.write(blob);
      await writable.close();
      document.getElementById('fileMsg').textContent = T().fileSavedAs + handle.name;
      return;
    } catch (e) {
      if (e && e.name === 'AbortError') { document.getElementById('fileMsg').textContent = T().saveCancelled; return; }
      // If the Save as window is not allowed, fall back to the normal download below.
    }
  }
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = fileName;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  URL.revokeObjectURL(link.href);
  document.getElementById('fileMsg').textContent = T().fileSaved;
}
// Two boxes are the same when they have the same name and exactly the same entries.
function boxFingerprint(b) {
  return JSON.stringify([b.name || '', (b.entries || []).map(e => [e.kind, e.amount, e.note, e.date])]);
}
function loadBackupFile(event) {
  const file = event.target.files && event.target.files[0];
  event.target.value = '';
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    let data;
    try { data = JSON.parse(reader.result); } catch (e) { document.getElementById('fileMsg').textContent = T().fileBad; return; }
    if (!data || data.app !== 'money-tracker-all' || !Array.isArray(data.boxes)) { document.getElementById('fileMsg').textContent = T().fileBad; return; }
    // Personal spending in the file is added too, skipping entries that are already here.
    if (false && Array.isArray(data.personal)) {
      const seen = new Set(personal.map(p => p.day + '|' + p.amount + '|' + p.time));
      data.personal.forEach(p => {
        if (!p || typeof p.amount !== 'number' || !p.day) return;
        const key = p.day + '|' + p.amount + '|' + p.time;
        if (!seen.has(key)) { personal.push(p); seen.add(key); }
      });
      personal.sort((a, b) => (b.day + (b.time || '')).localeCompare(a.day + (a.time || '')));
      savePersonal();
      renderPersonal();
    }
    const have = new Set(boxes.map(boxFingerprint));
    let added = 0, skipped = 0;
    data.boxes.forEach(b => {
      if (!b || !Array.isArray(b.entries)) return;
      if (have.has(boxFingerprint(b))) { skipped++; return; }
      // Same name but different entries: keep both, and tell them apart with a number.
      let name = b.name || '';
      if (name && boxes.some(x => (x.name || '') === name)) {
        let n = 2;
        while (boxes.some(x => (x.name || '') === name + ' (' + n + ')')) n++;
        name = name + ' (' + n + ')';
      }
      const copy = { id: 'b' + Date.now() + '_' + added, name: name, entries: b.entries, pct: typeof b.pct === 'number' ? b.pct : 10, created: b.created || new Date().toLocaleDateString() };
      boxes.push(copy);
      have.add(boxFingerprint(copy));
      added++;
    });
    if (Array.isArray(data.names)) data.names.forEach(n => { if (typeof n === 'string' && n) rememberName(n); });
    saveBoxes();
    renderHome();
    document.getElementById('fileMsg').textContent = T().fileResult.replace('{added}', added).replace('{skipped}', skipped);
  };
  reader.readAsText(file);
}

// Turns a name written in English or Hebrew letters into one rough sound spelling, so "Hagai", "Haggai" and the Hebrew spelling all look the same.
function soundKey(text) {
  const heb = { 'א':'', 'ב':'b', 'ג':'g', 'ד':'d', 'ה':'h', 'ו':'v', 'ז':'z', 'ח':'h', 'ט':'t', 'י':'y', 'כ':'k', 'ך':'k', 'ל':'l', 'מ':'m', 'ם':'m', 'נ':'n', 'ן':'n', 'ס':'s', 'ע':'', 'פ':'p', 'ף':'p', 'צ':'ts', 'ץ':'ts', 'ק':'k', 'ר':'r', 'ש':'s', 'ת':'t' };
  let s = String(text || '').toLowerCase().replace(/[\u0591-\u05C7]/g, '');
  s = s.split('').map(ch => (ch in heb) ? heb[ch] : ch).join('');
  s = s.replace(/ch/g, 'h').replace(/kh/g, 'h').replace(/ph/g, 'p').replace(/c/g, 'k').replace(/q/g, 'k').replace(/w/g, 'v').replace(/x/g, 'ks').replace(/j/g, 'g').replace(/[aeiouy]/g, '').replace(/[^a-z]/g, '');
  return s.replace(/(.)\1+/g, '$1');
}
// The "where should this go?" window: personal first, then every open card.
function chooseTarget(sentence, amount, kind, msg) {
  const t = T();
  const ov = document.getElementById('pickOverlay');
  const list = document.getElementById('pickList');
  const kindText = kind === 'income' ? t.kinds.income : t.kinds.job;
  document.getElementById('pickText').textContent = t.pickWhere(sentence, amount.toFixed(2), kindText);
  list.innerHTML = '';
  const close = () => ov.classList.remove('show');
  const personalBtn = document.createElement('button');
  personalBtn.className = 'pickPersonal';
  personalBtn.textContent = t.personalBtn;
  personalBtn.onclick = () => {
    close();
    addPersonalEntry(kind, amount, sentence);
    msg.textContent = t.addedTo + amount.toFixed(2) + ' - ' + (kind === 'income' ? t.personalInKind : t.personalOutKind);
  };
  list.appendChild(personalBtn);
  boxes.forEach((b, i) => {
    if (b.finished) return;
    const btn = document.createElement('button');
    btn.textContent = boxLabel(b, i);
    btn.onclick = () => {
      close();
      b.entries.unshift({ kind: kind, amount: amount, note: sentence, date: new Date().toLocaleDateString(), day: dayKey(new Date()) });
      saveBoxes();
      renderHome();
      renderSummaries();
      msg.textContent = t.addedTo + amount.toFixed(2) + ' - ' + t.kinds[kind] + ' (' + boxLabel(b, i) + ')';
    };
    list.appendChild(btn);
  });
  const cancel = document.getElementById('pickCancel');
  cancel.textContent = t.cancelBtn;
  cancel.onclick = () => { close(); msg.textContent = t.heardWord + ' "' + sentence + '"'; };
  ov.classList.add('show');
}

// kind: 'job' (home mic and red start mic) or 'income' (green start mic).
function handleHomeText(sentence, kind, msgEl) {
  kind = kind || 'job';
  const msg = msgEl || document.getElementById('homeMicMsg');
  sentence = (sentence || '').trim();
  const amount = findAmount(sentence);
  if (amount === null) { msg.textContent = T().heardWord + ' "' + sentence + '" ' + T().noAmount; return; }
  // An amount followed by "אישי" goes to the personal record instead of a card.
  if (saysPersonal(sentence)) {
    addPersonalEntry(kind, amount, sentence);
    msg.textContent = T().addedTo + amount.toFixed(2) + ' - ' + (kind === 'income' ? T().personalInKind : T().personalOutKind);
    return;
  }
  // Take the number away and keep the rest as the name.
  let rest = sentence.replace(/\d+(?:[.,]\d+)?/g, ' ').toLowerCase().replace(/[.,!?;:"'()\-]/g, ' ');
  rest = rest.split(/\s+/).filter(w => w && !(w.replace(/^ו/, '') in NUMBER_WORDS) && !(w in NUMBER_WORDS) && w !== 'hundred' && w !== 'thousand' && w !== 'מאה' && w !== 'מאות' && w !== 'אלף' && w !== 'אלפים' && w !== 'to' && w !== 'for' && w !== 'את' && w !== 'ל').join(' ').trim();
  const active = boxes.map((b, i) => ({ b: b, i: i })).filter(x => !x.b.finished);
  let match = null;
  if (rest) {
    const exact = active.filter(x => boxLabel(x.b, x.i).toLowerCase() === rest);
    // Very short names or sounds only count when they match exactly, so they don't match every sentence.
    const part = active.filter(x => { const n = boxLabel(x.b, x.i).toLowerCase(); return (rest.length >= 2 && n.includes(rest)) || (n.length >= 2 && rest.includes(n)); });
    const rk = soundKey(rest);
    const alike = rk ? active.filter(x => { const nk = soundKey(boxLabel(x.b, x.i)); return nk && (nk === rk || (rk.length >= 2 && nk.includes(rk)) || (nk.length >= 2 && rk.includes(nk))); }) : [];
    if (exact.length === 1) match = exact[0];
    else if (part.length === 1) match = part[0];
    else if (part.length === 0 && alike.length === 1) match = alike[0];
  }
  // Amount heard but not where it goes (or more than one card fits): ask with buttons.
  if (!match) { chooseTarget(sentence, amount, kind, msg); return; }
  match.b.entries.unshift({ kind: kind, amount: amount, note: sentence, date: new Date().toLocaleDateString(), day: dayKey(new Date()) });
  saveBoxes();
  renderHome();
  renderSummaries();
  msg.textContent = T().addedTo + amount.toFixed(2) + ' - ' + T().kinds[kind] + ' (' + boxLabel(match.b, match.i) + ')';
}

// Nothing shows until the data has loaded.
['homeRow', 'middleArea', 'fileBar'].forEach(id => { document.getElementById(id).style.display = 'none'; });
async function boot() {
  const loading = document.getElementById('loadingPage');
  loading.textContent = 'Loading... / טוען...';
  const voice = claudeUse('dictation');
  try {
    await cloudLoad();
  } catch (e) {
    loading.textContent = '';
    const msg = document.createElement('div');
    msg.textContent = TEXT.he.loadError + ' / ' + TEXT.en.loadError;
    const again = document.createElement('button');
    again.textContent = TEXT.he.tryAgain + ' / ' + TEXT.en.tryAgain;
    again.onclick = boot;
    loading.append(msg, again);
    return;
  }
  dictation = await voice;
  booted = true;
  lang = LS.getItem('money_lang') || 'he';
  boxes = loadBoxes();
  personal = loadPersonal();
  loading.style.display = 'none';
  applyLang();
  closeApp(); // always start on the home screen with the small boxes
  // Start page: two microphone buttons first. A press on either opens the page with the boxes.
  ['homeRow', 'middleArea', 'fileBar'].forEach(id => { document.getElementById(id).style.display = 'none'; });
  document.getElementById('startPage').style.display = 'flex';
  document.getElementById('startMsg').textContent = T().startHint;
}
boot();
// Red mic = job spending, green mic = money in. Both: say an amount and the name of a box. They stay on this page.
const startMsg = document.getElementById('startMsg');
document.getElementById('startBlue').onclick = () => startVoice(document.getElementById('startBlue'), startMsg, s => handleHomeText(s, 'job', startMsg));
document.getElementById('startGreen').onclick = () => startVoice(document.getElementById('startGreen'), startMsg, s => handleHomeText(s, 'income', startMsg));
// Purple mic: say a name and a new card (box) with that name is opened. Without voice, type the name instead.
function addBoxByName(name) {
  name = String(name || '').trim().replace(/[.!?,]+$/, '');
  if (!name) { startMsg.textContent = T().cantHear; return; }
  boxes.push({ id: 'b' + Date.now(), name: name, entries: [], pct: 10, created: new Date().toLocaleDateString() });
  rememberName(name);
  saveBoxes();
  renderHome();
  renderSummaries();
  startMsg.textContent = T().newCardAdded + name;
}
document.getElementById('startPurple').onclick = () => {
  if (!dictation && !SR) { openNameDialog('', addBoxByName); return; }
  startVoice(document.getElementById('startPurple'), startMsg, addBoxByName);
};
// The "אישי" bar opens the personal page.
document.getElementById('personalBtn').onclick = openPersonalPage;
// The button under the mics opens the page with the small boxes.
document.getElementById('enterBtn').onclick = () => { document.getElementById('startPage').style.display = 'none'; closeApp(); document.getElementById('toFront').style.display = 'block'; };
// The corner button goes back one page: from inside a box to the small boxes, from there to the first page.
document.getElementById('toFront').onclick = () => {
  if (currentId) { closeApp(); return; }
  ['homeRow', 'middleArea', 'fileBar', 'app', 'personalPage'].forEach(id => { document.getElementById(id).style.display = 'none'; });
  document.getElementById('toFront').style.display = 'none';
  document.getElementById('startPage').style.display = 'flex';
  document.getElementById('startMsg').textContent = T().startHint;
};
</script>
