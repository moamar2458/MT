<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Money Tracker</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; max-width: 100vw; }
  body { font-family: Arial, sans-serif; background: #f4f4f8; padding: 8px clamp(8px, 4vw, 60px); display: flex; flex-direction: column; overflow-y: auto; overflow-x: hidden; width: 100%; }
  body > * { min-width: 0; max-width: 100%; }
  h1 { text-align: center; font-size: 20px; margin: 2px 0 8px 0; }
  .income { color: green; }
  .job { color: #d97706; }
  .personal { color: crimson; }
  .langBtn { position: fixed; top: 8px; left: 8px; padding: 3px 8px; font-size: 16px; border: none; border-radius: 8px; background: #333; color: white; cursor: pointer; z-index: 10; }
  .page { flex: 1; min-height: 0; display: flex; }
  .leftSide { width: 100%; flex: 1; min-width: 0; overflow-y: auto; }
  .top { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  button.bigMic { width: 64px; height: 64px; border-radius: 32px; border: none; background: #4a6cf7; color: white; font-size: 28px; cursor: pointer; flex-shrink: 0; }
  button.bigMic.listening { background: #e0457b; }
  .typeArea { width: 100%; min-width: 0; }
  .typeRow { display: flex; gap: 6px; justify-content: center; }
  .typeRow input { flex: 0 0 225px; width: 225px; min-width: 0; padding: 8px; font-size: 16px; border: 1px solid #bbb; border-radius: 8px; }
  .typeRow button { padding: 6px 12px; font-size: 20px; border: none; border-radius: 8px; color: white; cursor: pointer; }
  .typeRow button.arrowJob { background: crimson; }
  .arrowKey { font-size: 13px; color: #666; margin-top: 3px; text-align: center; }
  .heard { color: #333; min-height: 18px; margin: 6px 0; font-size: 15px; text-align: center; }
  .col { border-radius: 12px; padding: 8px; margin-bottom: 8px; }
  .col.in { background: #e5f4e4; border: 2px solid green; }
  .col h2 { margin: 0 0 6px 0; font-size: 15px; text-align: center; }
  .bar { background: white; padding: 6px 8px; border-radius: 8px; margin-bottom: 6px; text-align: center; }
  .bar h3 { margin: 0; font-size: 14px; color: #555; font-weight: normal; }
  .bar .total { font-size: 20px; font-weight: bold; }
  .incomeRow { display: flex; gap: 8px; margin-bottom: 6px; }
  .incomeRow .bar { flex: 1; margin-bottom: 0; }
  .incomeRow .jobBar { background: #fbebeb; border: 2px solid crimson; flex: 0 0 calc(50% - 4px); align-self: flex-end; }
  .jobHistory { flex: 1; min-width: 0; background: #f4fbf3; border-radius: 8px; padding: 6px; }
  .jobHistory h3 { margin: 0 0 4px 0; font-size: 14px; color: #555; font-weight: normal; text-align: center; }
  .jobList li { font-size: 16px; padding: 4px 6px; }
  .afterJobBox { background: white; padding: 6px 8px; border-radius: 8px; margin-bottom: 8px; text-align: center; width: calc(50% - 4px); }
  .afterJobBox h3 { margin: 0; font-size: 14px; color: #555; font-weight: normal; }
  .afterJobBox .total { font-size: 20px; font-weight: bold; }
  .incomeRow .tenBar { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .tenBar { background: #fff8e1; border: 2px solid #f5b800; padding: 6px 8px; border-radius: 8px; text-align: center; }
  .tenBar h3 { margin: 0; font-size: 14px; color: #555; font-weight: normal; }
  .tenBar .amount { font-size: 20px; font-weight: bold; color: #b38600; }
  .tenBar input { width: 52px; padding: 2px 4px; font-size: 15px; border: 1px solid #b38600; border-radius: 6px; text-align: center; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { display: flex; align-items: center; gap: 8px; background: white; padding: 6px 8px; margin-bottom: 4px; border-radius: 6px; font-size: 17px; }
  li span.note { flex: 1; }
  .tag { font-size: 16px; color: #666; }
  button.del { padding: 3px 8px; border: none; border-radius: 6px; background: #999; color: white; cursor: pointer; }
  button.edit { padding: 3px 8px; border: none; border-radius: 6px; background: #4a6cf7; color: white; cursor: pointer; }
  .incomeAdd { display: flex; gap: 4px; margin-top: 6px; }
  .incomeAdd input { flex: 1; min-width: 0; padding: 5px; font-size: 16px; border: 1px solid #bbb; border-radius: 6px; }
  .incomeAdd button { padding: 4px 10px; font-size: 16px; border: none; border-radius: 6px; background: green; color: white; cursor: pointer; }
  .belowRow { display: flex; direction: ltr; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 8px; }
  .backupBelow { display: flex; flex-direction: column; gap: 4px; }
  .backupBelow button { white-space: nowrap; }
  .belowRow .afterJobBox { margin-bottom: 0; }
  .backupBtn { padding: 4px 8px; font-size: 13px; border: none; border-radius: 8px; background: #4a6cf7; color: white; cursor: pointer; }
  .restoreBtn { padding: 4px 8px; font-size: 13px; border: none; border-radius: 8px; background: #666; color: white; cursor: pointer; }
  .incomeList { margin-top: 6px; text-align: start; }
  .incomeList li { font-size: 16px; padding: 4px 6px; }
  /* Home screen with small square boxes. */
  #home { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; align-content: flex-start; padding: 20px 0; overflow-x: hidden; overflow-y: auto; }
  .tile { position: relative; flex: 0 0 auto; width: 150px; height: 140px; border-radius: 16px; background: white; border: 3px solid #4a6cf7; cursor: pointer; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 8px; }
  .tile:hover { background: #eef2ff; }
  .tile .icon { font-size: 40px; }
  .tile .name { font-size: 17px; font-weight: bold; }
  .tile .rename { position: absolute; top: 6px; inset-inline-end: 6px; padding: 2px 7px; font-size: 15px; border: none; border-radius: 6px; background: #4a6cf7; color: white; cursor: pointer; }
  .tile .removeTile { position: absolute; top: 6px; inset-inline-start: 6px; padding: 2px 7px; font-size: 15px; border: none; border-radius: 6px; background: #999; color: white; cursor: pointer; }
  .tile .small { font-size: 15px; color: #666; }
  .tile .num { font-size: 22px; font-weight: bold; color: #d97706; }
  .tile.addTile { border: 3px dashed #4a6cf7; background: #f4f6ff; justify-content: center; }
  .tile.addTile .plus { font-size: 56px; color: #4a6cf7; line-height: 1; }
  #app { display: none; flex: 1; min-height: 0; flex-direction: column; width: 100%; max-width: 620px; margin: 0 auto; }
  #homeRow { display: flex; align-items: flex-start; gap: 24px; direction: ltr; justify-content: space-between; flex: 0 0 auto; width: 100%; max-width: 100%; min-width: 0; max-height: 48vh; overflow: hidden; }
  #jobSide { flex: 1 1 0; min-width: 0; width: 100%; max-width: 100%; margin-top: 20px; }
  .sideTitle { margin: 0 0 4px 0; font-size: 16px; text-align: right; color: #d97706; }
  .homeMicRow { display: flex; flex-direction: column; align-items: center; gap: 4px; margin-bottom: 4px; }
  .homeMic { width: 300px; height: 44px; border-radius: 22px; border: none; background: #4a6cf7; color: white; font-size: 22px; cursor: pointer; flex-shrink: 0; }
  .homeMic.listening { background: #e0457b; }
  .homeMicLine { display: flex; align-items: center; justify-content: center; gap: 10px; direction: ltr; }
  .homeAdd { width: 44px; height: 44px; border-radius: 22px; border: 3px dashed #4a6cf7; background: #f4f6ff; color: #4a6cf7; font-size: 26px; line-height: 1; cursor: pointer; flex-shrink: 0; padding: 0; }
  .homeMicMsg { font-size: 15px; color: #333; min-height: 20px; text-align: center; }
  #homeRow #home { justify-content: center; padding-top: 8px; padding-bottom: 8px; max-width: 100%; height: 172px; overflow-x: hidden; overflow-y: auto; direction: ltr; }
  #homeRow > * { direction: inherit; min-width: 0; }
  #personalArea { flex: 0 0 337px; background: #e7f0ff; border: 2px solid #2a6df4; border-radius: 14px; padding: 12px; margin-top: 20px; max-height: 70vh; display: flex; flex-direction: column; }
  /* (personal spending styles removed) */
  #middleArea { flex: 0 0 auto; display: flex; flex-direction: column; overflow: visible; }
  #summaryRow { display: flex; gap: 16px; direction: ltr; margin: 4px 0 8px 0; align-items: flex-start; flex: 0 1 auto; min-height: 0; }
  .summaryBox { flex: 1; min-width: 0; background: white; border-radius: 12px; padding: 10px; display: flex; flex-direction: column; direction: inherit; min-height: 0; max-height: 100%; overflow: hidden; }
  #jobSummary { border: 2px solid #d97706; }
  #personalSummary { border: 2px solid #2a6df4; }
  .summaryBox .sideTitle { text-align: center; margin: 0 0 6px 0; }
  .jobColor { color: #d97706; }
  .blueColor { color: #2a6df4; }
  .viewTabs { display: flex; gap: 6px; justify-content: center; margin-bottom: 6px; }
  .viewTab { padding: 4px 14px; font-size: 15px; border: 1px solid #999; border-radius: 14px; background: #f1f1f1; cursor: pointer; }
  .viewTab.active { background: #333; color: white; border-color: #333; }
  .summaryList { min-height: 0; max-height: 30vh; overflow-y: auto; flex: 0 1 auto; }
  .periodRow { display: grid; grid-template-columns: 1.3fr 1fr 1fr 1fr; gap: 6px; font-size: 15px; padding: 4px 6px; border-bottom: 1px solid #eee; align-items: center; text-align: center; }
  .periodRow.head { font-weight: bold; color: #555; font-size: 13px; position: sticky; top: 0; background: white; }
  .periodRow.personalRow { grid-template-columns: 1.6fr 1fr; }
  .periodRow .period { text-align: start; font-weight: bold; }
  .periodTitle { background: #333; color: white; border-radius: 6px; padding: 3px 8px; margin: 8px 0 2px 0; font-size: 14px; font-weight: bold; text-align: start; }
  .periodRow.totalRow { background: #fff3cf; font-weight: bold; border-bottom: 2px solid #d9a400; }
  .periodRow.personalRow.totalRow { background: #dfeaff; border-bottom: 2px solid #2a6df4; }
  .finishWrap { display: flex; align-items: center; }
  .finishBtn { padding: 10px 22px; font-size: 16px; font-weight: bold; border: none; border-radius: 10px; background: #7a3db8; color: white; cursor: pointer; }
  #historyBox { margin: 4px 0 8px 0; background: white; border: 2px solid #7a3db8; border-radius: 12px; padding: 10px; display: flex; flex-direction: column; flex: 0 0 auto; max-height: 28vh; }
  .historyTitle { color: #7a3db8; text-align: center; margin: 0 0 6px 0; }
  #historyList { min-height: 0; overflow-y: auto; }
  .histRow { display: grid; grid-template-columns: auto 1.4fr 1fr 1fr 1fr auto; gap: 6px; align-items: center; font-size: 15px; padding: 5px 6px; border-bottom: 1px solid #eee; text-align: center; cursor: pointer; }
  .histRow:hover { background: #f5eefc; }
  .histRow.checked { background: #c8f0c8; }
  .histRow.checked:hover { background: #b6e8b6; }
  .histRow input[type=checkbox] { width: 20px; height: 20px; cursor: pointer; }
  .histRow.head { font-weight: bold; color: #555; font-size: 13px; cursor: default; position: sticky; top: 0; background: white; }
  .histRow.head:hover { background: white; }
  .histRow .histName { text-align: start; font-weight: bold; }
  .histRow .histDates { font-size: 13px; color: #777; grid-column: 1 / -1; text-align: start; }
  .histRow button { padding: 3px 8px; font-size: 13px; border: none; border-radius: 6px; background: #4a6cf7; color: white; cursor: pointer; }
  #fileBar { display: grid; grid-template-columns: repeat(2, max-content); gap: 8px; justify-content: start; direction: ltr; padding: 4px 0 8px 0; flex-shrink: 0; }
  .fileBtn { padding: 8px 14px; font-size: 15px; border: none; border-radius: 8px; background: #4a6cf7; color: white; cursor: pointer; }
  .fileBtn.load { background: #666; }
  .fileMsg { font-size: 15px; color: #333; grid-column: 1 / span 2; }
  .tile .opened { font-size: 14px; color: #888; white-space: normal; overflow-wrap: anywhere; line-height: 1.3; max-width: 100%; }
  .openedLine { text-align: center; font-size: 14px; color: #888; margin: -4px 0 6px 0; }
  /* The name box that opens on top of the page */
  #nameOverlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 50; align-items: center; justify-content: center; }
  #nameOverlay.show { display: flex; }
  .nameDialog { background: white; border-radius: 16px; padding: 18px; width: 340px; max-width: 92vw; max-height: 85vh; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 8px 30px rgba(0,0,0,0.3); }
  .nameDialog h3 { margin: 0; font-size: 18px; text-align: center; }
  .nameDialog input { width: 100%; padding: 10px; font-size: 16px; border: 1px solid #bbb; border-radius: 8px; }
  .nameDialog .savedTitle { font-size: 15px; color: #666; }
  /* Green box inside a small box: equal cards and one-line rows */
  .cards { display: flex; gap: 8px; margin-bottom: 8px; }
  .card { flex: 1 1 0; min-width: 0; background: white; border-radius: 8px; padding: 8px; text-align: center; display: flex; flex-direction: column; justify-content: center; gap: 2px; }
  .card h3 { margin: 0; font-size: 14px; color: #555; font-weight: normal; }
  .card .total, .card .amount { font-size: 22px; font-weight: bold; }
  .jobCard { background: #fbebeb; border: 2px solid crimson; }
  #pctBox { margin-inline-end: 6px; }
  /* Job summary: name, job spending, left (no income column); click a name to see its spending */
  #jobSummaryList .periodRow { grid-template-columns: 1.4fr 1fr 1fr; }
  #jobSummaryList .clickRow { cursor: pointer; }
  .foldTitle { display: flex; justify-content: space-between; align-items: center; cursor: pointer; user-select: none; }
  .foldTitle .foldSum { font-weight: normal; opacity: 0.85; direction: ltr; }
  #jobSummaryList .clickRow:hover { background: #fff3e0; }
  #jobSummaryList .clickRow .period { color: #b45f06; }
  .periodDetail { background: #fff8ef; border-bottom: 1px solid #eee; padding: 4px 10px 6px 10px; font-size: 14px; }
  .detailLine { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; padding: 2px 0; align-items: center; }
  .detailLine > div:first-child { color: #888; font-size: 13px; }
  .detailAmount { color: crimson; font-weight: bold; direction: ltr; }
  .detailTotal { border-top: 1px solid #f0c9a0; margin-top: 3px; padding-top: 4px; font-weight: bold; }
  .card.moneyInCard { position: relative; }
  .card.moneyInCard .addIncome { position: absolute; top: 6px; right: 6px; width: 30px; height: 30px; padding: 0; font-size: 20px; line-height: 1; border: none; border-radius: 8px; background: green; color: white; cursor: pointer; }
  .col.in .incomeAdd { margin: 0 0 6px 0; }
  .listTitle { font-size: 14px; color: #555; text-align: center; margin: 2px 0 4px 0; }
  .entryList { margin-bottom: 8px; }
  .entryList li { display: grid; grid-template-columns: 1fr auto auto auto; gap: 8px; align-items: center; padding: 6px 8px; margin-bottom: 4px; font-size: 16px; }
  .entryList .entryText { min-width: 0; display: flex; flex-direction: column; line-height: 1.25; }
  .entryList .entryText .note { overflow-wrap: anywhere; }
  .entryList .entryDate { font-size: 12px; color: #888; }
  .entryList strong { white-space: nowrap; direction: ltr; }
  .nameRow { display: flex; gap: 8px; align-items: center; }
  .nameRow input { flex: 1; min-width: 0; }
  .nameMic { flex: 0 0 44px; width: 44px; height: 44px; border-radius: 22px; border: none; background: #4a6cf7; color: white; font-size: 20px; cursor: pointer; padding: 0; }
  .nameMic.listening { background: #e0457b; }
  .nameMicMsg { font-size: 14px; color: #333; min-height: 0; }
  .nameMicMsg:empty { display: none; }
  .nameDialog .savedList { overflow-y: auto; max-height: 220px; display: flex; flex-direction: column; gap: 6px; }
  .savedItem { display: flex; gap: 6px; }
  .savedItem button.pick { flex: 1; padding: 9px; font-size: 16px; text-align: start; border: 1px solid #4a6cf7; border-radius: 8px; background: #f4f6ff; cursor: pointer; }
  .savedItem button.pick:hover { background: #e2e8ff; }
  .savedItem button.forget { padding: 9px 12px; border: none; border-radius: 8px; background: #999; color: white; cursor: pointer; }
  .dialogButtons { display: flex; gap: 8px; justify-content: center; }
  .dialogButtons button { padding: 9px 18px; font-size: 15px; border: none; border-radius: 8px; color: white; cursor: pointer; }
  .dialogButtons .okBtn { background: green; }
  .dialogButtons .cancelBtn { background: #666; }
  .titleEdit { padding: 2px 8px; font-size: 16px; border: none; border-radius: 6px; background: #4a6cf7; color: white; cursor: pointer; vertical-align: middle; }
  .shrinkBtn { align-self: center; margin-bottom: 6px; padding: 6px 14px; font-size: 16px; border: none; border-radius: 8px; background: #666; color: white; cursor: pointer; }
.savedTitle { font-size: 15px; color: #666; }
#startPage { display: none; gap: 30px; justify-content: center; align-items: center; flex-direction: column; min-height: 80vh; direction: ltr; }
.startMic { width: min(200px, 42vw); height: min(200px, 42vw); border-radius: 50%; border: none; color: white; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 0; }
.startMic .micIcon { font-size: min(52px, 11vw); line-height: 1; }
.startMic .micLabel { font-size: min(28px, 6.5vw); font-weight: bold; }
.startRow { display: flex; gap: min(40px, 6vw); justify-content: center; }
.startMic.purple { background: #7a3db8; width: min(133px, 28vw); height: min(133px, 28vw); gap: 4px; }
.startMic.purple .micIcon { font-size: min(35px, 7.5vw); }
.startMic.purple .micLabel { font-size: min(19px, 4.5vw); }
/* Job summary and history: a closed bar until clicked; only one is open at a time */
.panelTitle { cursor: pointer; user-select: none; }
.panelTitle::after { content: ' \25B4'; }
.panel.closed .panelTitle::after { content: ' \25BE'; }
.panel.closed .viewTabs, .panel.closed .summaryList, .panel.closed #historyList { display: none; }
#jobSummary.closed, #historyBox.closed { padding: 6px 10px; }
.panel.closed .panelTitle { margin: 0; }
#jobSummary:not(.closed) .summaryList { max-height: 52vh; }
#historyBox:not(.closed) { max-height: 66vh; }
/* While one of them is open, the small boxes get smaller to make room */
/* Normal: two rows of boxes (2 x 140px + 16px gap + 16px padding), then it scrolls inside */
#homeRow { max-height: none; }
#homeRow #home { height: 314px; }
/* Compact: one row (68px + 8px padding), then it scrolls inside */
body.compactBoxes #homeRow #home { height: 78px; padding-top: 4px; padding-bottom: 4px; gap: 8px; }
body.compactBoxes .tile { width: 110px; height: 68px; border-width: 2px; border-radius: 12px; gap: 0; padding: 4px; }
body.compactBoxes .tile .name { font-size: 14px; margin-top: 8px; }
body.compactBoxes .tile .num { font-size: 15px; }
body.compactBoxes .tile .opened { display: none; }
body.compactBoxes .tile .rename, body.compactBoxes .tile .removeTile { padding: 0 5px; font-size: 12px; top: 3px; }
.startMic.blue { background: #d32f2f; }
.startMic.green { background: #2e9e44; }
.startMic.listening { box-shadow: 0 0 0 14px rgba(224,69,123,0.45); }
.enterBtn { padding: 12px 40px; font-size: 22px; font-weight: bold; border: none; border-radius: 26px; background: #4a6cf7; color: white; cursor: pointer; }
#startPage { gap: 22px; }
.enterBtn { width: 270px; max-width: 80vw; }
.personalBtn { width: 180px; max-width: 54vw; margin-top: -10px; padding: 9px 12px; font-size: 18px; font-weight: bold; border: none; border-radius: 22px; background: #2a6df4; color: white; cursor: pointer; }
/* Personal page */
#personalPage { width: 100%; max-width: 620px; margin: 0 auto; padding-top: 6px; }
#personalPage h1 { color: #2a6df4; }
#personalList { background: white; border: 2px solid #2a6df4; border-radius: 12px; padding: 8px; }
.perLine { display: grid; grid-template-columns: auto 1fr auto auto auto; gap: 8px; align-items: center; padding: 5px 4px; border-bottom: 1px solid #eee; font-size: 15px; }
.perLine .perDate { color: #888; font-size: 13px; }
.perLine .perNote { min-width: 0; overflow-wrap: anywhere; }
.perLine strong { direction: ltr; white-space: nowrap; }
.perTotal { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; text-align: center; background: #dfeaff; border-bottom: 2px solid #2a6df4; padding: 5px 4px; font-size: 14px; font-weight: bold; margin-bottom: 6px; }
.perTotal span { display: block; font-size: 12px; color: #555; font-weight: normal; }
#startMsg { max-width: 90vw; }
/* Website: loading screen and the question boxes that replace the browser's own pop-ups */
#loadingPage { display: flex; justify-content: center; align-items: center; min-height: 80vh; font-size: 20px; color: #555; text-align: center; flex-direction: column; gap: 14px; }
#loadingPage button { padding: 9px 18px; font-size: 15px; border: none; border-radius: 8px; background: #4a6cf7; color: white; cursor: pointer; }
#askOverlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 60; align-items: center; justify-content: center; }
#askOverlay.show { display: flex; }
#pickOverlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 60; align-items: center; justify-content: center; }
#pickOverlay.show { display: flex; }
#pickText { white-space: pre-wrap; text-align: center; font-size: 16px; margin: 0; }
#pickList button { width: 100%; padding: 10px; font-size: 17px; border: 1px solid #4a6cf7; border-radius: 8px; background: #f4f6ff; cursor: pointer; text-align: center; }
#pickList button.pickPersonal { background: #2a6df4; color: white; border-color: #2a6df4; font-weight: bold; }
#askText { white-space: pre-wrap; text-align: center; font-size: 16px; margin: 0; }
#syncMsg { position: fixed; bottom: 8px; left: 8px; right: 8px; text-align: center; font-size: 14px; color: white; background: crimson; border-radius: 8px; padding: 6px; display: none; z-index: 70; }
</style>

<style id="voiceWalletTheme">
/* ===== New look: dark "voice wallet". Only colours and shapes change; the layout and the buttons stay the same. ===== */
:root {
  --bg: #0F1117; --surface: #1A1D27; --surface2: #232736; --line: var(--hover);
  --text: #F2F3F7; --muted: #9AA0B4; --soft: #C9CDD9;
  --red: #FF6B5B; --redText: #FF8A7D; --redBg: #1F1315; --redLine: #4A2226;
  --green: #34D399; --greenText: #6EE7B7; --greenBg: #11201B; --greenLine: #1F4A3A;
  --violet: #A78BFA; --violetText: #C4B5FD; --violetBg: #1C1730; --violetLine: #3B2F63;
  --blue: #2563EB; --blueText: #93C5FD; --blueBg: #121C2E; --blueLine: #23406E;
  --orange: #FDBA74; --orangeBg: #2A2113; --orangeLine: #4A3518;
  --gold: #FBBF24; --goldBg: #231C0B; --goldLine: #5C4710;
  --hover: #2E3344; --rowLine: #262A38; --goldText: #FDE68A; --tileHoverLine: #3E4458; --arrowBg: #3A1A1C;
  --violetDash: #6D5BB8; --violetListen: #2A2148; --greenHover: #163026; --goldInputLine: #8A6A12;
  --overlay: rgba(5,6,10,0.72); --shadow: rgba(0,0,0,0.55);
  --num: Rubik, Heebo, Arial, sans-serif;
  color-scheme: dark;
}
/* Light style: the same layout with light colours. Chosen in Settings, saved as money_theme. */
html[data-theme="light"] {
  --bg: #F4F5F9; --surface: #FFFFFF; --surface2: #EEF0F5; --line: #DCE0E9;
  --text: #161A24; --muted: #5E6475; --soft: #3A4050;
  --redText: #C2352A; --redBg: #FFF0EE; --redLine: #F4C3BD;
  --greenText: #0F7A55; --greenBg: #EAF8F1; --greenLine: #B3E3CD;
  --violetText: #5B3FC4; --violetBg: #F2EEFF; --violetLine: #D5CAFB;
  --blueText: #1D4ED8; --blueBg: #EBF2FF; --blueLine: #BCD0F8;
  --orange: #B45309; --orangeBg: #FFF4E5; --orangeLine: #F2CF9F;
  --gold: #A16207; --goldBg: #FFF8DB; --goldLine: #EBD382;
  --hover: #E3E6EE; --rowLine: #E7EAF1; --goldText: #854D0E; --tileHoverLine: #C6CBD8; --arrowBg: #FFE1DC;
  --violetDash: #A08BE8; --violetListen: #E4DBFF; --greenHover: #D9F2E6; --goldInputLine: #D6AF45;
  --overlay: rgba(20,24,36,0.45); --shadow: rgba(20,24,36,0.18);
  color-scheme: light;
}
html[data-theme="light"] .tile, html[data-theme="light"] .summaryBox, html[data-theme="light"] #historyBox, html[data-theme="light"] .col.in { box-shadow: 0 1px 3px rgba(20,24,36,0.06); }
body { background: var(--bg); color: var(--text); font-family: Heebo, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
h1, h2, h3, .enterBtn, .personalBtn, .startMic, .homeMic, .finishBtn, .tile .name, .total, .amount, .num { font-family: var(--num); }
button { font-family: inherit; transition: transform .12s ease, background-color .15s ease, box-shadow .2s ease; }
button:active { transform: scale(0.97); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--violetText); outline-offset: 2px; }
input { background: var(--bg); color: var(--text); border-color: var(--line) !important; }
input::placeholder { color: var(--muted); }
.ico { width: 1em; height: 1em; vertical-align: -0.15em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* Text colours */
.income { color: var(--greenText); }
.personal { color: var(--redText); }
.job, .jobColor { color: var(--orange); }
.blueColor { color: var(--blueText); }
h1 { font-weight: 800; font-size: 24px; letter-spacing: -0.3px; }

/* Corner buttons */
.langBtn, #toFront { height: 44px; min-width: 44px; padding: 0 14px !important; border-radius: 22px !important; border: 1px solid var(--line) !important; background: var(--surface) !important; color: var(--text) !important; font-family: var(--num); font-size: 15px !important; display: flex; align-items: center; justify-content: center; }
/* Back button (top right on every page): red, a bit wider, with the back symbol */
#toFront { min-width: 64px; padding: 0 18px !important; font-size: 24px !important; font-weight: 700; line-height: 1; background: var(--red) !important; border-color: var(--red) !important; color: #1A0B0A !important; box-shadow: 0 4px 14px rgba(255,107,91,0.25); }
#toFront:hover { background: #FF8072 !important; }
#toFront .backArrow { width: 26px; height: 26px; display: block; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
/* Room at the top of the cards page so the back and language buttons don't cover it */
#jobSide { margin-top: 60px; }
#toFront[style*="display: block"], #toFront[style*="display:block"] { display: flex !important; }

/* Start page */
#startPage { padding-top: 40px; }
.startMic { border-radius: 30px; gap: 12px; }
.startMic .micIcon { width: 64px; height: 64px; border-radius: 32px; display: flex; align-items: center; justify-content: center; font-size: 30px; }
.startMic .micLabel { font-family: var(--num); }
.startMic.blue { background: var(--redBg); border: 2px solid var(--red); color: var(--redText); }
.startMic.blue .micIcon { background: var(--red); color: #1A0B0A; }
.startMic.green { background: var(--greenBg); border: 2px solid var(--greenLine); color: var(--greenText); }
.startMic.green .micIcon { background: var(--green); color: #062016; }
.startMic.purple { border-radius: 50%; background: var(--violetBg); border: 2px solid var(--violetLine); color: var(--violetText); }
.startMic.purple .micIcon { width: 48px; height: 48px; background: var(--violet); color: #160F2E; font-size: 22px; }
.startMic.blue.listening { box-shadow: 0 0 0 8px rgba(255,107,91,0.18), 0 0 0 20px rgba(255,107,91,0.07); animation: micPulse 1.4s ease-in-out infinite; }
.startMic.green.listening { box-shadow: 0 0 0 8px rgba(52,211,153,0.18), 0 0 0 20px rgba(52,211,153,0.07); animation: micPulse 1.4s ease-in-out infinite; }
.startMic.purple.listening { box-shadow: 0 0 0 8px rgba(167,139,250,0.2), 0 0 0 20px rgba(167,139,250,0.08); animation: micPulse 1.4s ease-in-out infinite; }
@keyframes micPulse { 50% { transform: scale(1.04); } }
@media (prefers-reduced-motion: reduce) { .listening { animation: none !important; } }
#startMsg { color: var(--muted); font-size: 14px; line-height: 1.6; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 12px 16px; }
#startMsg:empty { display: none; }
.enterBtn { height: 56px; padding: 0 24px; border-radius: 18px; background: var(--text); color: var(--bg); font-size: 19px; }
.personalBtn { height: 48px; margin-top: -8px; border-radius: 16px; border: 1px solid var(--blueLine); background: var(--blueBg); color: var(--blueText); font-size: 17px; }

/* Cards page */
.homeMic { width: min(320px, 90vw); height: 52px; border-radius: 18px; border: 1.5px dashed var(--violetDash); background: var(--violetBg); color: var(--violetText); font-size: 18px; font-weight: 700; }
.homeMic.listening { background: var(--violetListen); }
.homeMicMsg { color: var(--muted); }
.tile { border-radius: 22px; background: var(--surface); border: 1px solid var(--line); padding: 14px; gap: 6px; }
.tile:hover { background: var(--surface2); border-color: var(--tileHoverLine); }
.tile .name { font-size: 17px; font-weight: 700; color: var(--text); margin-top: 10px; }
.tile .num { font-size: 22px; font-weight: 700; color: var(--orange); direction: ltr; }
.tile .opened { font-size: 11px; color: var(--muted); }
.tile .rename, .tile .removeTile { width: 28px; height: 28px; padding: 0; border-radius: 9px; background: var(--surface2); color: var(--soft); font-size: 13px; display: flex; align-items: center; justify-content: center; }
.tile .removeTile:hover { background: var(--redBg); color: var(--redText); }
.tile .rename:hover { background: var(--hover); color: var(--text); }
body.compactBoxes .tile { border-width: 1px; border-radius: 14px; }
body.compactBoxes .tile .rename, body.compactBoxes .tile .removeTile { width: 20px; height: 20px; font-size: 10px; }

.summaryBox, #historyBox { background: var(--surface); border-radius: 22px; padding: 14px 16px; }
#jobSummary { border: 1px solid var(--orangeLine); }
#historyBox { border: 1px solid var(--violetLine); }
.historyTitle { color: var(--violetText); }
.panelTitle { font-size: 17px; font-weight: 700; }
.viewTabs { background: var(--bg); border-radius: 14px; padding: 4px; gap: 4px; }
.viewTab { flex: 1; height: 36px; border: none; border-radius: 10px; background: transparent; color: var(--muted); font-size: 14px; }
.viewTab.active { background: var(--line); color: var(--text); font-weight: 700; }
#personalPage .viewTab.active { background: var(--blue); color: #fff; }
.periodRow { border-bottom: 1px solid var(--rowLine); font-size: 15px; padding: 8px 6px; }
.periodRow.head { background: var(--surface); color: var(--muted); font-weight: 500; font-size: 12px; }
.periodTitle { background: var(--orangeBg); color: var(--goldText); border-radius: 12px; padding: 8px 12px; margin: 10px 0 4px; }
#personalPage .periodTitle { background: var(--blueBg); color: var(--blueText); }
.periodRow.totalRow { background: var(--orangeBg); border-bottom: none; border-radius: 12px; color: var(--goldText); }
#jobSummaryList .clickRow:hover { background: var(--surface2); }
#jobSummaryList .clickRow .period { color: var(--orange); }
.periodDetail { background: var(--bg); border-bottom: 1px solid var(--rowLine); border-radius: 12px; margin: 2px 0 4px; }
.detailLine > div:first-child { color: var(--muted); }
.detailAmount { color: var(--redText); }
.detailTotal { border-top-color: var(--line); }
.histRow { border-bottom: 1px solid var(--rowLine); }
.histRow:hover { background: var(--surface2); }
.histRow.checked { background: var(--greenBg); }
.histRow.checked:hover { background: var(--greenHover); }
.histRow.head, .histRow.head:hover { background: var(--surface); color: var(--muted); }
.histRow .histDates { color: var(--muted); }
.histRow button { background: var(--violet); color: #160F2E; font-weight: 700; border-radius: 9px; padding: 5px 10px; }
.histRow input[type=checkbox] { accent-color: var(--green); }
.savedTitle { color: var(--muted); }

#fileBar { padding: 10px 0 16px; }
.fileBtn { height: 44px; padding: 0 16px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); color: var(--soft); font-size: 15px; }
.fileBtn.load { background: transparent; }
.fileBtn:hover { background: var(--surface2); color: var(--text); }
.fileMsg { color: var(--muted); }

/* Open card */
.openedLine { color: var(--muted); font-size: 12px; }
.titleEdit { width: 32px; height: 32px; padding: 0; border-radius: 10px; background: var(--surface2); color: var(--soft); font-size: 15px; }
.top { flex-direction: row; justify-content: center; gap: 10px; margin-top: 6px; }
.typeArea { width: auto; flex: 0 1 300px; }
button.bigMic { width: 60px; height: 60px; border-radius: 30px; background: var(--red); color: #1A0B0A; font-size: 26px; box-shadow: 0 0 0 6px rgba(255,107,91,0.15); }
button.bigMic.listening { background: var(--red); box-shadow: 0 0 0 8px rgba(255,107,91,0.25), 0 0 0 18px rgba(255,107,91,0.08); animation: micPulse 1.4s ease-in-out infinite; }
.typeRow { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 5px; gap: 6px; }
.typeRow input { flex: 1 1 auto; width: auto; border: none !important; background: transparent; font-family: var(--num); font-size: 18px; padding: 8px 10px; }
.typeRow input:focus { outline: none; }
.typeRow button.arrowJob { width: 46px; height: 42px; padding: 0; border-radius: 12px; background: var(--arrowBg); color: var(--redText); font-size: 20px; }
.heard { color: var(--muted); font-size: 14px; margin: 10px 0; }
.col { border-radius: 24px; padding: 16px; margin-bottom: 12px; }
.col.in { background: var(--greenBg); border: 1px solid var(--greenLine); }
.col h2 { font-size: 17px; text-align: start; margin-bottom: 12px; }
.col h2.income { color: var(--greenText); }
.cards { gap: 10px; margin-bottom: 10px; }
.card { background: var(--bg); border-radius: 16px; padding: 12px; text-align: start; gap: 6px; }
.card h3 { color: var(--muted); font-size: 12px; }
.card .total, .card .amount { font-size: 24px; direction: ltr; text-align: end; }
html[dir=ltr] .card .total, html[dir=ltr] .card .amount { text-align: start; }
.card.moneyInCard .addIncome { top: 10px; right: auto; inset-inline-end: 10px; width: 32px; height: 32px; border-radius: 10px; background: var(--green); color: #062016; font-weight: 700; }
.tenBar { background: var(--goldBg); border: 1px solid var(--goldLine); }
.tenBar h3 { color: var(--goldText); }
.tenBar .amount { color: var(--gold); }
.tenBar input { background: var(--bg); color: var(--gold); border: 1px solid var(--goldInputLine) !important; border-radius: 8px; font-family: var(--num); }
.jobCard { background: var(--redBg); border: 1px solid var(--redLine); }
.jobCard h3 { color: var(--redText); }
.listTitle { color: var(--muted); text-align: start; font-size: 12px; margin: 6px 2px; }
li { background: var(--bg); border-radius: 14px; color: var(--text); }
.entryList li { padding: 8px 10px; margin-bottom: 6px; }
.entryList .entryDate { color: var(--muted); font-size: 11px; }
.entryList strong { font-family: var(--num); }
button.edit, button.del { width: 36px; height: 36px; padding: 0; border-radius: 10px; background: var(--surface2); color: var(--soft); font-size: 14px; }
button.del:hover { background: var(--redBg); color: var(--redText); }
button.edit:hover { background: var(--hover); color: var(--text); }
.belowRow { align-items: stretch; gap: 12px; }
.afterJobBox { background: var(--surface); border: 1px solid var(--orangeLine); border-radius: 20px; padding: 12px 14px; }
.afterJobBox h3 { color: var(--muted); font-size: 12px; }
.afterJobBox .total { font-size: 30px; font-weight: 800; direction: ltr; }
.finishWrap { flex: 1; }
.finishBtn { width: 100%; height: 100%; min-height: 56px; border-radius: 18px; background: var(--violet); color: #160F2E; font-size: 17px; }

/* Personal page */
#personalPage { padding-top: 56px; }
#personalPage h1 { color: var(--blueText); }
#personalCards .card { background: var(--blueBg); border: 1px solid var(--blueLine); }
#personalList { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 8px; }
.perLine { border-bottom: 1px solid var(--rowLine); padding: 10px 6px; }
.perLine .perDate { color: var(--muted); font-size: 12px; }
.perLine strong { font-family: var(--num); }
.perTotal { background: var(--blueBg); border-bottom: none; border-radius: 12px; color: var(--blueText); padding: 8px 4px; }
.perTotal span { color: var(--muted); }

/* Windows that open on top */
#nameOverlay, #askOverlay, #pickOverlay { background: var(--overlay); backdrop-filter: blur(4px); }
.nameDialog { background: var(--surface); border: 1px solid var(--line); border-radius: 24px; padding: 20px; box-shadow: 0 20px 60px var(--shadow); color: var(--text); }
.nameDialog h3 { font-size: 18px; }
.nameDialog input { background: var(--bg); color: var(--text); border-radius: 14px; padding: 12px; }
.nameMic { background: var(--violet); color: #160F2E; }
.nameMic.listening { background: var(--violet); box-shadow: 0 0 0 6px rgba(167,139,250,0.25); }
.nameMicMsg { color: var(--muted); }
.nameDialog .savedTitle { color: var(--muted); font-size: 13px; }
.savedItem button.pick { background: var(--surface2); border: 1px solid var(--line); color: var(--text); border-radius: 14px; }
.savedItem button.pick:hover { background: var(--hover); }
.savedItem button.forget { background: var(--surface2); color: var(--soft); border-radius: 14px; }
.dialogButtons button { height: 46px; padding: 0 22px; border-radius: 14px; font-weight: 700; }
.dialogButtons .okBtn { background: var(--green); color: #062016; }
.dialogButtons .cancelBtn { background: transparent; border: 1px solid var(--line); color: var(--soft); }
#askText, #pickText { color: var(--text); line-height: 1.6; }
#pickList button { min-height: 52px; background: var(--surface2); border: 1px solid var(--line); color: var(--text); border-radius: 16px; font-family: var(--num); font-weight: 500; }
#pickList button:hover { background: var(--hover); border-color: var(--orange); }
#pickList button.pickPersonal { background: var(--blue); border-color: var(--blue); color: #fff; }
#loadingPage { color: var(--muted); }
#loadingPage button { background: var(--violet); color: #160F2E; border-radius: 14px; font-weight: 700; }
#syncMsg { background: var(--redBg); border: 1px solid var(--red); color: var(--redText); border-radius: 14px; padding: 10px; }

/* View buttons: room for "by name" and "by category" */
.viewTabs { flex-wrap: wrap; }
.viewTab { flex: 1 1 auto; min-width: 56px; padding: 0 10px; white-space: nowrap; }
#jobSummaryList .periodRow.byName, .periodRow.byName { grid-template-columns: 1.4fr 1fr 1fr 1fr; }
#jobSummaryList .periodRow.catRow, .periodRow.catRow { grid-template-columns: 1.6fr 1fr; }
#jobSummaryList .periodRow.byName.clickRow .period { color: var(--orange); }
#personalList .periodRow .period { color: var(--blueText); }

/* What was bought: a small tag under the words */
.itemChip { display: inline-block; align-self: flex-start; margin-top: 3px; padding: 2px 9px; border-radius: 10px; background: var(--goldBg); border: 1px solid var(--goldLine); color: var(--goldText); font-size: 12px; font-weight: 500; line-height: 1.5; }
.perNote .itemChip { display: table; }

/* Items and categories window */
#itemsOverlay { display: none; position: fixed; inset: 0; background: var(--overlay); backdrop-filter: blur(4px); z-index: 55; align-items: center; justify-content: center; }
#itemsOverlay.show { display: flex; }
.itemsDialog { width: 380px; }
.itemAddRow { display: flex; gap: 8px; }
.itemAddRow select, .itemRow select { flex: 1; min-width: 0; height: 44px; padding: 0 10px; border-radius: 14px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font-family: inherit; font-size: 15px; }
.itemAddBtn { height: 44px; padding: 0 20px; border: none; border-radius: 14px; background: var(--green); color: #062016; font-weight: 700; font-size: 15px; cursor: pointer; }
.itemsList { max-height: 300px; }
.itemCatHead { font-size: 12px; font-weight: 700; color: var(--gold); margin: 8px 2px 0; }
.itemRow { display: grid; grid-template-columns: 1fr 130px auto; gap: 6px; align-items: center; }
.itemRow select { height: 40px; font-size: 13px; }
.itemName { height: 40px; padding: 0 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface2); color: var(--text); font-size: 15px; text-align: start; cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.itemName:hover { border-color: var(--gold); }
.itemsOpenBtn { color: var(--goldText); border-color: var(--goldLine); }
#personalPage .itemsOpenBtn { display: block; margin: 14px auto 20px; }

/* עסק: a line like "סיכום העבודה", above it */
#businessRow { display: flex; margin: 4px 0 8px 0; }
#businessBox { border: 1px solid var(--orangeLine); }
.panel.closed #businessList, .panel.closed #clearHistoryBtn { display: none; }
.clearHistoryBtn { align-self: center; margin-top: 10px; flex-shrink: 0; color: var(--redText); border-color: var(--redLine); background: var(--redBg); }
.clearHistoryBtn:hover { background: var(--redBg); color: var(--red); border-color: var(--red); }
#businessBox.closed { padding: 6px 10px; }
body.businessOpen #home { display: none !important; }
#businessBox:not(.closed) .summaryList { max-height: 52vh; }
.bizTitle { display: flex; justify-content: space-between; align-items: center; font-weight: 700; }
.bizTitle .foldSum { direction: ltr; }
.bizTitle.bizIn { background: var(--greenBg); color: var(--greenText); }
.bizTitle.bizOut { background: var(--redBg); color: var(--redText); }
.bizLine { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 6px; border-bottom: 1px solid var(--rowLine); cursor: pointer; }
.bizLine:hover { background: var(--surface2); }
.bizText { display: flex; flex-direction: column; gap: 2px; min-width: 0; text-align: start; }
.bizName { font-weight: 700; font-size: 15px; }
.bizNote { font-size: 13px; color: var(--soft); overflow-wrap: anywhere; }
.bizNote:empty { display: none; }
.bizDate { font-size: 11px; color: var(--muted); }
.bizLine strong { font-family: var(--num); direction: ltr; white-space: nowrap; }
.periodRow.bizTotal { grid-template-columns: 1fr auto; margin-top: 8px; }
/* אישי: the "נכנס" and "יצא" cards open their part of the page */
#personalCards .card.clickCard { font: inherit; color: inherit; cursor: pointer; border-width: 2px; }
#personalCards .card.clickCard:hover { background: var(--surface2); }
#personalCards .card.clickCard h3::after { content: ' \25BE'; }
#personalCards .card.clickCard.open h3::after { content: ' \25B4'; }
#personalCards .card.inCard.open { border-color: var(--green); background: var(--greenBg); }
#personalCards .card.outCard.open { border-color: var(--red); background: var(--redBg); }
.perSectionTitle { font-size: 18px; font-weight: 700; text-align: start; margin: 6px 2px 10px; }
.perTotal.perTotalOne { grid-template-columns: 1fr; }

/* Settings: the gear at the top right of the first page, and its window */
.settingsBtn { position: fixed; top: 8px; right: 8px; z-index: 10; width: 44px; height: 44px; padding: 0; border-radius: 22px; border: 1px solid var(--line); background: var(--surface); color: var(--text); font-size: 22px; display: none; align-items: center; justify-content: center; cursor: pointer; }
.settingsBtn.show { display: flex; }
.settingsBtn:hover { background: var(--surface2); }
#settingsOverlay { display: none; position: fixed; inset: 0; background: var(--overlay); backdrop-filter: blur(4px); z-index: 55; align-items: center; justify-content: center; }
#settingsOverlay.show { display: flex; }
.settingsDialog { width: min(360px, 92vw); }
.switchRow { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 12px 0; cursor: pointer; text-align: start; }
.switchRow .switchText { display: flex; flex-direction: column; gap: 3px; }
.switchRow .switchLabel { font-size: 16px; font-weight: 500; color: var(--text); }
.switchRow .switchNote { font-size: 13px; color: var(--muted); }
.switchRow input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.switchTrack { flex-shrink: 0; width: 50px; height: 30px; border-radius: 15px; background: var(--line); position: relative; transition: background-color .15s ease; }
.switchTrack::after { content: ''; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 12px; background: #fff; transition: transform .15s ease; }
.switchRow input:checked + .switchTrack { background: var(--green); }
.switchRow input:checked + .switchTrack::after { transform: translateX(20px); }
.switchRow input:focus-visible + .switchTrack { outline: 2px solid var(--violetText); outline-offset: 2px; }
</style>

<script>
// ===== Website version (claude.ai page) =====
// The data lives in the page's own database, readable and changeable only by the owner, so the PC and
// the phone show the same boxes. Layout: app/meta {money_lang, money_names, money_emails, order} and
// app/meta/boxes/<boxId>, one document per box. The rest of the app still talks to "LS", a stand-in for
// localStorage that keeps everything in memory and writes the changes to the database a moment later.
const LS_MEM = {};
const META_KEYS = ['money_lang', 'money_names', 'money_emails', 'money_items', 'money_cats', 'money_hide_hints', 'money_theme'];
let booted = false;
let cloud = null;                        // database references, or null when there is no database
const written = { meta: null, boxes: {}, personal: null }; // what the database holds (as JSON text)
let syncTimer = null, syncing = false, syncAgain = false;
let dictation = null;                    // claude.ai speech-to-text, when this browser has it

const LS = {
  getItem(k) { return Object.prototype.hasOwnProperty.call(LS_MEM, k) ? LS_MEM[k] : null; },
  setItem(k, v) { LS_MEM[k] = String(v); scheduleSync(); },
  removeItem(k) { if (k in LS_MEM) { delete LS_MEM[k]; scheduleSync(); } }
};

function claudeUse(name) {
  const c = window.claude;
  if (!c || typeof c.use !== 'function') return Promise.resolve(null);
  return Promise.resolve(c.use(name)).catch(() => null);
}
function withTimeout(p, ms) { return Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))]); }

function metaFromMem() {
  const m = {};
  META_KEYS.forEach(k => { if (k in LS_MEM) m[k] = LS_MEM[k]; });
  let list = []; try { list = JSON.parse(LS_MEM.money_boxes || '[]'); } catch (e) { list = []; }
  m.order = list.map(b => b.id);
  return m;
}

// Reads everything from the database into memory. Throws if the database can't be reached.
async function cloudLoad() {
  const db = await claudeUse('db');
  if (!db) {
    // Opened outside claude.ai: fall back to this browser's own storage.
    try { Object.keys(localStorage).forEach(k => { if (k.indexOf('money_') === 0) LS_MEM[k] = localStorage.getItem(k); }); } catch (e) { /* none */ }
    return;
  }
  const meta = db.doc('app/meta');
  const boxesCol = meta.collection('boxes');
  const personalDoc = db.doc('app/personal'); // personal money, said with "אישי"
  const snaps = await withTimeout(Promise.all([meta.get(), boxesCol.get(), personalDoc.get()]), 20000);
  const p = snaps[2].exists ? snaps[2].data() : null;
  const personalJson = p && typeof p.list === 'string' ? p.list : null;
  const m = snaps[0].exists ? snaps[0].data() : {};
  const byId = {};
  const fresh = {};
  snaps[1].docs.forEach(d => { if (d.exists) { byId[d.id] = d.data(); fresh[d.id] = JSON.stringify(d.data()); } });
  const order = Array.isArray(m.order) ? m.order : [];
  const list = order.filter(id => byId[id]).map(id => byId[id]);
  Object.keys(byId).forEach(id => { if (order.indexOf(id) < 0) list.push(byId[id]); });
  Object.keys(LS_MEM).forEach(k => delete LS_MEM[k]);
  META_KEYS.forEach(k => { if (typeof m[k] === 'string') LS_MEM[k] = m[k]; });
  if (list.length) LS_MEM.money_boxes = JSON.stringify(list);
  if (personalJson) LS_MEM.money_personal = personalJson;
  written.boxes = fresh;
  written.meta = snaps[0].exists ? JSON.stringify(metaFromMem()) : null;
  written.personal = personalJson;
  cloud = { meta: meta, boxesCol: boxesCol, personal: personalDoc };
}

function scheduleSync() {
  if (!booted) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(() => { syncTimer = null; syncNow(); }, 400);
}
function showSyncError(text) {
  const el = document.getElementById('syncMsg');
  el.textContent = text;
  el.style.display = text ? 'block' : 'none';
}
// Writes only what changed: each box that changed, boxes that were deleted, then the names and settings.
async function syncNow() {
  if (!cloud) {
    try { Object.keys(LS_MEM).forEach(k => localStorage.setItem(k, LS_MEM[k])); } catch (e) { /* none */ }
    return;
  }
  if (syncing) { syncAgain = true; return; }
  syncing = true;
  try {
    let list = []; try { list = JSON.parse(LS_MEM.money_boxes || '[]'); } catch (e) { list = []; }
    const now = {};
    for (const b of list) {
      const json = JSON.stringify(b);
      now[b.id] = true;
      if (written.boxes[b.id] !== json) { await cloud.boxesCol.doc(b.id).set(JSON.parse(json)); written.boxes[b.id] = json; }
    }
    for (const id of Object.keys(written.boxes)) {
      if (!now[id]) { await cloud.boxesCol.doc(id).delete(); delete written.boxes[id]; }
    }
    const m = JSON.stringify(metaFromMem());
    if (written.meta !== m) { await cloud.meta.set(JSON.parse(m)); written.meta = m; }
    const pl = LS_MEM.money_personal || '[]';
    if (written.personal !== pl && !(written.personal === null && pl === '[]')) { await cloud.personal.set({ list: pl }); written.personal = pl; }
    showSyncError('');
  } catch (e) {
    showSyncError(T().syncError);
    setTimeout(scheduleSync, 5000);
  } finally {
    syncing = false;
    if (syncAgain) { syncAgain = false; scheduleSync(); }
  }
}

// When you come back to this tab (for example after adding something on the phone), get the latest data.
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState !== 'visible' || !booted || !cloud || syncing || syncTimer) return;
  if (document.getElementById('nameOverlay').classList.contains('show') || document.getElementById('askOverlay').classList.contains('show')) return;
  try { await cloudLoad(); } catch (e) { return; }
  if (syncing || syncTimer) return;
  lang = LS.getItem('money_lang') || 'he';
  boxes = loadBoxes();
  personal = loadPersonal();
  if (currentId && !cur()) closeApp();
  applyLang();
});

// Question boxes on the page itself (the browser's own pop-ups are blocked inside claude.ai).
function ask(message, withInput, def) {
  return new Promise(resolve => {
    const ov = document.getElementById('askOverlay');
    const inp = document.getElementById('askInput');
    const ok = document.getElementById('askOk');
    const cancel = document.getElementById('askCancel');
    document.getElementById('askText').textContent = message;
    inp.style.display = withInput ? '' : 'none';
    inp.value = withInput && def !== undefined && def !== null ? String(def) : '';
    ok.textContent = T().okBtn;
    cancel.textContent = T().cancelBtn;
    const finish = v => { ov.classList.remove('show'); ok.onclick = cancel.onclick = inp.onkeydown = null; resolve(v); };
    ok.onclick = () => finish(withInput ? inp.value : true);
    cancel.onclick = () => finish(withInput ? null : false);
    inp.onkeydown = e => { if (e.key === 'Enter') ok.onclick(); if (e.key === 'Escape') cancel.onclick(); };
    ov.classList.add('show');
    if (withInput) { inp.focus(); inp.select(); } else ok.focus();
  });
}
function askConfirm(message) { return ask(message, false); }
function askText(message, def) { return ask(message, true, def); }

// The microphone: claude.ai speech-to-text, or the browser's own when that is all there is.
// It stops by itself a moment after you finish talking. Press again to stop sooner.
// Chrome's own recognition (set to he-IL) is best at Hebrew, so it is tried first. If this page is not
// allowed to use it (for example inside claude.ai), that is remembered and claude.ai's speech-to-text is used.
const SR_BLOCKED_KEY = 'mt-browser-speech-blocked';
function browserSpeechBlocked() { try { return localStorage.getItem(SR_BLOCKED_KEY) === '1'; } catch (e) { return false; } }
function markBrowserSpeechBlocked() { try { localStorage.setItem(SR_BLOCKED_KEY, '1'); } catch (e) { /* ignore */ } }
let browserSpeechFailed = false; // also kept for this visit, in case storage is not allowed

// The recording that is running now (browser speech), so a second press on the same mic can stop it.
let activeRec = null;
function startVoice(btn, msgEl, onText) {
  const t = T();
  // Pressing the same mic again: stop now and use what was said so far.
  if (activeRec) {
    const a = activeRec;
    if (a.btn === btn) { a.stop(); return; }
    a.cancel();
  }
  if (SR && (!dictation || (!browserSpeechFailed && !browserSpeechBlocked()))) {
    const rec = new SR();
    rec.lang = t.micLang;
    rec.interimResults = true; // keep what was heard so far, in case the mic is stopped by hand
    let finished = false, heardSoFar = '';
    const finish = () => {
      if (finished) return;
      finished = true;
      btn.classList.remove('listening');
      if (activeRec === me) activeRec = null;
      if (heardSoFar.trim()) onText(heardSoFar.trim());
      else msgEl.textContent = t.cantHear;
    };
    const me = {
      btn: btn,
      // rec.stop() makes the browser hand over the last words at once; finish() runs on that result or on the end.
      stop: () => { msgEl.textContent = t.stopping; try { rec.stop(); } catch (e) { finish(); } },
      cancel: () => { finished = true; btn.classList.remove('listening'); if (activeRec === me) activeRec = null; try { rec.abort(); } catch (e) { /* ignore */ } }
    };
    rec.onstart = () => { btn.classList.add('listening'); msgEl.textContent = t.listening; };
    rec.onend = finish;
    rec.onerror = e => {
      const blocked = ['not-allowed', 'service-not-allowed', 'audio-capture', 'network'].indexOf(e.error) >= 0;
      if (blocked && dictation) {
        finished = true;
        btn.classList.remove('listening');
        if (activeRec === me) activeRec = null;
        browserSpeechFailed = true;
        markBrowserSpeechBlocked();
        msgEl.textContent = t.pressAgain;
      } else if (blocked && e.error === 'not-allowed') {
        finished = true;
        btn.classList.remove('listening');
        if (activeRec === me) activeRec = null;
        msgEl.textContent = t.micBlocked;
      }
      // Other errors: onend follows and finish() uses whatever was heard.
    };
    rec.onresult = e => {
      let said = '', isFinal = false;
      for (let i = 0; i < e.results.length; i++) { said += e.results[i][0].transcript; if (e.results[i].isFinal) isFinal = true; }
      heardSoFar = said;
      if (said.trim()) msgEl.textContent = t.listening + ' "' + said.trim() + '"';
      if (isFinal) finish();
    };
    activeRec = me;
    try { rec.start(); return; } catch (err) { activeRec = null; browserSpeechFailed = true; if (!dictation) { msgEl.textContent = t.noVoice; return; } }
  }
  if (dictation) {
    if (dictation.active()) { msgEl.textContent = t.stopping; dictation.stop().catch(() => {}); return; }
    let text = '';
    let lastPartial = '';
    let timer = null;
    const offs = [];
    const stopIn = ms => { clearTimeout(timer); timer = setTimeout(() => dictation.stop().catch(() => {}), ms); };
    const done = () => { offs.forEach(off => off()); offs.length = 0; clearTimeout(timer); btn.classList.remove('listening'); };
    const explain = code => {
      if (code === 'not_granted') msgEl.textContent = t.micBlocked;
      else if (code === 'unavailable') msgEl.textContent = t.noVoice;
      else if (code !== 'dismissed' && code !== 'stopped' && code !== 'viewer_stopped' && code !== 'hidden') msgEl.textContent = t.cantHear;
    };
    offs.push(dictation.onPartial(e => { if (e.text) { clearTimeout(timer); lastPartial = e.text; msgEl.textContent = t.listening + ' "' + (text + ' ' + e.text).trim() + '"'; } }));
    offs.push(dictation.onFinal(e => { text += (text ? ' ' : '') + e.text; lastPartial = ''; stopIn(1500); }));
    offs.push(dictation.onState(e => {
      if (e.state === 'listening') { btn.classList.add('listening'); msgEl.textContent = t.listening; stopIn(8000); }
      if (e.state !== 'idle') return;
      done();
      // Stopped by a second press: the words not yet final still count.
      const said = (text + ' ' + lastPartial).trim();
      if (said) onText(said);
      else if (e.reason === 'stopped' || e.reason === 'viewer_stopped') msgEl.textContent = t.cantHear;
      else explain(e.reason);
    }));
    // Must start straight from the click.
    dictation.start({ language: lang }).catch(err => { if (!dictation.active() && offs.length) { done(); explain(err && err.code); } });
    return;
  }
  msgEl.textContent = t.noVoice;
}

// Data
function loadBoxes() {
  let boxes = null;
  try { boxes = JSON.parse(LS.getItem('money_boxes') || 'null'); } catch (e) { boxes = null; }
  if (!Array.isArray(boxes) || boxes.length === 0) {
    // First time with boxes: the old single tracker becomes box number 1, nothing is lost.
    let oldEntries = [];
    try { oldEntries = JSON.parse(LS.getItem('money_entries_v2') || '[]'); } catch (e) { oldEntries = []; }
    const oldPct = parseFloat(LS.getItem('money_pct'));
    boxes = [{
      id: 'b' + Date.now(),
      name: LS.getItem('money_app_name') || '',
      entries: oldEntries,
      pct: isNaN(oldPct) ? 10 : oldPct,
      created: new Date().toLocaleDateString()
    }];
    LS.setItem('money_boxes', JSON.stringify(boxes));
  }
  return boxes;
}

let lang = 'he';  // set from the saved data once it has loaded (see boot below)
let boxes = [];
let currentId = null; // the box that is open, or null on the home screen
const heard = document.getElementById('heard');
const listIncome = document.getElementById('listIncome');
const listJob = document.getElementById('listJob');

function T() { return TEXT[lang]; }
function saveBoxes() { LS.setItem('money_boxes', JSON.stringify(boxes)); }
function cur() { return boxes.find(b => b.id === currentId); }
function boxLabel(b, index) { return b.name || (index === 0 ? T().appName : T().newBoxName + (index + 1)); }
function boxTotals(b) {
  const totals = { income: 0, job: 0 };
  b.entries.forEach(e => { if (e.kind === 'income' || e.kind === 'job') totals[e.kind] += e.amount; });
  return totals;
}

// Put the right language on every label.
function applyLang() {
  const t = T();
  document.documentElement.lang = lang;
  document.documentElement.dir = t.dir;
  document.querySelectorAll('[data-t]').forEach(el => { el.textContent = t[el.getAttribute('data-t')]; });
  document.querySelectorAll('[data-p]').forEach(el => { el.placeholder = t[el.getAttribute('data-p')]; });
  document.getElementById('langBtn').textContent = t.button;
  document.getElementById('arrowJob').title = t.jobSpending;
  document.getElementById('titleEdit').title = t.rename;
  document.getElementById('toFront').title = t.back;
  document.getElementById('toFront').setAttribute('aria-label', t.back);
  document.getElementById('settingsBtn').title = t.settingsBtn;
  document.getElementById('settingsBtn').setAttribute('aria-label', t.settingsBtn);
  document.getElementById('hideHintsSwitch').checked = hintsHidden();
  applyTheme();
  const startMsgEl = document.getElementById('startMsg');
  if (isHintText(startMsgEl.textContent)) startMsgEl.textContent = hint('startHint');
  heard.textContent = '';
  renderHome();
  renderPersonal();
  renderSummaries();
  if (currentId) { showName(); render(); }
}
function toggleLang() {
  lang = (lang === 'he') ? 'en' : 'he';
  LS.setItem('money_lang', lang);
  applyLang();
}

// ---- Settings: hide the instruction texts (the ones that tell you what to say) ----
// Saved as money_hide_hints ('1' = hidden), with the other settings, so it stays after a reload.
const HINT_KEYS = ['startHint', 'sayItemHint', 'personalEmpty'];
function hintsHidden() { return LS.getItem('money_hide_hints') === '1'; }
// An instruction text, or nothing when instructions are hidden.
function hint(key) { return hintsHidden() ? '' : T()[key]; }
function isHintText(text) { return HINT_KEYS.some(k => text === TEXT.he[k] || text === TEXT.en[k]); }
function setHintsHidden(hidden) {
  LS.setItem('money_hide_hints', hidden ? '1' : '0');
  applyHints();
}
// Puts the instruction texts on the screen, or takes them away, right now.
function applyHints() {
  document.getElementById('hideHintsSwitch').checked = hintsHidden();
  const startMsg = document.getElementById('startMsg');
  if (startMsg.textContent === '' || isHintText(startMsg.textContent)) startMsg.textContent = hint('startHint');
  const itemMsg = document.getElementById('itemMsg');
  if (itemMsg.textContent === '' || isHintText(itemMsg.textContent)) itemMsg.textContent = hint('sayItemHint');
  renderPersonalPage();
}
// ---- Settings: light or dark style. Saved as money_theme ('light' or 'dark'). ----
function currentTheme() { return LS.getItem('money_theme') === 'light' ? 'light' : 'dark'; }
function applyTheme() {
  const light = currentTheme() === 'light';
  if (light) document.documentElement.setAttribute('data-theme', 'light'); else document.documentElement.removeAttribute('data-theme');
  document.getElementById('lightThemeSwitch').checked = light;
  // Also kept in this browser's own storage, so the page opens in the right style before the data has loaded.
  try { localStorage.setItem('money_theme', light ? 'light' : 'dark'); } catch (e) { /* none */ }
}
function setTheme(theme) {
  LS.setItem('money_theme', theme === 'light' ? 'light' : 'dark');
  applyTheme();
}
function openSettings() {

// The speech service sometimes writes "אישי" in Arabic or English letters, so those spellings count too.
// "פרטי" (private) also works, as a word that is harder to mishear.
const PERSONAL_WORDS = [
  /^ו?[לב]?ה?אישי(ת|ים)?$/, /^ו?[לב]?ה?פרטי(ת)?$/, /^ו?ל?עישי$/,
  /^(personal|private|ishi|ishy|ishe|ishee|eeshi|eshi|ichi|ishi\.)$/,
  // "פרטי" heard as English or Arabic letters
  /^(party|parti|partie|prati|pratti|praty|pratty|pratie|preti|frati|parati|parity)$/,
  /^(و?ل?)?(ب|ف|پ)ا?(ر|ل)(ت|ط)(ي|ى|ی)$/,
  /^(و?ل?)?[اإأآ][يى]?ش[يى]$/, /^(و?ل?)?[اإأآ]يش[يىه]$/, /^(و?ل?)?عيش[يى]$/
];
function saysPersonal(sentence) {

  return words.some(w => PERSONAL_WORDS.some(re => re.test(w)));
}

};
function getItems() {

function normWord(w) {
  return String(w || '').toLowerCase().replace(/[֑-ׇ"'׳״]/g, '')
    .replace(/ך/g, 'כ').replace(/ם/g, 'מ').replace(/ן/g, 'נ').replace(/ף/g, 'פ').replace(/ץ/g, 'צ');
}
function normKey(text) { return String(text || '').split(/\s+/).map(normWord).join(''); }
function itemCategory(name) {
  if (!name) return '';
  const n = normKey(name);
  const it = getItems().find(x => normKey(x.name) === n);
  return it ? (it.cat || '') : '';
}
function editDistance(a, b) {
  const row = [];
  for (let j = 0; j <= b.length; j++) row[j] = j;
  for (let i = 1; i <= a.length; i++) {
    let prev = row[0];
    row[0] = i;
    for (let j = 1; j <= b.length; j++) {
      const keep = row[j];
      row[j] = Math.min(row[j] + 1, row[j - 1] + 1, prev + (a[i - 1] === b[j - 1] ? 0 : 1));
      prev = keep;
    }
  }
  return row[b.length];
}
// Words that are not the item: "שקל", "ש״ח", "על"...
const FILLER_WORDS = ['שקל', 'שקלים', 'שח', 'ש"ח', 'ש״ח', '₪', 'nis', 'ils', 'shekel', 'shekels', 'sheqel', 'על', 'של', 'for', 'of', 'on', 'את'];
function sentenceWords(sentence) {
  return String(sentence || '').toLowerCase().replace(/[.,!?;:()\-،؟]/g, ' ').split(/\s+/).filter(Boolean);
}
// Finds the item from the list that sounds closest to words in what was said.
// Returns { name, used: [the word positions it took] }, or null when nothing is close enough.
function findItem(sentence) {
  const words = sentenceWords(sentence);
  let best = null;
  getItems().forEach(it => {
    const parts = it.name.split(/\s+/).filter(Boolean).map(normWord);
    const k = parts.length;
    const target = parts.join('');
    if (!k || !target) return;
    for (let i = 0; i + k <= words.length; i++) {
      const win = words.slice(i, i + k).map(normWord);
      if (win.some(w => /\d/.test(w))) continue;
      const tries = [win.join('')];
      // Small Hebrew words stuck to the front: ו ל ב ה ש ("לצבע", "והסיליקון")
      const m = win[0].match(/^[ולבהש]{1,2}/);
      if (m && win[0].length - m[0].length >= 2) {
        tries.push(win[0].slice(1) + win.slice(1).join(''));
        if (m[0].length === 2) tries.push(win[0].slice(2) + win.slice(1).join(''));
      }
      let score = 0;
      tries.forEach(tr => {
        let s = 0;
        if (tr === target) s = 1;
        else if (Math.max(tr.length, target.length) >= 4) s = 1 - editDistance(tr, target) / Math.max(tr.length, target.length);
        const sk = soundKey(target);
        if (s < 0.85 && target.length >= 3 && sk.length >= 2 && soundKey(tr) === sk) s = 0.85;
        if (s > score) score = s;
      });
      if (score < 0.75) continue;
      const used = [];
      for (let u = i; u < i + k; u++) used.push(u);
      const better = !best || score > best.score || (score === best.score && (k > best.k || (k === best.k && it.name.length > best.name.length)));
      if (better) best = { name: it.name, score: score, k: k, used: used };
    }
  });
  return best;
}
// What was said, without the item's words (so the card name can be found in the rest).
function withoutItem(sentence, match) {
  if (!match) return sentence;
  return sentenceWords(sentence).filter((w, i) => match.used.indexOf(i) < 0).join(' ');
}
function itemLabel(item) {
  if (!item) return '';
  const cat = itemCategory(item);

// Turns an entry's day into a real date. New entries have a sortable day; old ones had local date text.
function entryDate(e) {
  if (e.day && /^\d{4}-\d{2}-\d{2}$/.test(e.day)) {
    const p = e.day.split('-');
    return new Date(parseInt(p[0], 10), parseInt(p[1], 10) - 1, parseInt(p[2], 10));
  }
  if (e.date) {
    // Old entries saved the date as local text. Try to read it as a day, month and year; skip if unclear.
    const parts = String(e.date).split(/[\/.\-]/).map(x => parseInt(x, 10));
    if (parts.length === 3 && parts.every(x => !isNaN(x))) {
      let d, m, y;
      if (parts[0] > 31) { y = parts[0]; m = parts[1]; d = parts[2]; }
      else {
        y = parts[2]; if (y < 100) y += 2000;
        // A first number above 12 must be the day (day/month/year). Otherwise use the browser's own order.
        const dayFirst = parts[0] > 12 || !/^1[0-2]?\/\d/.test(String(e.date)) || navigator.language.indexOf('en-US') !== 0;
        if (dayFirst) { d = parts[0]; m = parts[1]; } else { m = parts[0]; d = parts[1]; }
      }
      const date = new Date(y, m - 1, d);
      if (!isNaN(date) && date.getMonth() === m - 1) return date;
    }
  }
  return null;
}
function weekStart(d) { const s = new Date(d.getFullYear(), d.getMonth(), d.getDate()); s.setDate(s.getDate() - s.getDay()); return s; }
function periodKey(d, view) {
  if (view === 'day') return dayKey(d);
  if (view === 'month') return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
  const s = weekStart(d);
  return dayKey(s);
}
function periodLabel(key, view) {
  const p = key.split('-');
  if (view === 'day') return new Date(parseInt(p[0], 10), parseInt(p[1], 10) - 1, parseInt(p[2], 10)).toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
  if (view === 'month') return new Date(parseInt(p[0], 10), parseInt(p[1], 10) - 1, 1).toLocaleDateString(undefined, { year: 'numeric', month: 'long' });
  const start = new Date(parseInt(p[0], 10), parseInt(p[1], 10) - 1, parseInt(p[2], 10));
  const end = new Date(start); end.setDate(end.getDate() + 6);
  return start.toLocaleDateString(undefined, { day: 'numeric', month: 'short' }) + ' - ' + end.toLocaleDateString(undefined, { day: 'numeric', month: 'short' });
}
function cell(text, cls) { const c = document.createElement('div'); if (cls) c.className = cls; c.textContent = text; return c; }
// ---- עסק: all the money in and all the spending of every card (open and finished), newest first ----
function renderBusiness() {
  const t = T();
  const box = document.getElementById('businessList');
  box.innerHTML = '';
  const income = [], spending = [];
  boxes.forEach((b, i) => (b.entries || []).forEach(e => {
    if (e.kind === 'income') income.push({ e: e, b: b, i: i });
    else if (e.kind === 'job') spending.push({ e: e, b: b, i: i });
  }));
  const newest = (x, y) => (y.e.day || '').localeCompare(x.e.day || '');
  const total = list => list.reduce((s, x) => s + x.e.amount, 0);
  const tIn = total(income), tOut = total(spending);
  [[t.bizIncome, income, tIn, true], [t.bizSpending, spending, tOut, false]].forEach(part => {
    const title = document.createElement('div');
    title.className = 'periodTitle bizTitle ' + (part[3] ? 'bizIn' : 'bizOut');
    title.append(cell(part[0]), cell((part[3] ? '+' : '-') + part[2].toFixed(2), 'foldSum'));
    box.appendChild(title);
    if (!part[1].length) { box.appendChild(cell(t.bizNone, 'savedTitle')); return; }
    part[1].slice().sort(newest).forEach(x => {
      const row = document.createElement('div');
      row.className = 'bizLine';
      row.title = boxLabel(x.b, x.i);
      row.onclick = () => openApp(x.b.id); // click a line to open its card
      const text = document.createElement('div');
      text.className = 'bizText';
      text.append(cell(boxLabel(x.b, x.i) + (x.b.finished ? ' ✓' : ''), 'bizName'), cell(shownNote(x.e, true), 'bizNote'));
      if (itemTag(x.e)) text.appendChild(cell(itemTag(x.e), 'itemChip'));
      text.appendChild(cell(x.e.date || '', 'bizDate'));
      const amt = document.createElement('strong');
      amt.className = part[3] ? 'income' : 'personal';
      amt.textContent = (part[3] ? '+' : '-') + x.e.amount.toFixed(2);
      row.append(text, amt);
      box.appendChild(row);
    });
  });
  const left = document.createElement('div');
  left.className = 'periodRow totalRow bizTotal';
  left.append(cell(t.colLeft, 'period'), cell((tIn - tOut).toFixed(2)));
  box.appendChild(left);
}
function renderSummaries() {
  const t = T();
  renderBusiness();
  document.getElementById('jobDayBtn').classList.toggle('active', jobView === 'day');
  document.getElementById('jobWeekBtn').classList.toggle('active', jobView === 'week');
  document.getElementById('jobMonthBtn').classList.toggle('active', jobView === 'month');
  document.getElementById('jobNameBtn').classList.toggle('active', jobView === 'name');
  document.getElementById('jobCatBtn').classList.toggle('active', jobView === 'category');
  // (the personal spending summary was removed)

  // By name: each card on its own line with its totals. By category: job spending per category and item.
  if (jobView === 'name' || jobView === 'category') {
    const list = document.getElementById('jobSummaryList');
    list.innerHTML = '';
    if (jobView === 'category') {
      const spent = [];
      boxes.forEach(b => (b.entries || []).forEach(e => { if (e.kind === 'job') spent.push(e); }));
      renderCategoryBreakdown(list, spent, 'job', renderSummaries, t.noPeriods);
      return;
    }
    if (!boxes.length) { list.appendChild(cell(t.noPeriods, 'savedTitle')); return; }
    const head = document.createElement('div');
    head.className = 'periodRow head byName';
    head.append(cell(''), cell(t.colIn), cell(t.colJob), cell(t.colLeft));
    list.appendChild(head);
    let ti = 0, tj = 0;
    boxes.forEach((b, i) => {
      const tt = boxTotals(b);
      ti += tt.income;
      tj += tt.job;
      const row = document.createElement('div');
      row.className = 'periodRow byName clickRow';
      row.title = b.finished ? T().finishedOn + b.finished : '';
      row.append(cell(boxLabel(b, i) + (b.finished ? ' ✓' : ''), 'period'), cell(tt.income.toFixed(2)), cell(tt.job.toFixed(2)), cell((tt.income - tt.job).toFixed(2)));
      row.onclick = () => openApp(b.id);
      list.appendChild(row);
    });
    const total = document.createElement('div');
    total.className = 'periodRow byName totalRow';
    total.append(cell(t.totalLabel, 'period'), cell(ti.toFixed(2)), cell(tj.toFixed(2)), cell((ti - tj).toFixed(2)));
    list.appendChild(total);
    return;
  }

  // Job: every box on its own line, then the total of all the boxes
  const jobPeriods = {};
  boxes.forEach((b, bi) => (b.entries || []).forEach(e => {
    if (e.kind !== 'income' && e.kind !== 'job') return;
    const d = entryDate(e);
    if (!d) return;
    const k = periodKey(d, jobView);
    const period = jobPeriods[k] = jobPeriods[k] || {};
    const row = period[b.id] = period[b.id] || { name: boxLabel(b, bi), income: 0, job: 0, items: [] };
    row[e.kind] += e.amount;
    if (e.kind === 'job') row.items.push(e);
  }));
  const jobBox = document.getElementById('jobSummaryList');
  jobBox.innerHTML = '';
  const jobKeys = Object.keys(jobPeriods).sort().reverse();
  if (jobKeys.length === 0) { jobBox.appendChild(cell(t.noPeriods, 'savedTitle')); }
  else {
    const head = document.createElement('div');
    head.className = 'periodRow head';
    head.append(cell(''), cell(t.colJob), cell(t.colLeft));
    jobBox.appendChild(head);
    jobKeys.forEach((k, idx) => {
      // Each black date bar folds; only the newest is open until you click.
      const foldKey = jobView + '|' + k;
      const open = periodFolds.has(foldKey) ? periodFolds.get(foldKey) : idx === 0;
      const title = document.createElement('div');
      title.className = 'periodTitle foldTitle';
      const periodJob = Object.keys(jobPeriods[k]).reduce((s, id) => s + jobPeriods[k][id].job, 0);
      title.append(cell((open ? '▾ ' : '▸ ') + periodLabel(k, jobView)), cell(periodJob.toFixed(2), 'foldSum'));
      title.onclick = () => { periodFolds.set(foldKey, !open); renderSummaries(); };
      jobBox.appendChild(title);
      if (!open) return;
      let totalIncome = 0, totalJob = 0;
      Object.keys(jobPeriods[k]).forEach(id => {
        const r = jobPeriods[k][id];
        totalIncome += r.income;
        totalJob += r.job;
        const row = document.createElement('div');
        row.className = 'periodRow';
        // Click the name to see only this card's job spending in this period.
        const openKey = jobView + '|' + k + '|' + id;
        const isOpen = openSummaryRows.has(openKey);
        row.classList.add('clickRow');
        row.append(cell((isOpen ? '▾ ' : '▸ ') + r.name, 'period'), cell(r.job.toFixed(2)), cell((r.income - r.job).toFixed(2)));
        row.onclick = () => {
          if (openSummaryRows.has(openKey)) openSummaryRows.delete(openKey); else openSummaryRows.add(openKey);
          renderSummaries();
        };
        jobBox.appendChild(row);
        if (isOpen) {
          const detail = document.createElement('div');
          detail.className = 'periodDetail';
          if (r.items.length === 0) detail.appendChild(cell(t.noSpending, 'savedTitle'));
          r.items.slice().sort((a, b) => (b.day || '').localeCompare(a.day || '')).forEach(e => {
            const line = document.createElement('div');
            line.className = 'detailLine';
            line.append(cell(e.date || ''), cell(shownNote(e, true) + (itemTag(e) ? ' · ' + itemTag(e) : '')), cell('-' + e.amount.toFixed(2), 'detailAmount'));
            detail.appendChild(line);
          });
          // Last line: the total of this card's job spending in this period.
          if (r.items.length) {
            const sumLine = document.createElement('div');
            sumLine.className = 'detailLine detailTotal';
            sumLine.append(cell(''), cell(t.totalLabel + ' - ' + r.name), cell('-' + r.job.toFixed(2), 'detailAmount'));
            detail.appendChild(sumLine);
          }
          jobBox.appendChild(detail);
        }
      });
      const total = document.createElement('div');
      total.className = 'periodRow totalRow';
      total.append(cell(t.totalLabel, 'period'), cell(totalJob.toFixed(2)), cell((totalIncome - totalJob).toFixed(2)));
      jobBox.appendChild(total);
    });
  }

  // Personal money (removed)
  return;
  const perPeriods = {};
  personal.forEach(p => {
    const d = entryDate(p);
    if (!d) return;
    const k = periodKey(d, personalView);
    const period = perPeriods[k] = perPeriods[k] || {};
    const dk = dayKey(d);
    period[dk] = (period[dk] || 0) + p.amount;
  });
  const perBox = document.getElementById('personalSummaryList');
  perBox.innerHTML = '';
  const perKeys = Object.keys(perPeriods).sort().reverse();
  if (perKeys.length === 0) { perBox.appendChild(cell(t.noPeriods, 'savedTitle')); }
  else {
    const head = document.createElement('div');
    head.className = 'periodRow head personalRow';
    head.append(cell(''), cell(t.colSpent));
    perBox.appendChild(head);
    perKeys.forEach(k => {
      const title = document.createElement('div');
      title.className = 'periodTitle';
      title.textContent = periodLabel(k, personalView);
      perBox.appendChild(title);
      let total = 0;
      Object.keys(perPeriods[k]).sort().reverse().forEach(dk => {
        const amount = perPeriods[k][dk];
        total += amount;
        const parts = dk.split('-');
        const dayDate = new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
        const row = document.createElement('div');
        row.className = 'periodRow personalRow';
        row.append(cell(dayDate.toLocaleDateString(), 'period'), cell(amount.toFixed(2)));
        perBox.appendChild(row);
      });
      const totalRow = document.createElement('div');
      totalRow.className = 'periodRow personalRow totalRow';
      totalRow.append(cell(t.totalLabel, 'period'), cell(total.toFixed(2)));
      perBox.appendChild(totalRow);
    });
  }
}

// ---- My personal money: what I take out for myself, saved by day ----
function loadPersonal() {
  try { const list = JSON.parse(LS.getItem('money_personal') || '[]'); return Array.isArray(list) ? list : []; } catch (e) { return []; }
}
let personal = []; // loaded in boot(); amounts said with "אישי" on the red/green mics
function savePersonal() { LS.setItem('money_personal', JSON.stringify(personal)); }
function dayKey(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function addPersonal() {
  const input = document.getElementById('pInput');
  const amount = findAmount(input.value);
  if (amount === null) { document.getElementById('fileMsg').textContent = T().typeFirstPlus; return; }
  const now = new Date();
  personal.unshift({ amount: amount, day: dayKey(now), time: now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) });
  savePersonal();
  input.value = '';
  input.focus();
  renderPersonal();
}
if (document.getElementById('pInput')) document.getElementById('pInput').addEventListener('keydown', e => { if (e.key === 'Enter') addPersonal(); });
function renderPersonal() {
  if (booted) renderPersonalPage();
  if (!document.getElementById('pDays')) return;
  const days = {};
  personal.forEach((p, i) => { (days[p.day] = days[p.day] || []).push({ p: p, i: i }); });

  }
  keys.forEach(k => {
